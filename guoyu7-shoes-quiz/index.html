<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大小剛好的鞋子・閱讀測驗報讀版</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Low-vision read-aloud quiz: one question per screen, huge type, speaker above every answer, 3 colour themes, 4 text sizes */
:root{--fs:30px;--f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body[data-theme="light"]{--bg:#ffffff;--ink:#000000;--card:#ffffff;--line:#000000;--soft:#eef3f8;--acc:#0047ab;--accInk:#ffffff;--sel:#ffe14d;--selInk:#000;--mut:#333;--ok:#0a7a20;--no:#b00020;--spk:#0047ab}
body[data-theme="dark"]{--bg:#000000;--ink:#ffff00;--card:#000000;--line:#ffff00;--soft:#1a1a1a;--acc:#ffff00;--accInk:#000000;--sel:#00e5ff;--selInk:#000;--mut:#ffffff;--ok:#5cff7a;--no:#ff6b6b;--spk:#ffff00}
body[data-theme="cream"]{--bg:#fbf4de;--ink:#1a1209;--card:#fffaf0;--line:#3b2a14;--soft:#f2e6c4;--acc:#7a2e00;--accInk:#ffffff;--sel:#ffd54a;--selInk:#000;--mut:#3b2a14;--ok:#0a6a20;--no:#a00020;--spk:#7a2e00}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:var(--fs);line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:6px solid var(--sel);outline-offset:4px}
.wrap{max-width:1100px;margin:0 auto;padding:16px 18px 120px}
/* top tools */
.tools{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:4px solid var(--line);padding:10px 18px}
.tools .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.ttl{font-weight:900;font-size:.8em;margin-right:auto}
.tg{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:900}
.tb{min-width:56px;min-height:56px;padding:6px 12px;border:3px solid var(--line);background:var(--card);border-radius:14px;font-size:20px;font-weight:900}
.tb[aria-pressed="true"]{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
/* generic */
h1{font-size:1.3em;margin:.4em 0 .2em;font-weight:900}
h2{font-size:1.1em;margin:.3em 0;font-weight:900}
.big{font-size:1em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:72px;padding:.25em .8em;border:4px solid var(--line);background:var(--card);border-radius:20px;font-weight:900;font-size:.9em}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn:disabled{opacity:.35;cursor:default}
.spk{display:inline-flex;align-items:center;gap:.35em;min-height:64px;padding:.15em .7em;border:4px solid var(--spk);color:var(--spk);background:var(--card);border-radius:999px;font-weight:900;font-size:.75em}
.spk svg,.btn svg{width:1.2em;height:1.2em;flex:none}
.spk.on{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
.card{border:4px solid var(--line);border-radius:24px;background:var(--card);padding:18px 20px;margin:16px 0}
/* home */
.sec{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.secb{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:4px solid var(--line);background:var(--card);border-radius:22px;padding:14px 18px;min-height:96px}
.secb .no{flex:none;min-width:3.2em;text-align:center;font-weight:900;background:var(--acc);color:var(--accInk);border-radius:14px;padding:.1em .3em;font-size:.8em}
.secb .nm{flex:1;font-weight:900}
.secb .st{font-size:.65em;font-weight:900;white-space:nowrap}
.secb.done{border-style:double;border-width:8px}
.homeact{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px}
/* question */
.prog{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.dot{position:relative;width:56px;height:56px;border-radius:50%;border:4px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:24px;background:var(--card)}
.dot.cur{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.dot.did:not(.cur){background:var(--soft)}
.dot.did::after{content:"✓";position:absolute;right:-6px;top:-8px;font-size:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.stem{font-size:1.15em;font-weight:900;line-height:1.45;margin:0 0 14px}
.stem .qn{display:inline-block;background:var(--acc);color:var(--accInk);border-radius:12px;padding:0 .35em;margin-right:.3em}
.srow{display:flex;flex-wrap:wrap;gap:12px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:8px}
body.one .opts{grid-template-columns:1fr}
@media (max-width:760px){.opts{grid-template-columns:1fr}}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.ans{width:100%;display:flex;align-items:center;gap:.5em;text-align:left;min-height:110px;padding:.35em .6em;border:5px solid var(--line);border-radius:22px;background:var(--card);font-weight:900;font-size:1.05em;line-height:1.35}
.ans .L{flex:none;width:1.7em;height:1.7em;border-radius:50%;border:4px solid currentColor;display:grid;place-items:center;font-size:.85em}
.ans[aria-checked="true"]{background:var(--sel);color:var(--selInk);border-color:var(--selInk);border-width:8px}
.ans[aria-checked="true"] .L{background:var(--selInk);color:var(--sel)}
.ans[aria-checked="true"]::after{content:"✔ 我選這個";margin-left:auto;font-size:.6em;white-space:nowrap}
.qnav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:4px solid var(--line);padding:10px 14px;z-index:15}
.qnav .in{max-width:1100px;margin:0 auto;display:flex;gap:12px;justify-content:space-between;align-items:center}
.hint{font-size:16px;font-weight:700;color:var(--mut)}
/* review */
.rv{display:flex;flex-wrap:wrap;align-items:center;gap:12px;border:4px solid var(--line);border-radius:20px;padding:12px 16px;margin:12px 0}
.rv .q{flex:1 1 100%;font-weight:900}
.rv .a{font-weight:900;padding:.05em .4em;border-radius:12px;background:var(--sel);color:var(--selInk)}
.rv .a.none{background:var(--no);color:#fff}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:50;padding:16px}
.md{background:var(--card);color:var(--ink);border:5px solid var(--line);border-radius:26px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:20px}
.md img{width:100%;border-radius:16px;display:block}
.ptext{font-size:1.05em;line-height:1.9;font-weight:700}
.ptext span.reading{background:var(--sel);color:var(--selInk);border-radius:6px}
.ptext p{margin:.2em 0 .6em;text-indent:2em}
#qr{background:#fff;color:#000;padding:16px;display:inline-block;border-radius:16px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.8em;word-break:break-all;background:var(--soft);padding:.2em .5em;border-radius:10px}
/* teacher */
table{border-collapse:collapse;width:100%;font-size:.7em}
th,td{border:3px solid var(--line);padding:.3em .45em;text-align:left;vertical-align:top}
th{background:var(--soft)}
.okc{color:var(--ok);font-weight:900}.noc{color:var(--no);font-weight:900}
.score{font-size:1.1em;font-weight:900}
input.codein{font:inherit;font-size:.8em;width:100%;padding:.3em .5em;border:4px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head>
<body data-theme="light">
<div class="tools" role="toolbar" aria-label="閱讀設定"><div class="in">
  <span class="ttl" id="ttl">大小剛好的鞋子・閱讀測驗</span>
  <span class="tg">字<button class="tb" data-fs="26" type="button" aria-label="字體大">大</button><button class="tb" data-fs="32" type="button" aria-label="字體特大">特大</button><button class="tb" data-fs="40" type="button" aria-label="字體超大">超大</button></span>
  <span class="tg">色<button class="tb" data-th="light" type="button" aria-label="白底黑字">白底</button><button class="tb" data-th="dark" type="button" aria-label="黑底黃字">黑底</button><button class="tb" data-th="cream" type="button" aria-label="米色底">米色</button></span>
  <span class="tg">速<button class="tb" data-rate="0.75" type="button" aria-label="慢速">慢</button><button class="tb" data-rate="1" type="button" aria-label="正常速度">中</button><button class="tb" data-rate="1.25" type="button" aria-label="快速">快</button></span>
  <span class="tg"><button class="tb" id="autoBtn" type="button" aria-pressed="true">自動報讀</button><button class="tb" id="colBtn" type="button" aria-pressed="false">選項一排</button></span>
</div></div>
<main class="wrap" id="main" tabindex="-1"></main>
<div class="qnav" id="qnav" hidden><div class="in" id="qnavIn"></div></div>
<div class="sr" aria-live="polite" id="live"></div>
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {

  <p class="big" style="margin:.2em 0">閱讀測驗　報讀版　<span style="font-size:.7em">（已完成 ${doneN} / ${P.length} 段）</span></p>
  <div class="srow"><button class="spk" id="hSay" type="button">${SPK}聽說明</button></div>
  <div class="sec">${P.map((p,i)=>{ const a=ANS[i]||[]; const n=a.filter(x=>x>=0).length; const st=SUB[i]?'✔ 已交卷':(n?`作答中 ${n}/${p.q.length}`:'還沒作答');
    return `<button class="secb${SUB[i]?' done':''}" type="button" data-s="${i}"><span class="no">${esc(D.SHORT[i])}</span><span class="nm">${esc(p.t)}</span><span class="st">${st}</span></button>`; }).join('')}</div>
  <div class="homeact"><button class="btn pri" id="sendBtn" type="button" ${doneN?'':'disabled'}>📤 把結果傳給老師</button></div>`;
  main.querySelector('#hSay').onclick=e=>sayList([D.HELP],mark(e.currentTarget));
  main.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>go('s'+b.dataset.s));
  main.querySelector('#sendBtn').onclick=sendModal;
}
function code(){ return Object.keys(SUB).map(Number).sort((a,b)=>a-b).map(i=>SEC[i]+(ANS[i]||[]).map(x=>x>=0?x+1:0).join('')).join(''); }
function sendModal(){
  const c=code(); const url=(SITE_URL||'')+'#r-'+c;
  const ov=modal(`<h2>把結果傳給老師</h2><p class="big">請老師用手機掃描 QR 碼。</p><div style="text-align:center"><div id="qr"></div></div><p style="font-size:.7em">結果代碼：<span class="code">${esc(c)}</span></p>`);
  try{ const qr=qrcode(0,'M'); qr.addData(url); qr.make(); ov.querySelector('#qr').innerHTML=qr.createSvgTag({cellSize:6,margin:2,scalable:true}); const sv=ov.querySelector('#qr svg'); sv.style.width='min(70vw,340px)'; sv.style.height='auto'; }catch(e){ ov.querySelector('#qr').textContent='（QR 碼無法顯示，請老師輸入結果代碼）'; }
}

/* ---------- quiz ---------- */
let S=0, Q=0;
function renderQuiz(i,j){
  S=i; Q=j; const p=P[i], q=p.q[j]; if(!ANS[i]) ANS[i]=p.q.map(()=>-1);
  const a=ANS[i]; document.getElementById('ttl').textContent=`${D.LAB[i]}・閱讀測驗`;
  main.innerHTML=`<h2>${esc(secName(i))}</h2>
  <div class="prog" aria-label="題號">${p.q.map((_,k)=>`<button class="dot${k===j?' cur':''}${a[k]>=0?' did':''}" type="button" data-g="${k}" aria-label="第${k+1}題${a[k]>=0?'，已作答':''}">${k+1}</button>`).join('')}
    <button class="spk" id="ptBtn" type="button">📖 看課文</button></div>
  <section class="card" aria-labelledby="stem"><p class="stem" id="stem"><span class="qn">${j+1}</span>${esc(q[0])}</p>
    <div class="srow"><button class="spk" id="qSay" type="button">${SPK}聽題目</button><button class="spk" id="allSay" type="button">${SPK}聽題目和選項</button></div></section>
  <div class="opts" role="radiogroup" aria-labelledby="stem">${q[1].map((o,k)=>`<div class="opt"><button class="spk" type="button" data-o="${k}" aria-label="聽選項${ABCD[k]}">${SPK}聽 ${ABCD[k]}</button>
    <button class="ans" type="button" role="radio" aria-checked="${a[j]===k}" data-c="${k}"><span class="L">${ABCD[k]}</span><span>${esc(o)}</span></button></div>`).join('')}</div>`;
  const last=j===p.q.length-1;
  qnav.hidden=false;
  qnavIn.innerHTML=`<button class="btn" id="prevB" type="button" ${j===0?'disabled':''}>◀ 上一題</button>
    <button class="btn" id="homeB" type="button">🏠 目錄</button>
    <button class="btn pri" id="nextB" type="button">${last?'檢查答案 ▶':'下一題 ▶'}</button>`;
  const qS=main.querySelector('#qSay'), aS=main.querySelector('#allSay');
  qS.onclick=()=>sayList([qText(i,j)],mark(qS));
  const readAll=()=>{ const items=[qText(i,j),...q[1].map((_,k)=>oText(i,j,k))]; const ob=[...main.querySelectorAll('[data-o]')];
    sayList(items,x=>{ aS.classList.toggle('on',x>=0); ob.forEach((b,k)=>b.classList.toggle('on',x===k+1)); }); };
  aS.onclick=readAll;
  main.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>sayList([oText(i,j,+b.dataset.o)],mark(b)));
  main.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>choose(+b.dataset.c));
  main.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>go(`s${i}-${b.dataset.g}`));
  main.querySelector('#ptBtn').onclick=()=>textModal(i);
  qnavIn.querySelector('#prevB').onclick=()=>go(`s${i}-${j-1}`);
  qnavIn.querySelector('#nextB').onclick=()=>go(last?`v${i}`:`s${i}-${j+1}`);
  qnavIn.querySelector('#homeB').onclick=()=>go('home');
  main.querySelector('#stem').scrollIntoView({block:'center'});
  if(auto) readAll();
}
function choose(k){
  const i=S, j=Q; ANS[i][j]=k; delete SUB[i]; save();
  main.querySelectorAll('[data-c]').forEach(b=>b.setAttribute('aria-checked',+b.dataset.c===k));
  const d=main.querySelector(`.dot[data-g="${j}"]`); d.classList.add('did');
  live.textContent=`你選了${ABCD[k]}`;
  sayList([`你選了${ABCD[k]}`]);
}
function textModal(i){
  const p=P[i];
  const paras=p.cl; // clauses per paragraph
  const ov=modal(`<h2>${esc(secName(i))}・課文</h2><div class="srow" style="margin-bottom:10px"><button class="spk" id="tSay" type="button">${SPK}聽課文</button></div>
    <div class="ptext">${paras.map(cs=>`<p>${cs.map(c=>`<span>${esc(c)}</span>`).join('')}</p>`).join('')}</div>
    ${p.img?`<img src="img/${p.img}.jpg" alt="${esc(p.cap)}" style="margin-top:12px">`:''}`);
  const spans=[...ov.querySelectorAll('.ptext span')], items=paras.flat();
  const tb=ov.querySelector('#tSay');
  tb.onclick=()=>sayList(items,x=>{ tb.classList.toggle('on',x>=0); spans.forEach((s,k)=>s.classList.toggle('reading',k===x)); if(x>=0) spans[x].scrollIntoView({block:'nearest'}); });
}
function renderReview(i){
  stop(); const p=P[i], a=ANS[i]||p.q.map(()=>-1); document.getElementById('ttl').textContent=`${D.LAB[i]}・檢查答案`;
  const miss=a.filter(x=>x<0).length;
  main.innerHTML=`<h2>${esc(secName(i))}・檢查答案</h2>
  <p class="big">${miss?`還有 <b>${miss}</b> 題沒有作答。`:'每一題都作答了！檢查好就可以交卷。'}</p>
  <div class="srow"><button class="spk" id="rvSay" type="button">${SPK}聽我的答案</button></div>
  ${p.q.map((q,j)=>`<div class="rv"><span class="q">${j+1}. ${esc(q[0])}</span><span class="a${a[j]<0?' none':''}">${a[j]<0?'還沒作答':ABCD[a[j]]+'　'+esc(q[1][a[j]])}</span><button class="btn" type="button" data-e="${j}">✏️ 改這題</button></div>`).join('')}`;
  qnav.hidden=false;
  qnavIn.innerHTML=`<button class="btn" id="backB" type="button">◀ 回到題目</button><button class="btn pri" id="subB" type="button" ${miss?'disabled':''}>✅ 交卷</button>`;
  const items=p.q.map((q,j)=>a[j]<0?`第${j+1}題，還沒作答`:`第${j+1}題，${oText(i,j,a[j])}`);
  const rb=main.querySelector('#rvSay'); rb.onclick=()=>sayList(items,mark(rb));
  main.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>go(`s${i}-${b.dataset.e}`));
  qnavIn.querySelector('#backB').onclick=()=>go(`s${i}-${p.q.length-1}`);
  qnavIn.querySelector('#subB').onclick=()=>{ SUB[i]=true; save(); doneScreen(i); };
  if(auto) sayList([miss?'還有題目沒有作答喔':'每一題都作答了，檢查好就可以交卷']);
}
function doneScreen(i){
  stop(); qnav.hidden=false;
  main.innerHTML=`<div class="card" style="text-align:center"><p style="font-size:3em;margin:0">🎉</p><h1>${esc(D.LAB[i])} 交卷完成！</h1><p class="big">老師會幫你看答案。</p></div>`;
  const nx=i+1<P.length?i+1:-1;
  qnavIn.innerHTML=`<button class="btn" id="homeB" type="button">🏠 回目錄</button>${nx>=0?`<button class="btn pri" id="nxB" type="button">下一段：${esc(D.LAB[nx])} ▶</button>`:`<button class="btn pri" id="sendB" type="button">📤 傳給老師</button>`}`;
  qnavIn.querySelector('#homeB').onclick=()=>go('home');
  if(nx>=0) qnavIn.querySelector('#nxB').onclick=()=>go('s'+nx); else qnavIn.querySelector('#sendB').onclick=sendModal;
  sayList(['交卷完成！老師會幫你看答案。']);
}

/* ---------- teacher ---------- */
function parseCode(c){ const r={}; let m; const re=/([a-j])([0-4]+)/g; while((m=re.exec(c||''))){ r[SEC.indexOf(m[1])]=m[2].split('').map(d=>+d-1); } return r; }
function renderTeacher(c){
  stop(); qnav.hidden=true; document.getElementById('ttl').textContent='老師版・答案與批改';
  const R=c?parseCode(c):null;
  let tot=0, ok=0;
  const rows=P.map((p,i)=>{ const st=R&&R[i]; return `<h2 style="margin-top:1em">${esc(secName(i))}${st?'':R?'　<span style="font-size:.7em">（未交卷）</span>':''}</h2>
    <table><thead><tr><th style="width:45%">題目</th><th>正確答案</th>${R?'<th>學生答案</th>':''}</tr></thead><tbody>${p.q.map((q,j)=>{ let cell='';
      if(R){ if(st){ const s=st[j]; const good=s===q[2]; tot++; if(good) ok++; cell=`<td class="${good?'okc':'noc'}">${s>=0?ABCD[s]+'　'+esc(q[1][s]):'未作答'}　${good?'✔':'✘'}</td>`; } else cell='<td>—</td>'; }
      return `<tr><td>${j+1}. ${esc(q[0])}</td><td>${ABCD[q[2]]}　${esc(q[1][q[2]])}</td>${cell}</tr>`; }).join('')}</tbody></table>`; }).join('');
  main.innerHTML=`<h1>老師版</h1>
  <div class="card"><p style="margin:0 0 8px;font-size:.75em;font-weight:900">輸入學生的結果代碼（或用手機掃學生畫面上的 QR 碼）：</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><input class="codein" id="cin" value="${esc(c||'')}" placeholder="例如 a1121b111" aria-label="結果代碼" style="flex:1 1 260px"><button class="btn pri" id="cGo" type="button">批改</button></div>
    ${R?`<p class="score" style="margin:.5em 0 0">答對 ${ok} / ${tot} 題${tot?`（${Math.round(ok/tot*100)}%）`:''}</p>`:''}</div>
  ${rows}
  <div class="homeact"><button class="btn" id="homeB" type="button">🏠 回學生目錄</button>${!R?'':'<button class="btn" id="clrB" type="button">只看答案</button>'}</div>
  <div class="card" style="font-size:.65em"><b>學生作答紀錄</b>只存在這台平板。要讓學生重新作答：<button class="btn" id="rst" type="button" style="min-height:48px;font-size:1em">清除這台平板的作答紀錄</button></div>`;
  main.querySelector('#cGo').onclick=()=>{ const v=main.querySelector('#cin').value.trim().toLowerCase().replace(/^.*#r-/,'').replace(/[^a-j0-4]/g,''); go(v?'r-'+v:'t'); };
  main.querySelector('#homeB').onclick=()=>go('home');
  const cb=main.querySelector('#clrB'); if(cb) cb.onclick=()=>go('t');
  main.querySelector('#rst').onclick=e=>{ const b=e.currentTarget; if(b.dataset.sure){ ANS={}; SUB={}; save(); b.textContent='已清除'; b.disabled=true; } else { b.dataset.sure=1; b.textContent='再按一次確定清除'; } };
}

/* ---------- router ---------- */
function go(h){ if(location.hash==='#'+h) route(); else location.hash=h; }
function route(){
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  const h=location.hash.slice(1); let m;
  if((m=h.match(/^s(\d)(?:-(\d))?$/))&&P[+m[1]]){ const i=+m[1]; let j=m[2]!=null?+m[2]:0; if(m[2]==null&&ANS[i]&&!SUB[i]){ const f=ANS[i].indexOf(-1); j=f<0?0:f; } renderQuiz(i,Math.min(j,P[i].q.length-1)); }
  else if((m=h.match(/^v(\d)$/))&&P[+m[1]]) renderReview(+m[1]);
  else if(h==='t') renderTeacher(null);
  else if((m=h.match(/^r-([a-j0-4]+)$/))) renderTeacher(m[1]);
  else renderHome();
  main.focus({preventScroll:true}); if(!/^s/.test(h)) window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{
  if(document.querySelector('.ov')||e.target.tagName==='INPUT') return;
  const h=location.hash; if(!/^#s\d/.test(h)) return;
  const n='1234abcdABCD'.indexOf(e.key); if(n>=0){ const k=n%4; if(k<P[S].q[Q][1].length){ choose(k); e.preventDefault(); } return; }
  if(e.key===' '){ e.preventDefault(); main.querySelector('#allSay').click(); }
  if(e.key==='ArrowRight') qnavIn.querySelector('#nextB').click();
  if(e.key==='ArrowLeft'&&Q>0) qnavIn.querySelector('#prevB').click();
});
route();
</script>
</body></html>
