<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#7cc9f5">
<title>生字練習網站</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
<style>
:root{--sky:#bfe6ff;--grass:#7ccb5b;--grass-d:#4f9e35;--orange:#ff8a1f;--teal:#1fa892;--ink:#3a2a1a;--coin:#ffd23f;--card:#fffdf6;--red:#ef5350;--pink:#ff7eb3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;font-family:"jf-openhuninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;color:var(--ink)}
body{background:linear-gradient(var(--sky) 0 76%,var(--grass) 76% 78%,#6abf4b 78%);background-attachment:fixed;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:12px 14px 30px;position:relative}
.screen{display:none;animation:pop .35s ease}.screen.on{display:block}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.kai{font-family:"TW-Kai","BiauKai","DFKai-SB","標楷體","Kaiti TC","STKaiti",serif}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.back{border:none;background:#fff;border-radius:50%;width:52px;height:52px;font-size:26px;box-shadow:0 4px 0 #0002;flex:none;color:var(--ink)}
.title{flex:1;font-size:23px;font-weight:900;text-align:center;text-shadow:0 2px 0 #fff}
.coins{background:#fff;border-radius:30px;padding:6px 12px 6px 8px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:4px;box-shadow:0 4px 0 #0002;flex:none}
.coins.bump{animation:bump .4s}@keyframes bump{50%{transform:scale(1.25)}}
.coin{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--coin);border:3px solid #e0a800;position:relative;flex:none}
.coin::after{content:"";position:absolute;left:8px;top:3px;width:4px;height:14px;background:#fff8;border-radius:3px}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 6px 0 #0002;border:4px solid #fff}
.btn{display:block;width:100%;border:none;border-radius:20px;padding:15px;font-size:25px;font-weight:900;color:#fff;background:var(--orange);box-shadow:0 6px 0 #c45f00;font-family:inherit;margin-top:12px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c45f00}
.btn.teal{background:var(--teal);box-shadow:0 6px 0 #0d7363}.btn.gray{background:#9aa5ad;box-shadow:0 6px 0 #6c757d}.btn.pink{background:var(--pink);box-shadow:0 6px 0 #d04f86}
.btn[disabled]{opacity:.4}
.row2{display:flex;gap:10px}.row2 .btn{font-size:21px;padding:13px 6px}
.bubble{background:#fff;border-radius:20px;padding:12px 16px;font-size:21px;font-weight:700;position:relative;margin:6px 0 10px;text-align:center;box-shadow:0 4px 0 #0001}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.up::after{bottom:auto;top:-12px;border-top:0;border-bottom:12px solid #fff}
.petimg{display:block;margin:0 auto;object-fit:contain}
.hop{animation:hop .6s}@keyframes hop{30%{transform:translateY(-26px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.sad{animation:sad .5s}@keyframes sad{25%{transform:translateX(-8px) rotate(-4deg)}75%{transform:translateX(8px) rotate(4deg)}}
.idle{animation:idle 2.4s ease-in-out infinite}@keyframes idle{50%{transform:translateY(-6px) scale(1.02)}}
.wobble{animation:wob 1s ease-in-out infinite}@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
/* login */
.who{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.who button{border:none;background:#fff;border-radius:24px;padding:16px 8px;font-size:30px;font-weight:900;font-family:inherit;box-shadow:0 6px 0 #0002;color:var(--ink)}
.who button img{height:86px;display:block;margin:0 auto 6px}
.who button small{display:block;font-size:16px;color:#888}
/* egg choose */
.eggs{display:flex;justify-content:space-around;margin:20px 0}
.eggs button{border:none;background:#fff;border-radius:24px;padding:12px;box-shadow:0 6px 0 #0002}
.eggs img{height:110px}
/* home bar */
.petbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:8px 12px;box-shadow:0 5px 0 #0002;margin-bottom:6px;border:none;width:100%;font-family:inherit;color:var(--ink);text-align:left}
.petbar img{height:70px;width:70px;object-fit:contain}
.petbar b{font-size:20px;display:block}
.xp{height:14px;background:#ffe7f0;border-radius:10px;overflow:hidden;margin-top:4px;border:2px solid #ffc2da}
.xp i{display:block;height:100%;background:var(--pink);border-radius:10px;transition:width .6s}
.daily{background:#fff7d6;border:3px dashed #ffc93c;border-radius:18px;padding:10px;text-align:center;font-weight:900;font-size:18px;margin:8px 0}
/* map */
.island{background:#fff;border-radius:22px;margin:12px 0;padding:10px 12px;box-shadow:0 5px 0 #0002}
.island h3{margin:2px 0 8px;font-size:20px}
.levels{display:flex;flex-wrap:wrap;gap:10px}
.lv{border:none;border-radius:18px;padding:12px 10px 8px;font-size:29px;font-weight:900;font-family:inherit;background:#ffe9c7;color:var(--ink);box-shadow:0 5px 0 #e2b46a;min-width:46%;flex:1;position:relative;letter-spacing:4px}
.lv.long{font-size:24px;letter-spacing:2px}
.lv.lock{font-size:22px;letter-spacing:1px;background:#e6e6e6;box-shadow:0 5px 0 #bbb;color:#aaa}
.lv.done{background:#d6f5c9;box-shadow:0 5px 0 #7ccb5b}
.lv .st{display:block;font-size:15px;letter-spacing:1px;color:#e0a800}
/* steps */
.steps{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.step{display:flex;align-items:center;gap:12px;border:none;background:#fff;border-radius:22px;padding:12px 14px;font-size:23px;font-weight:900;font-family:inherit;color:var(--ink);box-shadow:0 5px 0 #0002;text-align:left}
.step .n{width:48px;height:48px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.step.ok .n{background:var(--grass-d)}
.step .chk{margin-left:auto;font-size:18px;color:#e0a800;white-space:nowrap}
.step small{display:block;font-size:15px;color:#888;font-weight:700}
.chest{font-size:20px;text-align:center;font-weight:900;margin-top:10px;background:#fff;border-radius:20px;padding:10px;box-shadow:0 5px 0 #0002}
/* HUD in games */
.hud{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.hud img{height:58px;width:58px;object-fit:contain}
.prog{flex:1;height:18px;background:#fff;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 0 #0001}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,var(--orange));width:0;transition:width .4s;border-radius:8px}
.combo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);font-size:28px;white-space:nowrap;font-weight:900;color:#fff;background:#ff8a1f;padding:10px 22px;border-radius:30px;border:4px solid #fff;box-shadow:0 6px 0 #c45f00;z-index:8;pointer-events:none;}
.combo.go{animation:combo 1.1s ease-out}@keyframes combo{20%{transform:translate(-50%,-50%) scale(1.2)}70%{transform:translate(-50%,-60%) scale(1)}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}
.big{font-size:150px;line-height:1.05;text-align:center}
.zy{font-size:40px;font-weight:900;text-align:center;letter-spacing:6px;color:var(--teal)}
/* see+write */
.evo{display:flex;align-items:center;justify-content:space-between;gap:4px}
.evo .box{flex:1;background:#fff;border-radius:16px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;opacity:.12;transition:opacity .6s,transform .6s;border:3px solid #ffe2b8;overflow:hidden}
.evo .box.show{opacity:1;transform:scale(1.04)}
.evo .box img{max-width:88%;max-height:88%}.evo .box svg{width:84%;height:84%}.evo .box span{font-size:70px}
.evo .ar{font-size:24px;color:var(--orange);font-weight:900}
.evo-lbl{display:flex;justify-content:space-between;font-size:15px;font-weight:900;color:#8a6a4a;padding:2px 8px 0}.evo-lbl b{flex:1;text-align:center}
.zyrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
.spk{border:none;background:var(--teal);color:#fff;border-radius:50%;width:60px;height:60px;font-size:28px;box-shadow:0 5px 0 #0d7363;flex:none}
#hw{margin:0 auto;position:relative;background:#fff;border-radius:16px;touch-action:none}
#wr-area{display:none}
.phase{font-size:20px;font-weight:900;text-align:center;margin:2px 0 6px;color:#8a4a00}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mcol{display:flex;flex-direction:column;gap:12px}
.mi{border:4px solid #fff;background:#fff;border-radius:18px;height:96px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #0002;transition:.2s}
.mi img{max-height:80px;max-width:90%}.mi span{font-size:66px}
.mi.sel{border-color:var(--orange);transform:scale(1.05)}
.mi.good{border-color:var(--grass-d);background:#e3f8d8;opacity:.7;transform:scale(.95)}
.bad{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* choose */
.opts{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.opt{border:none;background:#fff;border-radius:22px;font-size:80px;padding:2px;box-shadow:0 6px 0 #0002;color:var(--ink)}
.opt.good{background:#d6f5c9}.opt.badc{background:#ffd6d6}
/* record */
.rec{width:124px;height:124px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:22px;font-weight:900;font-family:inherit;box-shadow:0 7px 0 #a82b28;display:block;margin:10px auto}
.rec.on{animation:pulse 1s infinite;background:#d32f2f}@keyframes pulse{50%{transform:scale(1.08)}}
.recbar{height:12px;background:#fff;border-radius:8px;overflow:hidden;margin:6px 20px}.recbar i{display:block;height:100%;width:0;background:var(--red)}
.note{font-size:16px;color:#7a6a5a;text-align:center;margin-top:8px}
/* pet house */
.room{background:linear-gradient(#fff1f7 0 70%,#ffd9e8 70%);border-radius:26px;padding:16px;border:4px solid #fff;box-shadow:0 6px 0 #0002;text-align:center;position:relative;min-height:290px}
.room .lvtag{position:absolute;left:12px;top:10px;background:var(--pink);color:#fff;border-radius:14px;padding:4px 10px;font-weight:900;font-size:17px}
.room .hearts{position:absolute;right:12px;top:10px;font-size:20px}
.room img{height:200px;max-width:80%;margin-top:22px}
.foods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.food{border:none;background:#fff;border-radius:20px;padding:10px 4px;font-family:inherit;box-shadow:0 5px 0 #0002;color:var(--ink);font-size:16px;font-weight:900}
.food .e{font-size:42px;display:block}
.food .p{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:2px}
.food .p .coin{width:20px;height:20px;border-width:2px}.food .p .coin::after{left:6px;top:2px;height:10px}
.float{position:fixed;font-size:30px;pointer-events:none;z-index:9;animation:up 1.2s ease-out forwards}@keyframes up{to{transform:translateY(-120px);opacity:0}}
/* overlay */
#cele{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#cele.on{display:flex}#cele .card{text-align:center;max-width:380px;width:100%}
#cele h2{font-size:30px;margin:6px 0}
.stars{font-size:46px;letter-spacing:4px;color:#ffc107}
.stars i{font-style:normal;display:inline-block;transform:scale(0)}.stars i.on{animation:star .5s forwards}@keyframes star{70%{transform:scale(1.4)}100%{transform:scale(1)}}
.fly{position:fixed;width:28px;height:28px;border-radius:50%;background:var(--coin);border:3px solid #e0a800;z-index:10;pointer-events:none;animation:fly .9s ease-in forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:.3}}
.rain{position:fixed;top:-40px;width:26px;height:26px;border-radius:50%;background:var(--coin);border:3px solid #e0a800;z-index:10;pointer-events:none;animation:rain 1.6s ease-in forwards}
@keyframes rain{to{transform:translateY(110vh) rotate(360deg)}}
.hint{font-size:20px;font-weight:900;text-align:center;margin:4px 0}
</style>
</head>
<body>
<div id="app">

<!-- 報到 -->
<section class="screen on" id="s-login">
  <div class="title" style="font-size:32px;margin-top:14px">生字練習網站</div>
  <div class="bubble" style="margin-top:16px">你是誰呢？點一下你的名字</div>
  <div class="who">
    <button onclick="login('政維')"><img src="img/dra0.webp" alt="">政維</button>
    <button onclick="login('測試者')"><img src="img/dog0.webp" alt="" style="filter:grayscale(.6)">測試者<small>老師試玩用</small></button>
  </div>
</section>

<!-- 選蛋 -->
<section class="screen" id="s-egg">
  <div class="title" style="margin-top:14px">選一顆寵物蛋！</div>
  <div class="bubble">寫字、答題可以拿金幣，<br>用金幣餵牠，牠就會孵化長大喔！</div>
  <div class="eggs">
    <button onclick="pickEgg('cat')"><img class="wobble" src="img/cat0.webp" alt="粉紅愛心蛋"></button>
    <button onclick="pickEgg('dra')"><img class="wobble" src="img/dra0.webp" alt="藍色星星蛋" style="animation-delay:.3s"></button>
    <button onclick="pickEgg('dog')"><img class="wobble" src="img/dog0.webp" alt="黃色點點蛋" style="animation-delay:.6s"></button>
  </div>
</section>

<!-- 地圖 -->
<section class="screen" id="s-map">
  <div class="top"><button class="back" onclick="go('s-login')">⌂</button><div class="title" id="hi"></div><div class="coins"><span class="coin"></span><span class="cn">0</span></div></div>
  <button class="petbar" onclick="openPet()"><img id="mp-pet" alt=""><span style="flex:1"><b id="mp-name"></b><span style="font-size:15px;color:#888">點我去寵物屋餵牠 🍎</span><div class="xp"><i id="mp-xp"></i></div></span></button>
  <div id="daily"></div>
  <div id="islands"></div>
</section>

<!-- 一組的關卡 -->
<section class="screen" id="s-group">
  <div class="top"><button class="back" onclick="showMap()">←</button><div class="title kai" id="g-title" style="font-size:34px;letter-spacing:6px"></div><div class="coins"><span class="coin"></span><span class="cn">0</span></div></div>
  <img class="petimg idle" id="g-pet" alt="" style="height:120px">
  <div class="steps" id="steps"></div>
  <div id="chest"></div>
</section>

<!-- 1 看圖寫字 -->
<section class="screen" id="s-see">
  <div class="top"><button class="back" onclick="openGroup()">←</button><div class="title">看圖寫字</div><div class="coins"><span class="coin"></span><span class="cn">0</span></div></div>
  <div class="hud"><img class="pet-hud" alt=""><div class="prog"><i id="see-prog"></i></div></div>
  <div id="see-area">
    <div class="phase">① 看看圖怎麼變成字</div>
    <div class="card">
      <div class="evo"><div class="box" id="e1"></div><div class="ar">→</div><div class="box" id="e2"></div><div class="ar">→</div><div class="box" id="e3"></div></div>
      <div class="evo-lbl"><b>圖畫</b><b>古字(示意)</b><b>現在</b></div>
      <div class="zyrow"><div class="zy" id="see-zy"></div><button class="spk" onclick="sayCur()">🔊</button></div>
    </div>
    <button class="btn" id="see-go" onclick="toWrite()" disabled>我看懂了，來寫寫看 ✏️</button>
  </div>
  <div id="wr-area">
    <div class="phase">② 跟著灰色的字描一描</div>
    <div class="hint" id="wr-hint"></div>
    <div class="card" style="padding:8px"><div id="hw"></div></div>
    <div class="row2"><button class="btn teal" id="wr-demo" onclick="wrDemo()">▶ 看筆順</button><button class="btn gray" onclick="wrStart()">↺ 重寫</button></div>
    <button class="btn" id="wr-done" onclick="freeDone()" style="display:none">我寫好了 ✓</button>
  </div>
</section>

<!-- 2 配對 -->
<section class="screen" id="s-match">
  <div class="top"><button class="back" onclick="openGroup()">←</button><div class="title">圖字配對</div><div class="coins"><span class="coin"></span><span class="cn">0</span></div></div>
  <div class="hud"><img class="pet-hud" alt=""><div class="prog"><i id="m-prog"></i></div></div>
  <div class="hint">先點圖，再點對的字</div>
  <div class="mgrid"><div class="mcol" id="m-l"></div><div class="mcol" id="m-r"></div></div>
</section>

<!-- 3 聽注音選國字 -->
<section class="screen" id="s-choose">
  <div class="top"><button class="back" onclick="openGroup()">←</button><div class="title">聽一聽，選一選</div><div class="coins"><span class="coin"></span><span class="cn">0</span></div></div>
  <div class="hud"><img class="pet-hud" alt=""><div class="prog"><i id="ch-prog"></i></div></div>
  <div class="card" style="text-align:center;padding:12px"><div class="zyrow"><div class="zy" id="ch-zy" style="font-size:50px"></div><button class="spk" onclick="say(chCur)">🔊</button></div></div>
  <div class="opts" id="ch-opts"></div>
</section>

<!-- 4 念念看＋錄音 -->
<section class="screen" id="s-rec">
  <div class="top"><button class="back" onclick="openGroup()">←</button><div class="title">念念看</div><div class="coins"><span class="coin"></span><span class="cn">0</span></div></div>
  <div class="hud"><img class="pet-hud" alt=""><div class="prog"><i id="rc-prog"></i></div></div>
  <div class="card" style="padding:8px">
    <div class="big kai" id="rc-char"></div>
    <div class="zyrow"><div class="zy" id="rc-zy"></div><button class="spk" onclick="say(rcCur)">🔊</button></div>
  </div>
  <button class="rec" id="rc-btn" onclick="recToggle()">按我<br>開始念</button>
  <div class="recbar"><i id="rc-bar"></i></div>
  <div class="row2" id="rc-after" style="display:none"><button class="btn teal" onclick="recPlay()">▶ 聽自己</button><button class="btn gray" onclick="recReset()">↺ 重錄</button></div>
  <button class="btn" id="rc-send" onclick="recSend()" style="display:none">送給老師 ✉️</button>
  <div class="note" id="rc-note"></div>
</section>

<!-- 寵物屋 -->
<section class="screen" id="s-pet">
  <div class="top"><button class="back" onclick="showMap()">←</button><div class="title">寵物屋</div><div class="coins"><span class="coin"></span><span class="cn">0</span></div></div>
  <div class="room" onclick="petPat()">
    <span class="lvtag" id="pt-lv"></span><span class="hearts" id="pt-hearts"></span>
    <img id="pt-img" class="idle" alt="">
    <div class="xp" style="margin:10px 20px 0"><i id="pt-xp"></i></div>
    <div style="font-size:16px;font-weight:900;margin-top:6px" id="pt-next"></div>
  </div>
  <div class="bubble up" id="pt-say" style="margin-top:16px"></div>
  <div class="foods" id="foods"></div>
</section>

</div>

<div id="cele"><div class="card"><img id="cele-img" class="petimg hop" alt="" style="height:150px"><h2 id="cele-t"></h2><div class="stars" id="cele-stars"></div><div id="cele-s" style="font-size:20px;font-weight:700;margin-top:6px"></div><button class="btn" id="cele-btn" onclick="celeOk()">好！</button></div></div>
<div class="combo" id="combo"></div>

<script>
/* ====== 設定 ====== */
const GAS_URL = ""; // ← 部署 Google Apps Script 後，把網址貼在這裡

/* ====== 字庫 ====== */
const ZY={日:"ㄖˋ",月:"ㄩㄝˋ",山:"ㄕㄢ",水:"ㄕㄨㄟˇ",火:"ㄏㄨㄛˇ",木:"ㄇㄨˋ",雨:"ㄩˇ",土:"ㄊㄨˇ",石:"ㄕˊ",
人:"ㄖㄣˊ",大:"ㄉㄚˋ",天:"ㄊㄧㄢ",夫:"ㄈㄨ",目:"ㄇㄨˋ",耳:"ㄦˇ",牙:"ㄧㄚˊ",舌:"ㄕㄜˊ",心:"ㄒㄧㄣ",足:"ㄗㄨˊ",手:"ㄕㄡˇ",眉:"ㄇㄟˊ",身:"ㄕㄣ",

/* 金幣 */
function addCoin(n,el){st.coins=(st.coins||0)+n;save();
  const t=document.querySelector('.screen.on .coins');
  for(let k=0;k<Math.min(n,6);k++)setTimeout(()=>flyCoin(el,t),k*90);
  setTimeout(()=>{refresh();if(t){t.classList.remove('bump');void t.offsetWidth;t.classList.add('bump')}},500)}
function flyCoin(el,t){if(!el||!t){ding();return}const r=el.getBoundingClientRect(),tr=t.getBoundingClientRect();const c=document.createElement('div');c.className='fly';
  c.style.left=(r.left+r.width/2-14+Math.random()*30-15)+'px';c.style.top=(r.top+r.height/2-14)+'px';
  c.style.setProperty('--dx',(tr.left+10-(r.left+r.width/2))+'px');c.style.setProperty('--dy',(tr.top+4-(r.top+r.height/2))+'px');
  document.body.appendChild(c);setTimeout(()=>c.remove(),900);ding()}
function coinRain(){for(let k=0;k<22;k++){const c=document.createElement('div');c.className='rain';c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2600)}}
let combo=0;

function miss(){combo=0;petAct('sad');oops()}
function showCombo(t){const c=$('combo');c.textContent=t;c.classList.remove('go');void c.offsetWidth;c.classList.add('go');tone(1568,.12)}

let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,rate){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';if(voice)u.voice=voice;u.rate=rate||0.75;speechSynthesis.speak(u)}
let AC;function tone(f,d,type,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=v||.05;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
function ding(){tone(988,.06);setTimeout(()=>tone(1319,.18),60)}
function oops(){tone(196,.25,'sawtooth',.04)}
function fanfare(){[523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.16),i*110))}

function groupStars(g){const s=st.stars[g]||{};return Object.values(s).reduce((a,b)=>a+b,0)}
function locked(){oops();say('這一關還沒開放，請等老師開放')}
function pickGroup(g){group=g;chars=[...g];openGroup()}
function openGroup(){
  'speechSynthesis' in window&&speechSynthesis.cancel();
  $('g-title').textContent=group;$('g-pet').src=petSrc();
  const s=st.stars[group]||{};
  $('steps').innerHTML=STEPS.map((x,i)=>`<button class="step ${s[i]?'ok':''}" onclick="startStep(${i})"><span class="n">${i+1}</span><span>${x[0]}<small>${x[1]}</small></span><span class="chk">${s[i]?'★'.repeat(s[i])+'☆'.repeat(3-s[i]):'▶'}</span></button>`).join('');
  const all=Object.keys(s).length>=4;
  $('chest').innerHTML=`<div class="chest">${all?(st.chest&&st.chest[group]?'🎉 寶箱已打開':'🎁 寶箱可以打開了！'):'🎁 四關都完成，就能打開寶箱'}</div>`;
  if(all&&!(st.chest&&st.chest[group])){st.chest=st.chest||{};st.chest[group]=1;save();setTimeout(()=>{coinRain();addCoin(10,$('chest'));fanfare();say('打開寶箱，得到十枚金幣')},400);$('chest').firstChild.textContent='🎉 寶箱打開了！得到 10 枚金幣'}
  go('s-group');}
let mistakes=0;

function finishStep(i,msg){
  const s=st.stars[group]=st.stars[group]||{};
  const stars=i===3?3:(mistakes===0?3:mistakes<=3?2:1);
  const first=!s[i];if(!s[i]||stars>s[i])s[i]=stars;save();
  const bonus=stars*2;
  fanfare();coinRain();
  $('cele-t').textContent=['','加油！','很棒！','太厲害了！'][stars];
  $('cele-stars').innerHTML=[0,1,2].map(k=>`<i class="${k<stars?'on':''}" style="animation-delay:${k*.25}s">${k<stars?'★':'☆'}</i>`).join('');
  $('cele-s').innerHTML=`${msg}<br><span style="display:inline-flex;align-items:center;gap:4px;margin-top:6px">獎勵 <span class="coin"></span> × ${bonus}</span>`;

  curC=chars[seeI];setProg('see-prog',seeI,chars.length);
  $('see-area').style.display='block';$('wr-area').style.display='none';$('see-go').disabled=true;
  $('e1').innerHTML=`<img src="img/p_${curC}.webp" alt="">`;
  $('e2').innerHTML=ANCIENT[curC]?`<svg viewBox="0 0 100 100" fill="none" stroke="#8b4a1c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">${ANCIENT[curC]}</svg>`:'';
  $('e3').innerHTML=`<span class="kai">${curC}</span>`;$('see-zy').textContent=ZY[curC];
  playEvo();}
function playEvo(){evoT.forEach(clearTimeout);['e1','e2','e3'].forEach(i=>$(i).classList.remove('show'));
  const e=i=>{$(i).classList.add('show');tone(660+i.slice(1)*220,.1)};
  evoT=[setTimeout(()=>e('e1'),200),setTimeout(()=>e('e2'),1100),setTimeout(()=>{e('e3');sayCur();$('see-go').disabled=false},2000)]}
function sayCur(){say(curC+'，'+(WORD[curC]||curC))}
function toWrite(){$('see-area').style.display='none';$('wr-area').style.display='block';wrShow()}
function wrShow(){
  $('wr-hint').textContent='一筆一筆，照順序描';
  const size=Math.min(window.innerWidth-56,340);const box=$('hw');box.style.width=size+'px';box.style.height=size+'px';
  box.innerHTML=`<svg width="${size}" height="${size}" style="position:absolute;left:0;top:0"><g stroke="#f3c79a" stroke-dasharray="8 8" stroke-width="2"><line x1="0" y1="${size/2}" x2="${size}" y2="${size/2}"/><line x1="${size/2}" y1="0" x2="${size/2}" y2="${size}"/></g><rect x="1.5" y="1.5" width="${size-3}" height="${size-3}" fill="none" stroke="#e08a3a" stroke-width="3" rx="12"/></svg><div id="hw-in" style="position:relative"></div>`;
  writer=HanziWriter.create($('hw-in'),curC,{width:size,height:size,padding:18,showOutline:true,showCharacter:false,strokeColor:'#ff7a00',outlineColor:'#d9d9d9',drawingColor:'#3a2a1a',drawingWidth:22,highlightColor:'#1fa892',strokeAnimationSpeed:.8,delayBetweenStrokes:350,
    charDataLoader:(ch,done)=>fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/'+encodeURIComponent(ch)+'.json').then(r=>r.json()).then(done).catch(()=>{$('wr-hint').textContent='筆順資料載入失敗，請檢查網路'})});
  wrStart();}
let free=false,fc=null,fdrawn=0;
function wrStart(){if(!writer)return;writer.cancelQuiz&&writer.cancelQuiz();writer.hideCharacter();
  free=FREE_TRACE.has(curC);$('wr-demo').style.display=free?'none':'';$('wr-done').style.display=free?'block':'none';
  if(free){setupFree();$('wr-hint').textContent='照課本筆順描，描好按下面的按鈕';return}
  writer.quiz({showHintAfterMisses:1,highlightOnComplete:true,leniency:1.4,
    onCorrectStroke:d=>{tone(880+d.strokeNum*80,.08);$('wr-hint').textContent=`第 ${d.strokeNum+1} 筆，寫對了！`},
    onMistake:()=>{mistakes++;miss();$('wr-hint').textContent='再試一次，看綠色的提示'},
    onComplete:()=>wrFinished()});}
function wrFinished(){$('wr-hint').textContent='寫好了！好漂亮 ✨';hit($('hw'),2);say(curC+'，寫好了');
  setTimeout(()=>{if(seeI<chars.length-1){seeI++;seeShow()}else{setProg('see-prog',1,1);finishStep(0,'這一組的字都看懂、寫好了')}},1600)}
function setupFree(){const box=$('hw');let c=box.querySelector('canvas.free');const size=parseInt(box.style.width);
  if(!c){c=document.createElement('canvas');c.className='free';c.style.cssText='position:absolute;left:0;top:0;z-index:2;touch-action:none';box.appendChild(c)}
  const dpr=window.devicePixelRatio||1;c.width=size*dpr;c.height=size*dpr;c.style.width=c.style.height=size+'px';
  fc=c.getContext('2d');fc.scale(dpr,dpr);fc.lineCap=fc.lineJoin='round';fc.lineWidth=20;fc.strokeStyle='#3a2a1a';fdrawn=0;
  let drawing=false,last=null;const pt=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{drawing=true;last=pt(e);c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!drawing)return;const p=pt(e);fc.beginPath();fc.moveTo(...last);fc.lineTo(...p);fc.stroke();fdrawn+=Math.hypot(p[0]-last[0],p[1]-last[1]);last=p};
  c.onpointerup=c.onpointercancel=()=>{if(drawing)tone(900,.05);drawing=false}}
function freeDone(){if(fdrawn<size0()*0.8){$('wr-hint').textContent='還沒描完喔，再描一描';oops();return}$('wr-done').style.display='none';wrFinished()}
function size0(){return parseInt($('hw').style.width)||300}
function wrDemo(){if(!writer)return;writer.cancelQuiz();writer.hideCharacter();writer.animateCharacter({onComplete:()=>setTimeout(wrStart,500)})}

/* ====== 2 配對 ====== */
let mSel=null,mLeft=0;
function mStart(){mSel=null;mLeft=chars.length;setProg('m-prog',0,1);
  $('m-l').innerHTML=shuffle(chars).map(c=>`<div class="mi" data-c="${c}" data-s="p" onclick="mTap(this)"><img src="img/p_${c}.webp" alt=""></div>`).join('');
  $('m-r').innerHTML=shuffle(chars).map(c=>`<div class="mi" data-c="${c}" data-s="c" onclick="mTap(this)"><span class="kai">${c}</span></div>`).join('');
  go('s-match');}
function mTap(el){if(el.classList.contains('good'))return;
  if(el.dataset.s==='c')say(el.dataset.c);
  if(!mSel||mSel.dataset.s===el.dataset.s){document.querySelectorAll('.mi.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');mSel=el;tone(700,.05);return}
  if(mSel.dataset.c===el.dataset.c){[mSel,el].forEach(x=>{x.classList.remove('sel');x.classList.add('good')});hit(el,1);mSel=null;mLeft--;setProg('m-prog',chars.length-mLeft,chars.length);
    if(!mLeft)setTimeout(()=>finishStep(1,'圖和字都配對成功'),900)}
  else{mistakes++;miss();[mSel,el].forEach(x=>{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad','sel'),450)});mSel=null}}

/* ====== 3 聽注音選國字 ====== */
let chQ=[],chI=0,chCur='',chMiss=0;
function chStart(){chQ=shuffle([...chars,...chars]).filter((c,i,a)=>i===0||c!==a[i-1]).slice(0,6);chI=0;go('s-choose');chShow()}
function chShow(){const c=chQ[chI];chCur=c;chMiss=0;setProg('ch-prog',chI,chQ.length);
  $('ch-zy').textContent=ZY[c];
  const others=shuffle(chars.filter(x=>x!==c)).slice(0,2);
  $('ch-opts').innerHTML=shuffle([c,...others]).map(x=>`<button class="opt kai" onclick="chPick(this,'${x}')">${x}</button>`).join('');
  setTimeout(()=>say(c),300)}
function chPick(b,x){if(b.disabled)return;
  if(x===chCur){b.classList.add('good');document.querySelectorAll('.opt').forEach(o=>o.disabled=true);if(!chMiss)hit(b,1);else{petAct('hop');ding()}say(x+'，答對了');
    setTimeout(()=>{if(chI<chQ.length-1){chI++;chShow()}else{setProg('ch-prog',1,1);finishStep(2,'注音和國字都找到了')}},1300)}
  else{chMiss++;mistakes++;miss();b.classList.add('badc','bad');b.disabled=true;say(x+'，不是這個，再聽一次');setTimeout(()=>say(chCur),1700)}}

/* ====== 4 念念看＋錄音 ====== */
let rcI=0,rcCur='',mr=null,chunks=[],blob=null,stream=null,recT=null,recStart=0;
const MAXS=5;
function rcStart(){rcI=0;go('s-rec');rcShow()}
function rcShow(){rcCur=chars[rcI];setProg('rc-prog',rcI,chars.length);
  $('rc-char').textContent=rcCur;$('rc-zy').textContent=ZY[rcCur];recReset();
  $('rc-note').textContent=GAS_URL?'':'（試玩版：老師後台還沒接上，錄音只留在這支手機）'}
async function recToggle(){
  if(mr&&mr.state==='recording'){mr.stop();return}
  'speechSynthesis' in window&&speechSynthesis.cancel();
  try{stream=stream||await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$('rc-note').textContent='沒有拿到麥克風權限，請按「允許」再試一次';return}
  const types=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'];
  const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  chunks=[];mr=new MediaRecorder(stream,mt?{mimeType:mt}:undefined);
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{clearInterval(recT);blob=new Blob(chunks,{type:mr.mimeType||mt||'audio/webm'});const b=$('rc-btn');b.classList.remove('on');b.innerHTML='錄好了<br>✓';b.disabled=true;
    $('rc-after').style.display='flex';$('rc-send').style.display='block';$('rc-bar').style.width='100%';say('錄好了，可以聽聽看',.9)};
  mr.start();recStart=Date.now();const b=$('rc-btn');b.classList.add('on');b.innerHTML='念完<br>按我停';
  recT=setInterval(()=>{const p=(Date.now()-recStart)/1000/MAXS;$('rc-bar').style.width=Math.min(100,p*100)+'%';if(p>=1&&mr.state==='recording')mr.stop()},100)}
function recPlay(){if(blob)new Audio(URL.createObjectURL(blob)).play()}
function recReset(){blob=null;const b=$('rc-btn');b.disabled=false;b.classList.remove('on');b.innerHTML='按我<br>開始念';
  $('rc-after').style.display='none';const s=$('rc-send');s.style.display='none';s.disabled=false;s.textContent='送給老師 ✉️';$('rc-bar').style.width='0'}
function b64(bl){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(bl)})}
async function recSend(){if(!blob)return;const s=$('rc-send');s.disabled=true;s.textContent='傳送中…';let ok=false;
  if(GAS_URL){try{const data=await b64(blob);
      const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({student:who,group,char:rcCur,zhuyin:ZY[rcCur],mime:blob.type,data,ts:new Date().toISOString()})});
      const j=await r.json().catch(()=>({ok:r.ok}));ok=!!j.ok}catch(e){ok=false}}else ok=true;
  if(!ok){s.disabled=false;s.textContent='再送一次 ✉️';$('rc-note').textContent='傳送失敗，請檢查網路後再按一次';oops();return}
  addCoin(2,s);petAct('hop');s.textContent='老師收到了 ✓';say('老師收到了');
  setTimeout(()=>{if(rcI<chars.length-1){rcI++;rcShow()}else{setProg('rc-prog',1,1);finishStep(3,'每個字的聲音都送給老師了')}},1300)}

/* ====== 寵物屋 ====== */
function xpPct(){const x=st.pet.xp,s=stage();if(s===2)return 100;return Math.round((x-STAGE_XP[s])/(STAGE_XP[s+1]-STAGE_XP[s])*100)}
function openPet(){renderPet();go('s-pet');petTalk()}
function renderPet(){const s=stage();
  $('pt-img').src=petSrc();$('pt-lv').textContent='Lv.'+(s+1);
  $('pt-hearts').textContent='❤️'.repeat(Math.min(5,1+Math.floor((st.pet.fed||0)/3)));
  $('pt-xp').style.width=xpPct()+'%';
  $('pt-next').textContent=s===0?`再吃 ${STAGE_XP[1]-st.pet.xp} 點就會孵化！`:s===1?`再吃 ${STAGE_XP[2]-st.pet.xp} 點就會長大戴皇冠！`:`${PETS[st.pet.kind]}已經長大了！繼續餵牠讓牠更開心`;
  $('foods').innerHTML=FOODS.map((f,i)=>`<button class="food" onclick="feed(${i},this)"><span class="e">${f.e}</span>${f.n}<span class="p"><span class="coin"></span>${f.p}</span></button>`).join('');}
function petTalk(){const s=stage(),n=PETS[st.pet.kind];
  const lines=s===0?['（蛋輕輕搖了一下…）','（蛋裡好像有聲音！）']:s===1?[`我是${n}！我肚子好餓～`,'你今天寫字了嗎？','摸摸我！']:[`我是${n}國王！謝謝你照顧我`,'寫字好厲害！','我們再去冒險吧！'];
  $('pt-say').textContent=lines[Math.floor(Math.random()*lines.length)]}
function feed(i,btn){const f=FOODS[i];
  if((st.coins||0)<f.p){oops();$('pt-say').textContent=`金幣不夠喔，去練習拿金幣吧！`;say('金幣不夠喔');btn.classList.add('bad');setTimeout(()=>btn.classList.remove('bad'),450);return}
  const before=stage();st.coins-=f.p;st.pet.xp+=f.x;st.pet.fed=(st.pet.fed||0)+1;save();refresh();
  const r=btn.getBoundingClientRect();const fl=document.createElement('div');fl.className='float';fl.textContent=f.e+'❤️';fl.style.left=(r.left+r.width/2-30)+'px';fl.style.top=r.top+'px';document.body.appendChild(fl);setTimeout(()=>fl.remove(),1200);
  tone(784,.08);setTimeout(()=>tone(1046,.12),90);
  renderPet();petAct('hop');$('pt-say').textContent=['好好吃！','謝謝你！','還要還要～'][Math.floor(Math.random()*3)];
  if(stage()>before)setTimeout(()=>evolve(),500)}
function evolve(){const s=stage(),n=PETS[st.pet.kind];fanfare();coinRain();
  $('cele-img').src=petSrc();$('cele-t').textContent=s===1?`蛋孵化了！是${n}！`:`${n}長大了，戴上皇冠！`;
  $('cele-stars').innerHTML='';$('cele-s').textContent='謝謝你每天認真練習';
  $('cele').classList.add('on');$('cele-btn').onclick=()=>{$('cele').classList.remove('on');$('cele-btn').onclick=celeOk;renderPet();petTalk()};
  say(s===1?'蛋孵化了，是'+n:n+'長大了')}
function petPat(){if(!st.pet)return;petAct('hop');tone(1200,.08);const s=stage();$('pt-say').textContent=s===0?'（蛋開心地搖來搖去）':'嘻嘻，好癢～'}
</script>
