<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#7cc9f5">
<title>生字練習網站</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
<style>
:root{--sky:#bfe6ff;--grass:#7ccb5b;--grass-d:#4f9e35;--orange:#ff8a1f;--teal:#1fa892;--ink:#3a2a1a;--coin:#ffd23f;--card:#fffdf6;--red:#ef5350;--pink:#ff7eb3;--k:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;font-family:"jf-openhuninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;color:var(--ink)}
body{background:linear-gradient(var(--sky) 0 76%,var(--grass) 76% 78%,#6abf4b 78%);background-attachment:fixed;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:12px 14px 90px;position:relative}
.screen{display:none;animation:pop .35s ease}.screen.on{display:block}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.kai{font-family:"TW-Kai","BiauKai","DFKai-SB","標楷體","Kaiti TC","STKaiti",serif}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.back{border:none;background:#fff;border-radius:50%;width:52px;height:52px;font-size:26px;box-shadow:0 4px 0 #0002;flex:none;color:var(--ink)}
.title{flex:1;font-size:calc(23px*var(--k));font-weight:900;text-align:center;text-shadow:0 2px 0 #fff}
.coins{background:#fff;border-radius:30px;padding:6px 12px 6px 8px;font-size:20px;font-weight:900;display:flex;align-items:center;gap:4px;box-shadow:0 4px 0 #0002;flex:none}
.coins.bump{animation:bump .4s}@keyframes bump{50%{transform:scale(1.25)}}
.coin{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--coin);border:3px solid #e0a800;position:relative;flex:none}
.coin::after{content:"";position:absolute;left:8px;top:3px;width:4px;height:14px;background:#fff8;border-radius:3px}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 6px 0 #0002;border:4px solid #fff}
.btn{display:block;width:100%;border:none;border-radius:20px;padding:15px;font-size:calc(24px*var(--k));font-weight:900;color:#fff;background:var(--orange);box-shadow:0 6px 0 #c45f00;font-family:inherit;margin-top:12px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c45f00}
.btn.teal{background:var(--teal);box-shadow:0 6px 0 #0d7363}.btn.gray{background:#9aa5ad;box-shadow:0 6px 0 #6c757d}.btn.pink{background:var(--pink);box-shadow:0 6px 0 #d04f86}
.btn[disabled]{opacity:.4}
.row2{display:flex;gap:10px}.row2 .btn{font-size:calc(20px*var(--k));padding:13px 6px}
.bubble{background:#fff;border-radius:20px;padding:12px 16px;font-size:calc(21px*var(--k));font-weight:700;position:relative;margin:6px 0 10px;text-align:center;box-shadow:0 4px 0 #0001}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.up::after{bottom:auto;top:-12px;border-top:0;border-bottom:12px solid #fff}
.petimg{display:block;margin:0 auto;object-fit:contain}
.hop{animation:hop .6s}@keyframes hop{30%{transform:translateY(-26px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.sad{animation:sad .5s}@keyframes sad{25%{transform:translateX(-8px) rotate(-4deg)}75%{transform:translateX(8px) rotate(4deg)}}
.idle{animation:idle 2.4s ease-in-out infinite}@keyframes idle{50%{transform:translateY(-6px) scale(1.02)}}
.wobble{animation:wob 1s ease-in-out infinite}@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.who{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.who button{border:none;background:#fff;border-radius:24px;padding:16px 8px;font-size:30px;font-weight:900;font-family:inherit;box-shadow:0 6px 0 #0002;color:var(--ink)}
.who button img{height:86px;display:block;margin:0 auto 6px}
.who button small{display:block;font-size:16px;color:#888}
.eggs{display:flex;justify-content:space-around;margin:20px 0}
.eggs button{border:none;background:#fff;border-radius:24px;padding:12px;box-shadow:0 6px 0 #0002}.eggs img{height:110px}
.petbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:8px 12px;box-shadow:0 5px 0 #0002;margin-bottom:6px;border:none;width:100%;font-family:inherit;color:var(--ink);text-align:left}
.petbar img{height:70px;width:70px;object-fit:contain}.petbar b{font-size:20px;display:block}
.xp{height:14px;background:#ffe7f0;border-radius:10px;overflow:hidden;margin-top:4px;border:2px solid #ffc2da}
.xp i{display:block;height:100%;background:var(--pink);border-radius:10px;transition:width .6s}
.daily{background:#fff7d6;border:3px dashed #ffc93c;border-radius:18px;padding:10px;text-align:center;font-weight:900;font-size:18px;margin:8px 0}
.island{background:#fff;border-radius:22px;margin:12px 0;padding:10px 12px;box-shadow:0 5px 0 #0002}
.island h3{margin:2px 0 8px;font-size:20px}
.levels{display:flex;flex-wrap:wrap;gap:10px}
.lv{border:none;border-radius:18px;padding:12px 10px 8px;font-size:calc(29px*var(--k));font-weight:900;font-family:inherit;background:#ffe9c7;color:var(--ink);box-shadow:0 5px 0 #e2b46a;min-width:46%;flex:1;position:relative;letter-spacing:4px}
.lv.long{font-size:calc(24px*var(--k));letter-spacing:2px}
.lv.lock{font-size:22px;letter-spacing:1px;background:#e6e6e6;box-shadow:0 5px 0 #bbb;color:#aaa}
.lv.done{background:#d6f5c9;box-shadow:0 5px 0 #7ccb5b}
.lv .st{display:block;font-size:15px;letter-spacing:1px;color:#e0a800}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.step{display:flex;align-items:center;gap:12px;border:none;background:#fff;border-radius:22px;padding:8px 14px;font-size:calc(22px*var(--k));font-weight:900;font-family:inherit;color:var(--ink);box-shadow:0 5px 0 #0002;text-align:left}
.step .n{width:46px;height:46px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.step.ok .n{background:var(--grass-d)}
.step .chk{margin-left:auto;font-size:17px;color:#e0a800;white-space:nowrap}
.step small{display:block;font-size:15px;color:#888;font-weight:700}
.chest{font-size:20px;text-align:center;font-weight:900;margin-top:10px;background:#fff;border-radius:20px;padding:10px;box-shadow:0 5px 0 #0002}
.hud{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.hud img{height:58px;width:58px;object-fit:contain}
.prog{flex:1;height:18px;background:#fff;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 0 #0001}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,var(--orange));width:0;transition:width .4s;border-radius:8px}
.combo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);font-size:28px;white-space:nowrap;font-weight:900;color:#fff;background:#ff8a1f;padding:10px 22px;border-radius:30px;border:4px solid #fff;box-shadow:0 6px 0 #c45f00;z-index:8;pointer-events:none}
.combo.go{animation:combo 1.1s ease-out}@keyframes combo{20%{transform:translate(-50%,-50%) scale(1.2)}70%{transform:translate(-50%,-60%) scale(1)}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}
.big{font-size:calc(150px*var(--k));line-height:1.05;text-align:center}
.zy{font-size:calc(40px*var(--k));font-weight:900;text-align:center;letter-spacing:6px;color:var(--teal)}
.zyrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
.spk{border:none;background:var(--teal);color:#fff;border-radius:50%;width:60px;height:60px;font-size:28px;box-shadow:0 5px 0 #0d7363;flex:none}
.hint{font-size:calc(20px*var(--k));font-weight:900;text-align:center;margin:4px 0}
/* 字總表 */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ct{border:none;background:#fff;border-radius:22px;padding:8px 6px 10px;box-shadow:0 6px 0 #0002;font-family:inherit;color:var(--ink);position:relative}
.ct .c{font-size:calc(80px*var(--k));line-height:1.1;display:block}
.ct img{position:absolute;right:6px;top:6px;width:38px;height:38px;object-fit:contain;opacity:.9}
.ct .rd{display:flex;justify-content:center;gap:6px;margin-top:4px}
.ct .rd i{width:16px;height:16px;border-radius:50%;border:2px solid #ffb347;background:#fff}
.ct .rd i.on{background:var(--orange)}
.ct.done{background:#e3f8d8}.ct.done::after{content:"⭐";position:absolute;left:8px;top:6px;font-size:24px}
/* 看圖 */
.evo{display:flex;align-items:center;justify-content:space-between;gap:4px}
.evo .box{flex:1;background:#fff;border-radius:16px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;opacity:.12;transition:opacity .6s,transform .6s;border:3px solid #ffe2b8;overflow:hidden}
.evo .box.show{opacity:1;transform:scale(1.04)}
.evo .box img{max-width:88%;max-height:88%}.evo .box svg{width:84%;height:84%}.evo .box span{font-size:70px}
.evo .ar{font-size:24px;color:var(--orange);font-weight:900}
.evo-lbl{display:flex;justify-content:space-between;font-size:15px;font-weight:900;color:#8a6a4a;padding:2px 8px 0}.evo-lbl b{flex:1;text-align:center}
/* 寫字回合 */
.rounds{display:flex;gap:6px;margin:2px 0 8px}
.rounds span{flex:1;text-align:center;border-radius:14px;padding:6px 2px;font-size:15px;font-weight:900;background:#fff;color:#aaa;border:3px solid #fff}
.rounds span.now{border-color:var(--orange);color:var(--ink);transform:scale(1.05)}
.rounds span.ok{background:#d6f5c9;color:var(--grass-d)}
#hw{margin:0 auto;position:relative;background:#fff;border-radius:16px;touch-action:none}
/* 配對翻牌 */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{height:104px;perspective:600px;border:none;background:none;padding:0}
.mc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.flip .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #0002}
.mc .f{background:repeating-linear-gradient(45deg,#ffb347 0 12px,#ffa21f 12px 24px);border:4px solid #fff;font-size:40px;color:#fff;font-weight:900}
.mc .b{background:#fff;transform:rotateY(180deg);border:4px solid #fff}
.mc .b img{max-height:84px;max-width:88%}.mc .b span{font-size:calc(62px*var(--k))}
.mc.got .b{background:#e3f8d8;border-color:var(--grass-d)}
/* 打地鼠 */
.target{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;border-radius:22px;padding:8px;box-shadow:0 5px 0 #0002}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;background:#7ccb5b;border-radius:24px;padding:14px 10px 18px;box-shadow:inset 0 -6px 0 #4f9e35}
.hole{position:relative;height:120px;overflow:hidden}
.hole::after{content:"";position:absolute;left:6%;right:6%;bottom:0;height:34px;border-radius:50%;background:#5a3a1a;box-shadow:inset 0 6px 0 #3a2410}
.mole{position:absolute;left:12%;right:12%;bottom:-110px;height:104px;transition:bottom .25s;z-index:1;border:none;background:none;padding:0}
.mole.up{bottom:10px}
.mole .body{position:absolute;inset:0;background:#a8743f;border-radius:44px 44px 14px 14px;border:3px solid #6b431f}
.mole .eye{position:absolute;top:16px;width:8px;height:10px;background:#2b1a0a;border-radius:50%}
.mole .sign{position:absolute;left:4px;right:4px;top:34px;bottom:8px;background:#fffdf6;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:calc(44px*var(--k));border:2px solid #6b431f;color:var(--ink)}
.mole.hit .body{background:#ffcf66}.mole.bonk{animation:shake .4s}
.mole.bonk .sign{background:#ffd6d6}
/* 送字回家 */
.houses{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 10px;margin-top:30px}
.house{position:relative;background:#fff;border-radius:18px 18px 14px 14px;padding:22px 4px 6px;box-shadow:0 5px 0 #0002;text-align:center;min-height:118px;border:4px solid #fff}
.house::before{content:"";position:absolute;left:-4px;right:-4px;top:-22px;height:26px;background:#e8735a;clip-path:polygon(50% 0,100% 100%,0 100%)}
.house img{max-height:62px;max-width:86%}
.house .slot{height:46px;margin:4px auto 0;width:60px;border:3px dashed #ffc58a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:calc(36px*var(--k))}
.house.lit{background:#fff7c2;border-color:#ffd23f}.house.lit .slot{border:3px solid var(--grass-d);background:#e3f8d8}
.house.hover{border-color:var(--orange)}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:22px;min-height:96px;background:#fff8;border-radius:22px;padding:12px}
.tile{width:82px;height:82px;border-radius:18px;background:#fffdf6;border:4px solid #ffb347;box-shadow:0 5px 0 #e08a3a;display:flex;align-items:center;justify-content:center;font-size:calc(52px*var(--k));touch-action:none;cursor:grab}
.tile.drag{position:fixed;z-index:40;pointer-events:none;transform:scale(1.12);box-shadow:0 12px 18px #0003}
.tile.ghost{opacity:.25}
/* 火眼金睛 */
.eyeq{display:flex;align-items:center;gap:12px;justify-content:center}
.eyeq img{height:110px}
.eyeopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.eo{border:none;background:#fff;border-radius:22px;aspect-ratio:1;box-shadow:0 6px 0 #0002;position:relative;padding:10px}
.eo svg{width:100%;height:100%}
.eo.good{background:#d6f5c9}.eo.badc{background:#ffe0e0}
.eo .why{position:absolute;left:6px;right:6px;bottom:6px;background:#ef5350;color:#fff;border-radius:12px;font-weight:900;font-size:15px;padding:3px}
/* 泡泡 */
.sea{position:relative;height:480px;border-radius:24px;overflow:hidden;background:linear-gradient(#bfe9ff,#7fd0f5);margin-top:10px;border:4px solid #fff;box-shadow:0 6px 0 #0002}
.bub{position:absolute;bottom:-110px;width:96px;height:96px;border-radius:50%;border:none;padding:0;background:radial-gradient(circle at 30% 28%,#fff 0 12%,#ffffffaa 13% 22%,#e9f8ffcc 23% 60%,#9fdcf7cc 100%);box-shadow:inset 0 0 0 3px #ffffffcc,0 4px 10px #0002;font-size:calc(52px*var(--k));color:var(--ink);display:flex;align-items:center;justify-content:center;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-640px)}}
.bub.pop{animation:popb .35s forwards!important}@keyframes popb{to{transform:scale(1.6);opacity:0}}
.bub.no{animation-play-state:paused;filter:hue-rotate(140deg)}
.pq{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:22px;padding:8px;box-shadow:0 5px 0 #0002;min-height:96px}
.pq img{height:80px}
/* 選擇題 */
.opts{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.opts.pics{display:grid;grid-template-columns:repeat(3,1fr)}
.opt{border:none;background:#fff;border-radius:22px;font-size:calc(76px*var(--k));padding:2px;box-shadow:0 6px 0 #0002;color:var(--ink);font-family:inherit;min-height:84px}
.opt.zyopt{font-size:calc(42px*var(--k));font-weight:900;color:var(--teal);letter-spacing:4px;padding:12px}
.opt img{max-width:90%;max-height:96px;display:block;margin:4px auto}
.opt.good{background:#d6f5c9}.opt.badc{background:#ffd6d6}
.qtype{display:inline-block;background:var(--teal);color:#fff;border-radius:14px;padding:4px 12px;font-weight:900;font-size:16px}
.qbox{text-align:center;padding:10px}
.qbox img{max-height:140px;max-width:80%}
.qbox svg{width:140px;height:140px}
.bad{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* 錄音 */
.rec{width:124px;height:124px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:22px;font-weight:900;font-family:inherit;box-shadow:0 7px 0 #a82b28;display:block;margin:10px auto}
.rec.on{animation:pulse 1s infinite;background:#d32f2f}@keyframes pulse{50%{transform:scale(1.08)}}
.recbar{height:12px;background:#fff;border-radius:8px;overflow:hidden;margin:6px 20px}.recbar i{display:block;height:100%;width:0;background:var(--red)}
.note{font-size:16px;color:#7a6a5a;text-align:center;margin-top:8px}
/* 寵物屋 */
.room{background:linear-gradient(#fff1f7 0 70%,#ffd9e8 70%);border-radius:26px;padding:16px;border:4px solid #fff;box-shadow:0 6px 0 #0002;text-align:center;position:relative;min-height:290px}
.room .lvtag{position:absolute;left:12px;top:10px;background:var(--pink);color:#fff;border-radius:14px;padding:4px 10px;font-weight:900;font-size:17px}
.room .hearts{position:absolute;right:12px;top:10px;font-size:20px}
.room img{height:200px;max-width:80%;margin-top:22px}
.foods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.food{border:none;background:#fff;border-radius:20px;padding:10px 4px;font-family:inherit;box-shadow:0 5px 0 #0002;color:var(--ink);font-size:16px;font-weight:900}
.food .e{font-size:42px;display:block}
.food .p{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:2px}
.food .p .coin{width:20px;height:20px;border-width:2px}.food .p .coin::after{left:6px;top:2px;height:10px}
.float{position:fixed;font-size:30px;pointer-events:none;z-index:9;animation:up 1.2s ease-out forwards}@keyframes up{to{transform:translateY(-120px);opacity:0}}
/* 浮層 */
.ov{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}.ov .card{max-width:400px;width:100%;max-height:92vh;overflow:auto}
#cele .card{text-align:center}#cele h2{font-size:30px;margin:6px 0}
.stars{font-size:46px;letter-spacing:4px;color:#ffc107}
.stars i{font-style:normal;display:inline-block;transform:scale(0)}.stars i.on{animation:star .5s forwards}@keyframes star{70%{transform:scale(1.4)}100%{transform:scale(1)}}
.fly{position:fixed;width:28px;height:28px;border-radius:50%;background:var(--coin);border:3px solid #e0a800;z-index:30;pointer-events:none;animation:fly .9s ease-in forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:.3}}
.rain{position:fixed;top:-40px;width:26px;height:26px;border-radius:50%;background:var(--coin);border:3px solid #e0a800;z-index:30;pointer-events:none;animation:rain 1.6s ease-in forwards}
@keyframes rain{to{transform:translateY(110vh) rotate(360deg)}}
/* 設定 */
#gear{position:fixed;right:14px;bottom:16px;width:62px;height:62px;border-radius:50%;border:4px solid #fff;background:#5b6cff;color:#fff;font-size:30px;box-shadow:0 5px 0 #3a46b8;z-index:15}
.set h3{margin:12px 0 6px;font-size:20px}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:3px solid #e4e4e4;background:#fff;border-radius:16px;padding:10px 4px;font-size:18px;font-weight:900;font-family:inherit;color:var(--ink)}
.seg button.on{border-color:#5b6cff;background:#eef0ff;color:#3a46b8}
.set select{width:100%;font-size:18px;padding:10px;border-radius:14px;border:3px solid #e4e4e4;font-family:inherit}
</style>
</head>
<body>
<div id="app">

<section class="screen on" id="s-login">
  <div class="title" style="font-size:32px;margin-top:14px">生字練習網站</div>
  <div class="bubble" style="margin-top:16px">你是誰呢？點一下你的名字</div>
  <div class="who">
    <button onclick="login('政維')"><img src="img/dra0.webp" alt="">政維</button>
    <button onclick="login('測試者')"><img src="img/dog0.webp" alt="" style="filter:grayscale(.6)">測試者<small>老師試玩用</small></button>
  </div>
</section>

<section class="screen" id="s-egg">
  <div class="title" style="margin-top:14px">選一顆寵物蛋！</div>
  <div class="bubble">寫字、答題可以拿金幣，<br>用金幣餵牠，牠就會孵化長大喔！</div>
  <div class="eggs">

function zhVoices(){return 'speechSynthesis' in window?speechSynthesis.getVoices().filter(v=>/^zh|cmn/i.test(v.lang)):[]}
function curVoice(){const vs=zhVoices();return vs.find(v=>v.name===SET.voice)||vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs[0]||null}
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}
function say(t,rate){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';const v=curVoice();if(v)u.voice=v;u.rate=Math.min(2,(rate||1)*SET.rate);u.volume=SET.vol;speechSynthesis.speak(u)}
let AC;function tone(f,d,type,v){if(!SET.sfx)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=(v||.05)*SET.vol;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}

function flyCoin(el,t){if(!el||!t){ding();return}const r=el.getBoundingClientRect(),tr=t.getBoundingClientRect();const c=document.createElement('div');c.className='fly';

function startStep(i){mistakes=0;combo=0;[openChars,homeStart,eyeStart,bubStart,moleStart,qStart,rcStart][i]()}

function wrBegin(){wrR=0;go('s-write');wrRound()}
function drawRounds(){$('rounds').innerHTML=ROUNDS.map((t,i)=>`<span class="${i<wrR?'ok':i===wrR?'now':''}">${i<wrR?'✓ ':''}${t}</span>`).join('')}
function wrRound(){
  const trace=wrR<2,free=FREE_TRACE.has(curC);drawRounds();
  $('wr-title').textContent=trace?'描一描':'自己寫';
  $('wr-demo').style.display=(trace&&!free)?'':'none';$('wr-done').style.display=free?'block':'none';
  const size=Math.min(window.innerWidth-56,340);const box=$('hw');box.style.width=size+'px';box.style.height=size+'px';
  box.innerHTML=`<svg width="${size}" height="${size}" style="position:absolute;left:0;top:0"><g stroke="#f3c79a" stroke-dasharray="8 8" stroke-width="2"><line x1="0" y1="${size/2}" x2="${size}" y2="${size/2}"/><line x1="${size/2}" y1="0" x2="${size/2}" y2="${size}"/></g><rect x="1.5" y="1.5" width="${size-3}" height="${size-3}" fill="none" stroke="#e08a3a" stroke-width="3" rx="12"/></svg><div id="hw-in" style="position:relative"></div>`;
  writer=HanziWriter.create($('hw-in'),curC,{width:size,height:size,padding:18,showOutline:trace,showCharacter:false,strokeColor:'#ff7a00',outlineColor:trace?'#d9d9d9':'#ffd2a8',drawingColor:'#3a2a1a',drawingWidth:22,highlightColor:'#1fa892',strokeAnimationSpeed:.8,delayBetweenStrokes:350,
    charDataLoader:(ch,done)=>fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/'+encodeURIComponent(ch)+'.json').then(r=>r.json()).then(done).catch(()=>{$('wr-hint').textContent='筆順資料載入失敗，請檢查網路'})});
  if(free){setupFree(size);$('wr-hint').textContent=trace?'照課本筆順描，描好按下面的按鈕':'不看提示，自己寫寫看！';return}
  $('wr-hint').textContent=trace?'跟著灰色的字，一筆一筆描':'不看提示，自己寫！寫錯會出現提示';
  say(trace?'描一描':'自己寫寫看',1.1);
  writer.quiz({showHintAfterMisses:1,highlightOnComplete:true,leniency:trace?1.4:1.2,
    onCorrectStroke:d=>{tone(880+d.strokeNum*80,.08);$('wr-hint').textContent=`第 ${d.strokeNum+1} 筆，寫對了！`},
    onMistake:d=>{miss();charMiss++;$('wr-hint').textContent=trace?'再試一次，看綠色的提示':'這一筆不對，看綠色的提示再寫'; if(!trace&&d.mistakesOnStroke>=2){writer.showOutline()}},
    onComplete:()=>roundDone()});}
function roundDone(){$('wr-hint').textContent=['描得好！','描得真漂亮！','寫對了！好厲害！','太棒了，自己會寫了！'][wrR];hit($('hw'),wrR<2?1:2);
  const d=cw();d[curC]=Math.max(d[curC]||0,wrR+1);save();wrR++;
  setTimeout(()=>{if(wrR<4)wrRound();else charFinished()},1300)}

  const d=cw();if(chars.every(c=>(d[c]||0)>=4)&&!(st.stars[group]||{})[0]){finishStep(0,'每個字都描好、也會自己寫了');return}
  setTimeout(openChars,600)}
function wrDemo(){if(!writer)return;writer.cancelQuiz();writer.hideCharacter();writer.animateCharacter({onComplete:()=>setTimeout(wrRound,500)})}
let fc=null,fdrawn=0;
function setupFree(size){const box=$('hw');const c=document.createElement('canvas');c.style.cssText='position:absolute;left:0;top:0;z-index:2;touch-action:none';box.appendChild(c);
  const dpr=window.devicePixelRatio||1;c.width=size*dpr;c.height=size*dpr;c.style.width=c.style.height=size+'px';
  fc=c.getContext('2d');fc.scale(dpr,dpr);fc.lineCap=fc.lineJoin='round';fc.lineWidth=20;fc.strokeStyle='#3a2a1a';fdrawn=0;
  let drawing=false,last=null;const pt=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{drawing=true;last=pt(e);c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!drawing)return;const p=pt(e);fc.beginPath();fc.moveTo(...last);fc.lineTo(...p);fc.stroke();fdrawn+=Math.hypot(p[0]-last[0],p[1]-last[1]);last=p};
  c.onpointerup=c.onpointercancel=()=>{if(drawing)tone(900,.05);drawing=false}}
function freeDone(){const size=parseInt($('hw').style.width)||300;if(fdrawn<size*.8){$('wr-hint').textContent='還沒寫完喔，再寫一寫';oops();return}
  if(wrR>=2){writer.showOutline();$('wr-hint').textContent='跟課本的字比一比，一樣嗎？'}
  $('wr-done').style.display='none';setTimeout(roundDone,wrR>=2?1400:0)}

let homeLeft=0,dragEl=null,dragSrc=null,dragOff=[0,0];
function homeStart(){homeLeft=chars.length;setProg('home-prog',0,1);
  $('houses').innerHTML=shuffle(chars).map(c=>`<div class="house" data-c="${c}"><img src="img/p_${c}.webp" alt=""><div class="slot kai"></div></div>`).join('');

  document.querySelectorAll('#tray .tile').forEach(t=>t.addEventListener('pointerdown',dragStart));
  go('s-home');say('把字送回家');}
function dragStart(e){if(dragEl)return;e.preventDefault();dragSrc=e.currentTarget;say(dragSrc.dataset.c);
  const r=dragSrc.getBoundingClientRect();dragOff=[e.clientX-r.left,e.clientY-r.top];
  dragEl=dragSrc.cloneNode(true);dragEl.classList.add('drag');document.body.appendChild(dragEl);dragSrc.classList.add('ghost');dragMove(e);
  window.addEventListener('pointermove',dragMove);window.addEventListener('pointerup',dragEnd,{once:true});window.addEventListener('pointercancel',dragEnd,{once:true})}
function houseAt(x,y){return [...document.querySelectorAll('.house')].find(h=>{const r=h.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top-22&&y<=r.bottom})}
function dragMove(e){if(!dragEl)return;dragEl.style.left=(e.clientX-dragOff[0])+'px';dragEl.style.top=(e.clientY-dragOff[1])+'px';
  document.querySelectorAll('.house').forEach(h=>h.classList.remove('hover'));const h=houseAt(e.clientX,e.clientY);if(h&&!h.classList.contains('lit'))h.classList.add('hover')}
function dragEnd(e){window.removeEventListener('pointermove',dragMove);if(!dragEl)return;
  const h=houseAt(e.clientX,e.clientY);document.querySelectorAll('.house').forEach(x=>x.classList.remove('hover'));
  const c=dragSrc.dataset.c;dragEl.remove();dragEl=null;
  if(h&&!h.classList.contains('lit')&&h.dataset.c===c){h.classList.add('lit');h.querySelector('.slot').textContent=c;dragSrc.remove();hit(h,1);say(c+'，回到家了');
    homeLeft--;setProg('home-prog',chars.length-homeLeft,chars.length);if(!homeLeft)setTimeout(()=>finishStep(1,'每個字都送回家了'),900)}
  else{dragSrc.classList.remove('ghost');if(h){miss();h.classList.add('bad');setTimeout(()=>h.classList.remove('bad'),450);say('不是這一家喔')}}
  dragSrc=null}

/* ====== 3 火眼金睛（字形辨識） ====== */
const HCACHE={};
function hzData(c){return HCACHE[c]||(HCACHE[c]=fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/'+encodeURIComponent(c)+'.json').then(r=>r.json()))}
function glyph(d,{skip=-1,mirror=false}={}){const paths=d.strokes.filter((_,i)=>i!==skip).map(p=>`<path d="${p}"/>`).join('');
  return `<svg viewBox="0 0 1024 1024"><g fill="#3a2a1a" transform="${mirror?'translate(1024,0) scale(-1,1) ':''}translate(0,900) scale(1,-1)">${paths}</g></svg>`}
let eyeQ=[],eyeI=0,eyeC='',eyeMiss=0;
function eyeStart(){eyeQ=shuffle([...chars,...chars]).filter((c,i,a)=>i===0||c!==a[i-1]).slice(0,Math.max(6,chars.length));eyeI=0;go('s-eye');eyeShow()}
async function eyeShow(){eyeC=eyeQ[eyeI];eyeMiss=0;setProg('eye-prog',eyeI,eyeQ.length);
  $('eye-pic').src=`img/p_${eyeC}.webp`;$('eye-zy').textContent=ZY[eyeC];$('eye-opts').innerHTML='<div class="hint">載入中…</div>';say(eyeC);
  try{const d=await hzData(eyeC);const ops=[{svg:glyph(d),ok:1}];
    const fakes=[];
    if(d.strokes.length>=2){const k=1+Math.floor(Math.random()*(d.strokes.length-1));fakes.push({svg:glyph(d,{skip:k}),why:'少了一筆'})}
    if(!SYM.has(eyeC))fakes.push({svg:glyph(d,{mirror:true}),why:'左右顛倒了'});
    for(const l of shuffle([...(LOOK[eyeC]||'')])){const ld=await hzData(l).catch(()=>null);if(ld)fakes.push({svg:glyph(ld),why:`這是「${l}」`,l})}
    if(d.strokes.length>=4&&fakes.length<3){const k=Math.floor(Math.random()*d.strokes.length);fakes.push({svg:glyph(d,{skip:k}),why:'少了一筆'})}
    const pickF=[];const seen=new Set();for(const f of fakes){const key=f.why;if(seen.has(key)&&f.why==='少了一筆')continue;seen.add(key);pickF.push(f);if(pickF.length===3)break}
    const all=shuffle([...ops,...pickF]);
    $('eye-opts').innerHTML=all.map((o,i)=>`<button class="eo" data-ok="${o.ok?1:0}" data-why="${o.why||''}" onclick="eyePick(this)">${o.svg}</button>`).join('');
  }catch(e){$('eye-opts').innerHTML='<div class="hint">字的資料載入失敗，請檢查網路</div>'}}
function eyePick(b){if(b.disabled)return;
  if(b.dataset.ok==='1'){b.classList.add('good');document.querySelectorAll('.eo').forEach(x=>x.disabled=true);if(!eyeMiss)hit(b,1);else{petAct('hop');ding()}say(eyeC+'，你的眼睛好厲害');
    setTimeout(()=>{if(eyeI<eyeQ.length-1){eyeI++;eyeShow()}else{setProg('eye-prog',1,1);finishStep(2,'每個字都找對了')}},1400)}
  else{eyeMiss++;miss();b.classList.add('badc','bad');b.disabled=true;b.insertAdjacentHTML('beforeend',`<span class="why">${b.dataset.why}</span>`);say(b.dataset.why.replace(/[「」]/g,''))}}

/* ====== 4 泡泡射擊 ====== */
let bubT='',bubHits=0,bubNeed=6,bubTimer=null,bubMode=0;
function bubStart(){bubStop();bubHits=0;setProg('bub-prog',0,1);$('sea').querySelectorAll('.bub').forEach(b=>b.remove());$('bub-start').style.display='block';
  $('bub-q').innerHTML='<div class="hint">戳破對的字泡泡！</div>';go('s-bub');say('準備好就按開始')}
function bubTarget(){bubT=chars[Math.floor(Math.random()*chars.length)];bubMode=(bubMode+1)%2;
  $('bub-q').innerHTML=(bubMode?`<img src="img/p_${bubT}.webp" alt="">`:`<div class="zy" style="font-size:calc(46px*var(--k))">${ZY[bubT]}</div>`)+`<button class="spk" onclick="say(bubT)">🔊</button>`;say(bubT)}
function bubGo(){$('bub-start').style.display='none';bubTarget();bubSpawn(true);bubTimer=setInterval(()=>bubSpawn(),1300)}
let bubLast=-1;
function bubSpawn(force){const sea=$('sea');if(sea.querySelectorAll('.bub:not(.pop)').length>=6)return;
  const hasT=[...sea.querySelectorAll('.bub:not(.pop)')].some(b=>b.dataset.c===bubT);
  const c=(force||!hasT||Math.random()<.4)?bubT:chars[Math.floor(Math.random()*chars.length)];
  const b=document.createElement('button');b.className='bub kai';b.dataset.c=c;b.textContent=c;
  const W=sea.clientWidth-100;let lane;do{lane=Math.floor(Math.random()*3)}while(lane===bubLast&&Math.random()<.7);bubLast=lane;
  b.style.left=(8+lane*(W/2.2)+Math.random()*20)+'px';b.style.animationDuration=(8+Math.random()*2.5)+'s';
  b.onclick=()=>bubTap(b);b.addEventListener('animationend',()=>{if(!b.classList.contains('pop'))b.remove()});sea.appendChild(b)}
function bubTap(b){if(b.classList.contains('pop'))return;
  if(b.dataset.c===bubT){b.classList.add('pop');tone(1200,.05,'sine',.1);hit(b,1);bubHits++;setProg('bub-prog',bubHits,bubNeed);setTimeout(()=>b.remove(),400);
    if(bubHits>=bubNeed){bubStop();setTimeout(()=>finishStep(3,`戳破 ${bubNeed} 個對的泡泡`),700);return}
    setTimeout(bubTarget,500)}
  else{b.classList.add('no');miss();say(b.dataset.c+'，不是這個');setTimeout(()=>{b.classList.remove('no')},600)}}
function bubStop(){clearInterval(bubTimer);bubTimer=null}
/* ====== 5 打地鼠 ====== */
let moleT='',moleHits=0,moleTimer=null,moleNeed=6,moleBusy=false;
function moleStart(){moleStop();moleHits=0;setProg('mole-prog',0,1);
  $('holes').innerHTML=Array.from({length:6},(_,i)=>`<div class="hole"><button class="mole" id="m${i}" onclick="moleTap(this)"><div class="body"></div><i class="eye" style="left:30%"></i><i class="eye" style="right:30%"></i><div class="sign kai"></div></button></div>`).join('');
  $('mole-zy').textContent='';$('mole-start').style.display='block';go('s-mole');say('準備好就按開始')}
function moleNewTarget(){moleT=chars[Math.floor(Math.random()*chars.length)];$('mole-zy').textContent=ZY[moleT];say(moleT)}
function moleGo(){$('mole-start').style.display='none';moleNewTarget();moleTick()}
function moleTick(){clearTimeout(moleTimer);
  const ms=[...document.querySelectorAll('.mole')];ms.forEach(m=>m.classList.remove('up','hit','bonk'));
  const k=Math.min(3,ms.length);const spots=shuffle([...ms.keys()]).slice(0,k);
  const pool=[moleT,...pick(chars,k-1,moleT)];while(pool.length<k)pool.push(chars[Math.floor(Math.random()*chars.length)]);
  shuffle(pool).forEach((c,i)=>{const m=ms[spots[i]];m.dataset.c=c;m.querySelector('.sign').textContent=c;setTimeout(()=>m.classList.add('up'),60+i*120)});
  moleBusy=false;moleTimer=setTimeout(moleTick,2600)}
function moleTap(m){if(!m.classList.contains('up')||moleBusy)return;
  if(m.dataset.c===moleT){moleBusy=true;bonk();m.classList.add('hit');hit(m,1);moleHits++;setProg('mole-prog',moleHits,moleNeed);say(moleT+'，打中了');
    clearTimeout(moleTimer);if(moleHits>=moleNeed){setTimeout(()=>{moleStop();finishStep(4,`打中 ${moleNeed} 隻地鼠`)},900);return}
    setTimeout(()=>{moleNewTarget();moleTick()},1100)}
  else{m.classList.add('bonk');miss();say(m.dataset.c+'，不是這個');setTimeout(()=>m.classList.remove('up','bonk'),500)}}
function moleStop(){clearTimeout(moleTimer)}

/* ====== 6 綜合大挑戰 ====== */
const QT=[
 {n:'看圖選字',ask:c=>`<img src="img/p_${c}.webp" alt="">`,opt:'char',speak:null},
 {n:'看字選圖',ask:c=>`<div class="big kai" style="font-size:calc(110px*var(--k))">${c}</div>`,opt:'pic',speak:c=>c},
 {n:'看注音選字',ask:c=>`<div class="zy" style="font-size:calc(56px*var(--k))">${ZY[c]}</div>`,opt:'char',speak:c=>c},
 {n:'看字選注音',ask:c=>`<div class="big kai" style="font-size:calc(110px*var(--k))">${c}</div>`,opt:'zy',speak:null},
 {n:'古字猜今字',ask:c=>ancSvg(c,140),opt:'char',speak:null}];
let qList=[],qI=0,qCur=null,qMiss=0;
function qStart(){qList=[];const n=Math.max(8,chars.length*2);let last=-1;
  for(let i=0;i<n;i++){let t;do{t=Math.floor(Math.random()*QT.length)}while(t===last);last=t;qList.push({t,c:chars[i%chars.length]})}
  qList=shuffle(qList);qI=0;go('s-quiz');qShow()}
function qShow(){qCur=qList[qI];qMiss=0;const T=QT[qCur.t],c=qCur.c;setProg('q-prog',qI,qList.length);
  $('q-type').textContent=T.n;$('q-ask').innerHTML=T.ask(c)+(T.speak?`<div style="margin-top:6px"><button class="spk" onclick="say('${c}')">🔊</button></div>`:'');
  const opts=shuffle([c,...pick(chars,2,c)]);const box=$('q-opts');box.className='opts'+(T.opt==='pic'?' pics':'');
  box.innerHTML=opts.map(x=>`<button class="opt ${T.opt==='zy'?'zyopt':T.opt==='char'?'kai':''}" onclick="qPick(this,'${x}')">${T.opt==='pic'?`<img src="img/p_${x}.webp" alt="">`:T.opt==='zy'?ZY[x]:x}</button>`).join('');
  if(T.speak)setTimeout(()=>say(T.speak(c)),300)}
function qPick(b,x){if(b.disabled)return;
  if(x===qCur.c){b.classList.add('good');document.querySelectorAll('#q-opts .opt').forEach(o=>o.disabled=true);if(!qMiss)hit(b,1);else{petAct('hop');ding()}say(x+'，答對了');
    setTimeout(()=>{if(qI<qList.length-1){qI++;qShow()}else{setProg('q-prog',1,1);finishStep(5,'五種題目都過關了')}},1300)}
  else{qMiss++;miss();b.classList.add('badc','bad');b.disabled=true;say('再想一想')}}

/* ====== 7 念念看＋錄音 ====== */
let rcI=0,rcCur='',mr=null,chunks=[],blob=null,stream=null,recT=null,recStart=0;
const RECS=5;
function rcStart(){rcI=0;go('s-rec');rcShow()}
function rcShow(){rcCur=chars[rcI];setProg('rc-prog',rcI,chars.length);
  $('rc-char').textContent=rcCur;$('rc-zy').textContent=ZY[rcCur];recReset();
  $('rc-note').textContent=GAS_URL?'':'（試玩版：老師後台還沒接上，錄音只留在這支手機）'}
async function recToggle(){
  if(mr&&mr.state==='recording'){mr.stop();return}
  'speechSynthesis' in window&&speechSynthesis.cancel();
  try{stream=stream||await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$('rc-note').textContent='沒有拿到麥克風權限，請按「允許」再試一次';return}
  const types=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'];
  const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  chunks=[];mr=new MediaRecorder(stream,mt?{mimeType:mt}:undefined);
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{clearInterval(recT);blob=new Blob(chunks,{type:mr.mimeType||mt||'audio/webm'});const b=$('rc-btn');b.classList.remove('on');b.innerHTML='錄好了<br>✓';b.disabled=true;
    $('rc-after').style.display='flex';$('rc-send').style.display='block';$('rc-bar').style.width='100%';say('錄好了，可以聽聽看',1.2)};
  mr.start();recStart=Date.now();const b=$('rc-btn');b.classList.add('on');b.innerHTML='念完<br>按我停';
  recT=setInterval(()=>{const p=(Date.now()-recStart)/1000/RECS;$('rc-bar').style.width=Math.min(100,p*100)+'%';if(p>=1&&mr.state==='recording')mr.stop()},100)}
function recPlay(){if(blob){const a=new Audio(URL.createObjectURL(blob));a.volume=SET.vol;a.play()}}
function recReset(){blob=null;const b=$('rc-btn');b.disabled=false;b.classList.remove('on');b.innerHTML='按我<br>開始念';
  $('rc-after').style.display='none';const s=$('rc-send');s.style.display='none';s.disabled=false;s.textContent='送給老師 ✉️';$('rc-bar').style.width='0'}
function b64(bl){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(bl)})}
async function recSend(){if(!blob)return;const s=$('rc-send');s.disabled=true;s.textContent='傳送中…';let ok=false;
  if(GAS_URL){try{const data=await b64(blob);
      const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({student:who,group,char:rcCur,zhuyin:ZY[rcCur],mime:blob.type,data,ts:new Date().toISOString()})});
      const j=await r.json().catch(()=>({ok:r.ok}));ok=!!j.ok}catch(e){ok=false}}else ok=true;
  if(!ok){s.disabled=false;s.textContent='再送一次 ✉️';$('rc-note').textContent='傳送失敗，請檢查網路後再按一次';oops();return}
  addCoin(2,s);petAct('hop');s.textContent='老師收到了 ✓';say('老師收到了');
  setTimeout(()=>{if(rcI<chars.length-1){rcI++;rcShow()}else{setProg('rc-prog',1,1);finishStep(6,'每個字的聲音都送給老師了')}},1300)}

/* ====== 寵物屋 ====== */
function xpPct(){const x=st.pet.xp,s=stage();if(s===2)return 100;return Math.round((x-STAGE_XP[s])/(STAGE_XP[s+1]-STAGE_XP[s])*100)}
function openPet(){renderPet();go('s-pet');petTalk()}
function renderPet(){const s=stage();
  $('pt-img').src=petSrc();$('pt-lv').textContent='Lv.'+(s+1);
  $('pt-hearts').textContent='❤️'.repeat(Math.min(5,1+Math.floor((st.pet.fed||0)/3)));
  $('pt-xp').style.width=xpPct()+'%';
  $('pt-next').textContent=s===0?`再吃 ${STAGE_XP[1]-st.pet.xp} 點就會孵化！`:s===1?`再吃 ${STAGE_XP[2]-st.pet.xp} 點就會長大戴皇冠！`:`${PETS[st.pet.kind]}已經長大了！繼續餵牠讓牠更開心`;
  $('foods').innerHTML=FOODS.map((f,i)=>`<button class="food" onclick="feed(${i},this)"><span class="e">${f.e}</span>${f.n}<span class="p"><span class="coin"></span>${f.p}</span></button>`).join('');}
function petTalk(){const s=stage(),n=PETS[st.pet.kind];
  const lines=s===0?['（蛋輕輕搖了一下…）','（蛋裡好像有聲音！）']:s===1?[`我是${n}！我肚子好餓～`,'你今天寫字了嗎？','摸摸我！']:[`我是${n}國王！謝謝你照顧我`,'寫字好厲害！','我們再去冒險吧！'];
  $('pt-say').textContent=lines[Math.floor(Math.random()*lines.length)]}
function feed(i,btn){const f=FOODS[i];
  if((st.coins||0)<f.p){oops();$('pt-say').textContent='金幣不夠喔，去練習拿金幣吧！';say('金幣不夠喔');btn.classList.add('bad');setTimeout(()=>btn.classList.remove('bad'),450);return}
  const before=stage();st.coins-=f.p;st.pet.xp+=f.x;st.pet.fed=(st.pet.fed||0)+1;save();refresh();
  const r=btn.getBoundingClientRect();const fl=document.createElement('div');fl.className='float';fl.textContent=f.e+'❤️';fl.style.left=(r.left+r.width/2-30)+'px';fl.style.top=r.top+'px';document.body.appendChild(fl);setTimeout(()=>fl.remove(),1200);
  tone(784,.08);setTimeout(()=>tone(1046,.12),90);
  renderPet();petAct('hop');$('pt-say').textContent=['好好吃！','謝謝你！','還要還要～'][Math.floor(Math.random()*3)];
  if(stage()>before)setTimeout(()=>evolve(),500)}
function evolve(){const s=stage(),n=PETS[st.pet.kind];fanfare();coinRain();
  $('cele-img').src=petSrc();$('cele-t').textContent=s===1?`蛋孵化了！是${n}！`:`${n}長大了，戴上皇冠！`;
  $('cele-stars').innerHTML='';$('cele-s').textContent='謝謝你每天認真練習';
  $('cele').classList.add('on');$('cele-btn').onclick=()=>{$('cele').classList.remove('on');$('cele-btn').onclick=celeOk;renderPet();petTalk()};
  say(s===1?'蛋孵化了，是'+n:n+'長大了')}
function petPat(){if(!st.pet)return;petAct('hop');tone(1200,.08);$('pt-say').textContent=stage()===0?'（蛋開心地搖來搖去）':'嘻嘻，好癢～'}
</script>
