<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>潛能班評量報讀總覽</title>
<style>
:root{
  --desk:#e6ecef;--paper:#fff;--ink:#1c2a33;--muted:#5a6a74;--line:#cfd8dd;
  --accent:#0f7b6c;--accent-ink:#fff;--accent-soft:#d6efe9;--danger:#b3361f;--ok:#1f7a3a;
  --mid:#2f6fb5;--mid-soft:#dde9f7;--fin:#b5562f;--fin-soft:#f8e4da;--oth:#6b5aa8;--oth-soft:#e8e3f6;
  --font-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.5}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
header.top h1{margin:0;font-family:var(--font-display);font-size:30px;font-weight:900;letter-spacing:.04em;flex:1 1 auto}
header.top h1 small{display:block;font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:#e3b3a8}
.btn.sm{padding:5px 10px;font-size:15px;border-radius:10px}
select.sel{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper);font-weight:700}

.filters{background:var(--paper);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 0}
.frow+.frow{border-top:1px dashed var(--line)}
.frow .lab{font-weight:900;color:var(--muted);min-width:64px}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:700;font-size:18px}
.chip .n{font-size:14px;color:var(--muted);margin-left:4px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .n{color:var(--accent-ink);opacity:.85}
.chip.big{font-size:21px;padding:8px 22px}
.chip.t-期中考.on{background:var(--mid);border-color:var(--mid)}
.chip.t-期末考.on{background:var(--fin);border-color:var(--fin)}
.chip.t-其他評量.on{background:var(--oth);border-color:var(--oth)}

.group{margin:22px 0 8px}
.group h2{font-family:var(--font-display);font-size:24px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.group h2::after{content:"";flex:1;height:3px;background:var(--line);border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--paper);border-radius:var(--r);padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--accent)}
.card.t-期中考{border-top-color:var(--mid)}
.card.t-期末考{border-top-color:var(--fin)}
.card.t-其他評量{border-top-color:var(--oth)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:14px;font-weight:800;border-radius:8px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.tag.t-期中考{background:var(--mid-soft);color:var(--mid)}
.tag.t-期末考{background:var(--fin-soft);color:var(--fin)}
.tag.t-其他評量{background:var(--oth-soft);color:var(--oth)}
.tag.g{background:#eef1f3;color:var(--ink)}
.card h3{margin:0;font-family:var(--font-display);font-size:21px;line-height:1.35}
.qrbox{align-self:center;background:#fff;padding:8px;border-radius:10px;border:2px solid var(--line);cursor:zoom-in}
.qrbox img,.qrbox canvas{display:block;width:170px;height:170px}
.url{font-size:13px;color:var(--muted);word-break:break-all;background:#f3f6f7;border-radius:8px;padding:4px 8px;font-family:ui-monospace,Consolas,monospace}
.note{font-size:15px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.acts .btn{flex:1 1 auto;justify-content:center}
.manage-acts{display:none;gap:6px}
body.manage .manage-acts{display:flex}
.empty{background:var(--paper);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted);font-size:20px}

.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
.tools b{font-family:var(--font-display)}

.mbar{display:none;background:#fff7dc;border:2px dashed #e0a800;border-radius:var(--r);padding:10px 14px;margin-bottom:14px;gap:10px;align-items:center;flex-wrap:wrap}
body.manage .mbar{display:flex}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;padding:3px 10px;border-radius:999px;background:#eef1f3}
.pill .dot{width:10px;height:10px;border-radius:50%;background:#999}
.pill.ok .dot{background:var(--ok)}.pill.bad .dot{background:var(--danger)}

dialog{border:none;border-radius:18px;padding:0;max-width:min(640px,94vw);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,25,.55)}
.dlg{padding:18px 20px}
.dlg h2{margin:0 0 12px;font-family:var(--font-display)}
.form{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center}
.form label{font-weight:800}
.form input,.form select,.form textarea{border:2px solid var(--line);border-radius:10px;padding:7px 10px;width:100%;background:#fff}
.form .full{grid-column:1/-1}
.hint{font-size:14px;color:var(--muted)}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.err{color:var(--danger);font-weight:700}
.scanlist{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;margin:8px 0}
.scanitem{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
.scanitem div{flex:1}
.scanitem small{color:var(--muted);display:block}

#zoom{max-width:none;width:auto;background:#fff}
#zoom .dlg{text-align:center;padding:24px 30px}
#zoomQr{display:inline-block;padding:14px;background:#fff}
#zoomQr img,#zoomQr canvas{width:min(70vh,80vw);height:min(70vh,80vw)}
#zoomTitle{font-family:var(--font-display);font-size:34px;margin:0 0 8px}
#zoomUrl{font-size:18px;color:var(--muted);word-break:break-all;margin-top:6px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2a33;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3)}

@media print{
  body{background:#fff}
  header.top .btn,header.top select,.filters,.tools,.mbar,.acts,.note,.toast{display:none!important}
  .grid{grid-template-columns:repeat(3,1fr)}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid}
  .group{break-inside:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>潛能班評量報讀總覽<small>依考試別・年段・科目找報讀網站，掃 QR Code 就能作答</small></h1>
    <select class="sel" id="yearSel" aria-label="學年度"></select>
    <button class="btn" id="bPrint">🖨 列印 QR 卡</button>
    <button class="btn" id="bManage">⚙ 老師管理</button>
  </header>

  <div class="mbar" id="mbar">
    <b>老師管理模式</b>
    <span class="pill" id="connPill"><span class="dot"></span>尚未連線</span>
    <button class="btn primary sm" id="bAdd">＋ 新增報讀網站</button>
    <button class="btn sm" id="bScan">🔍 找存放庫裡還沒加入的網站</button>
    <button class="btn sm" id="bConn">🔑 GitHub 連線</button>
    <span class="hint" id="saveHint"></span>
  </div>

  <div class="tools">
    <b>📷 臨時考卷？</b>
    <span>用「評量報讀小幫手」拍照就能報讀</span>
    <a class="btn sm" id="helperLink" href="../" target="_blank" rel="noopener">開啟評量報讀小幫手</a>
    <button class="btn sm" id="bHelperQr">顯示 QR Code</button>
  </div>

  <div class="filters">
    <div class="frow"><span class="lab">考試別</span><div id="fType" style="display:contents"></div></div>
    <div class="frow"><span class="lab">年段</span><div id="fGrade" style="display:contents"></div></div>
    <div class="frow"><span class="lab">科目</span><div id="fSubj" style="display:contents"></div></div>
  </div>

  <div id="list"></div>
</div>

<dialog id="zoom"><div class="dlg">
  <h2 id="zoomTitle"></h2>
  <div id="zoomQr"></div>
  <div id="zoomUrl"></div>
  <div class="foot" style="justify-content:center"><button class="btn primary" id="bZoomClose">關閉</button></div>
</div></dialog>

<dialog id="edit"><form class="dlg" method="dialog" id="editForm">
  <h2 id="editTitle">新增報讀網站</h2>
  <div class="form">
    <label for="fUrl">網址</label>
    <div><input id="fUrl" placeholder="例如 social6-midterm/ 或完整網址 https://…" required>
      <div class="hint">同一個網站裡的資料夾只要打資料夾名稱；其他網站請貼完整網址。</div></div>
    <label for="fTitle">名稱</label>
    <div style="display:flex;gap:6px"><input id="fTitle" required placeholder="例如 六上社會期中評量報讀"><button type="button" class="btn sm" id="bAuto" title="讀取網頁標題並自動填入">自動帶入</button></div>
    <label for="fYear">學年度</label><input id="fYear" type="number" min="100" max="200">
    <label for="fGradeSel">年段</label><select id="fGradeSel"></select>
    <label for="fTerm">學期</label><select id="fTerm"><option>上</option><option>下</option></select>
    <label for="fSubjSel">科目</label><select id="fSubjSel"></select>
    <label for="fTypeSel">考試別</label><select id="fTypeSel"></select>
    <label for="fTest">測試版網址</label><input id="fTest" placeholder="可不填，例如 social6-midterm-test/">
    <label for="fNote">備註</label><input id="fNote" placeholder="可不填，例如 第1～4單元">
  </div>
  <p class="err" id="editErr" hidden></p>
  <div class="foot">
    <button type="button" class="btn" id="bEditCancel">取消</button>
    <button type="button" class="btn primary" id="bEditSave">儲存到網站</button>
  </div>
</form></dialog>

<dialog id="conn"><div class="dlg">
  <h2>連線 GitHub（儲存清單用）</h2>
  <p class="hint">和「評量報讀小幫手｜老師端」用同一組權杖。如果老師端已經連線過，這裡會自動沿用。</p>
  <div class="form">
    <label for="cRepo">存放庫</label><input id="cRepo" value="liniris1023/sped-exam-reader">
    <label for="cTok">權杖</label><input id="cTok" type="password" placeholder="github_pat_ 開頭的一長串">
    <span></span><label style="font-weight:600"><input type="checkbox" id="cRemember" checked style="width:auto"> 在這台裝置記住</label>
  </div>
  <p class="err" id="connErr" hidden></p>
  <div class="foot">
    <button class="btn danger" id="bLogout" type="button">登出</button>
    <button class="btn" id="bConnClose" type="button">關閉</button>
    <button class="btn primary" id="bConnGo" type="button">連線</button>
  </div>
</div></dialog>

<dialog id="scan"><div class="dlg">
  <h2>存放庫裡還沒加入的網站</h2>
  <p class="hint" id="scanHint">搜尋中…</p>
  <div class="scanlist" id="scanList"></div>
  <div class="foot"><button class="btn primary" id="bScanClose" type="button">關閉</button></div>
</div></dialog>

<div class="toast" id="toast" hidden></div>

<script src="lib/qrcode.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const TYPES = ['期中考','期末考','其他評量'];
const GRADES = [1,2,3,4,5,6,0];
const GNAME = g => g ? '一二三四五六'[g-1]+'年級' : '未分年段';
const SUBJECTS = ['國語','數學','英語','社會','自然','生活','其他'];
const CACHE_KEY = 'exams_sites_cache';
const ROOT = new URL('../', location.href);           // 存放庫網站根目錄
const ls = {
  get(k,d,s){ try{ const v=(s?sessionStorage:localStorage).getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v,s){ try{ (s?sessionStorage:localStorage).setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k);}catch(e){} }
};
let toastT;
function toast(m,ms=3200){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,ms); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fullUrl(u){ if(!u) return ''; try{ return new URL(u, ROOT).href; }catch(e){ return u; } }
function nowYear(){ const d=new Date(); return d.getFullYear()-1911-(d.getMonth()<7?1:0); }

/* ---------- 資料 ---------- */
let DATA = {updated:'', sites:[]}, SHA = null;
const F = { year: null, type: '全部', grade: '全部', subj: '全部' };
Object.assign(F, ls.get('exams_filter', {}));

async function load(){
  let remote = null;
  try{ const r = await fetch('sites.json?t='+Date.now(), {cache:'no-store'}); if(r.ok) remote = await r.json(); }catch(e){}
  const cache = ls.get(CACHE_KEY, null);
  // GitHub Pages 更新要 1–3 分鐘：剛存過的話先用本機較新的那份
  if(cache && (!remote || (cache.updated||'') > (remote.updated||''))) DATA = cache;
  else if(remote) DATA = remote;
  if(!Array.isArray(DATA.sites)) DATA.sites = [];
  render();
}

/* ---------- 篩選與畫面 ---------- */
function years(){ const s=new Set(DATA.sites.map(x=>+x.year||nowYear())); s.add(nowYear()); return [...s].sort((a,b)=>b-a); }
function inYear(x){ return F.year==='全部' || (+x.year||nowYear())===+F.year; }
function match(x, skip){
  return inYear(x)
    && (skip==='type' || F.type==='全部' || x.type===F.type)
    && (skip==='grade' || F.grade==='全部' || +x.grade===+F.grade)
    && (skip==='subj' || F.subj==='全部' || x.subject===F.subj);
}
function chips(el, key, values, label, cls){
  el.innerHTML = '';
  const all = ['全部', ...values];
  all.forEach(v => {
    const n = DATA.sites.filter(x => match(x, key) && (v==='全部' || String(key==='grade'?+x.grade:key==='type'?x.type:x.subject)===String(v))).length;
    if(v!=='全部' && n===0 && String(F[key])!==String(v)) return;
    const b = document.createElement('button');
    b.className = 'chip'+(cls?' '+cls:'')+(key==='type'&&v!=='全部'?' t-'+v:'')+(String(F[key])===String(v)?' on':'');
    b.innerHTML = esc(label ? label(v) : v)+'<span class="n">'+n+'</span>';
    b.onclick = () => { F[key] = v; ls.set('exams_filter', F); render(); };
    el.appendChild(b);
  });
}
function render(){
  const ys = years();
  if(F.year===null || (F.year!=='全部' && !ys.includes(+F.year))) F.year = ys[0];
  const ysel = $('yearSel'); ysel.innerHTML = '';
  [...ys, '全部'].forEach(y => { const o=document.createElement('option'); o.value=y; o.textContent = y==='全部' ? '全部學年度' : y+' 學年度'; if(String(F.year)===String(y)) o.selected=true; ysel.appendChild(o); });
  chips($('fType'), 'type', TYPES, null, 'big');
  chips($('fGrade'), 'grade', GRADES, v => v==='全部' ? '全部' : GNAME(+v));
  chips($('fSubj'), 'subj', SUBJECTS);

  const list = $('list'); list.innerHTML = '';
  const items = DATA.sites.filter(x => match(x));
  if(!items.length){ list.innerHTML = '<div class="empty">這個條件下還沒有報讀網站。'+(document.body.classList.contains('manage')?'可以按上方「＋ 新增報讀網站」。':'')+'</div>'; return; }
  const gorder = g => g===0 ? 99 : -g; // 高年級在前，未分年段最後
  const groups = [...new Set(items.map(x=>+x.grade||0))].sort((a,b)=>gorder(a)-gorder(b));
  groups.forEach(g => {
    const sec = document.createElement('section'); sec.className = 'group';
    sec.innerHTML = '<h2>'+GNAME(g)+'</h2>';
    const grid = document.createElement('div'); grid.className = 'grid';
    items.filter(x=>(+x.grade||0)===g)
      .sort((a,b)=> TYPES.indexOf(a.type)-TYPES.indexOf(b.type) || SUBJECTS.indexOf(a.subject)-SUBJECTS.indexOf(b.subject) || (b.added||0)-(a.added||0))
      .forEach(x => grid.appendChild(card(x)));
    sec.appendChild(grid); list.appendChild(sec);
  });
}
function makeQr(el, text, size){
  el.innerHTML = '';
  try{ new QRCode(el, {text, width:size, height:size, correctLevel: QRCode.CorrectLevel.M}); }
  catch(e){ el.textContent = 'QR Code 產生失敗'; }
}
function card(x){
  const u = fullUrl(x.url);
  const c = document.createElement('article'); c.className = 'card t-'+x.type;
  c.innerHTML = `
    <div class="tags"><span class="tag t-${esc(x.type)}">${esc(x.type)}</span><span class="tag">${esc(x.subject)}</span><span class="tag g">${x.grade?esc('一二三四五六'[x.grade-1]+x.term):esc(x.term+'學期')}</span><span class="tag g">${esc(x.year||'')} 學年度</span></div>
    <h3>${esc(x.title)}</h3>
    <div class="qrbox" title="點一下放大"></div>
    <div class="url">${esc(u)}</div>
    ${x.note?`<div class="note">${esc(x.note)}</div>`:''}
    <div class="acts">
      <a class="btn primary sm" href="${esc(u)}" target="_blank" rel="noopener">▶ 開啟</a>
      <button class="btn sm" data-a="copy">📋 複製網址</button>
      <button class="btn sm" data-a="zoom">🔍 放大 QR</button>
      ${x.test?`<a class="btn sm" href="${esc(fullUrl(x.test))}" target="_blank" rel="noopener" title="老師測試用">🧪 測試版</a>`:''}
    </div>
    <div class="manage-acts"><button class="btn sm" data-a="edit">✏ 編輯</button><button class="btn sm danger" data-a="del">🗑 移除</button></div>`;
  makeQr(c.querySelector('.qrbox'), u, 340);
  c.querySelector('.qrbox').onclick = () => zoom(x.title, u);
  c.querySelector('[data-a=zoom]').onclick = () => zoom(x.title, u);
  c.querySelector('[data-a=copy]').onclick = () => copy(u);
  c.querySelector('[data-a=edit]').onclick = () => openEdit(x);
  c.querySelector('[data-a=del]').onclick = () => removeSite(x);
  return c;
}
async function copy(t){
  try{ await navigator.clipboard.writeText(t); toast('已複製網址'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('已複製網址');}catch(_){ prompt('請複製這個網址', t); } ta.remove(); }
}
function zoom(title, u){
  $('zoomTitle').textContent = title; $('zoomUrl').textContent = u;
  makeQr($('zoomQr'), u, 800); $('zoom').showModal();
}
$('bZoomClose').onclick = () => $('zoom').close();
$('zoom').addEventListener('click', e => { if(e.target===$('zoom')) $('zoom').close(); });
$('yearSel').onchange = e => { F.year = e.target.value==='全部' ? '全部' : +e.target.value; ls.set('exams_filter', F); render(); };
$('bPrint').onclick = () => window.print();
$('bHelperQr').onclick = () => zoom('評量報讀小幫手（拍照報讀）', ROOT.href);
$('helperLink').href = ROOT.href;

/* ---------- 老師管理 ---------- */
const G = { token:'', owner:'', repo:'', branch:'main', ready:false };
function setPill(s, t){ const p=$('connPill'); p.className='pill'+(s?' '+s:''); p.innerHTML='<span class="dot"></span>'; p.append(t); }
$('bManage').onclick = () => {
  const on = document.body.classList.toggle('manage');
  $('bManage').textContent = on ? '✓ 結束管理' : '⚙ 老師管理';
  if(on && !G.ready) autoConnect();
  render();
};
async function gh(path, opt={}){
  const r = await fetch('https://api.github.com'+path, {...opt, headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+G.token,'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===204) return null;
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const e=new Error((j&&j.message)||('HTTP '+r.status)); e.status=r.status; throw e; }
  return j;
}
function guessRepo(){
  const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
  if(!m) return 'liniris1023/sped-exam-reader';
  const seg = location.pathname.split('/').filter(Boolean);
  return m[1]+'/'+(seg[0]||m[1]+'.github.io');
}
async function connect(token, repo, remember){
  [G.owner, G.repo] = repo.split('/'); G.token = token;
  setPill('', '連線中…');
  const info = await gh('/repos/'+G.owner+'/'+G.repo);
  if(info.permissions && info.permissions.push===false) throw Object.assign(new Error('這個權杖沒有寫入權限'),{status:403});
  G.branch = info.default_branch || 'main'; G.ready = true;
  ls.del('erh_t_token'); ls.set('erh_t_token', token, !remember); ls.set('erh_t_repo', repo);
  setPill('ok', '已連線，可以儲存');
}
async function autoConnect(){
  const tok = ls.get('erh_t_token', '') || ls.get('erh_t_token', '', true);
  const repo = ls.get('erh_t_repo', '') || guessRepo();
  $('cRepo').value = repo;
  if(!tok){ setPill('bad', '尚未連線（按「GitHub 連線」）'); return; }
  try{ await connect(tok, repo, !!localStorage.getItem('erh_t_token')); }
  catch(e){ G.ready=false; setPill('bad', '連線失敗：'+(e.status===401?'權杖過期':e.message)); }
}
$('bConn').onclick = () => { $('connErr').hidden=true; $('conn').showModal(); };
$('bConnClose').onclick = () => $('conn').close();
$('bConnGo').onclick = async () => {
  const tok = $('cTok').value.replace(/\s+/g,''), repo = $('cRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,'');
  $('connErr').hidden = true;
  if(!tok){ $('connErr').textContent='請貼上權杖'; $('connErr').hidden=false; return; }
  try{ await connect(tok, repo, $('cRemember').checked); $('conn').close(); toast('已連線'); }
  catch(e){ G.ready=false; setPill('bad','連線失敗'); $('connErr').textContent = e.status===401?'權杖不正確或已過期':e.status===404?'找不到存放庫，或權杖沒有開放這個存放庫':e.message; $('connErr').hidden=false; }
};
$('bLogout').onclick = () => { ls.del('erh_t_token'); G.ready=false; G.token=''; $('cTok').value=''; setPill('bad','已登出'); $('conn').close(); };

async function readRemote(){
  const j = await gh('/repos/'+G.owner+'/'+G.repo+'/contents/exams/sites.json?ref='+G.branch+'&t='+Date.now());
  SHA = j.sha;
  const t = atob(j.content.replace(/\s/g,'')); const u=new Uint8Array(t.length); for(let i=0;i<t.length;i++) u[i]=t.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(u));
}
function toB64(s){ const u=new TextEncoder().encode(s); let b=''; for(let i=0;i<u.length;i+=0x8000) b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(b); }
// mutate：拿到最新清單後修改它，再寫回 GitHub（避免蓋掉別台裝置剛存的）
async function save(mutate, msg){
  if(!G.ready){ toast('請先連線 GitHub 才能儲存'); $('conn').showModal(); throw new Error('not connected'); }
  $('saveHint').textContent = '儲存中…';
  let fresh; try{ fresh = await readRemote(); }catch(e){ if(e.status===404){ fresh={sites:[]}; SHA=null; } else throw e; }
  if(!Array.isArray(fresh.sites)) fresh.sites = [];
  mutate(fresh);
  fresh.updated = new Date().toISOString();
  const body = { message: msg, content: toB64(JSON.stringify(fresh, null, 1)+'\n'), branch: G.branch };
  if(SHA) body.sha = SHA;
  const r = await gh('/repos/'+G.owner+'/'+G.repo+'/contents/exams/sites.json', {method:'PUT', body: JSON.stringify(body)});
  SHA = r.content.sha;
  DATA = fresh; ls.set(CACHE_KEY, DATA);
  $('saveHint').textContent = '✓ 已儲存。學生的平板大約 1–3 分鐘後會看到更新。';
  render();
}

/* 新增／編輯 */
let editing = null;
function fillSelect(el, arr, lab){ el.innerHTML=''; arr.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=lab?lab(v):v; el.appendChild(o); }); }
fillSelect($('fGradeSel'), GRADES, GNAME); fillSelect($('fSubjSel'), SUBJECTS); fillSelect($('fTypeSel'), TYPES);
function parseTitle(t){
  const o = {};
  const m = t.match(/([一二三四五六])\s*([上下])/); if(m){ o.grade='一二三四五六'.indexOf(m[1])+1; o.term=m[2]; }
  else { const g=t.match(/([一二三四五六])年級/); if(g) o.grade='一二三四五六'.indexOf(g[1])+1; }
  const s = SUBJECTS.find(x => t.includes(x) || (x==='英語'&&/英文|English/i.test(t))); if(s) o.subject=s;
  o.type = /期末/.test(t) ? '期末考' : /期中/.test(t) ? '期中考' : '其他評量';
  return o;
}
function setForm(x){
  $('fUrl').value=x.url||''; $('fTitle').value=x.title||''; $('fYear').value=x.year||nowYear();
  $('fGradeSel').value=String(x.grade??6); $('fTerm').value=x.term||(new Date().getMonth()>=1&&new Date().getMonth()<7?'下':'上');
  $('fSubjSel').value=x.subject||'國語'; $('fTypeSel').value=x.type||'期中考'; $('fTest').value=x.test||''; $('fNote').value=x.note||'';
}
function applyParsed(p){ if(p.grade!=null) $('fGradeSel').value=String(p.grade); if(p.term) $('fTerm').value=p.term; if(p.subject) $('fSubjSel').value=p.subject; if(p.type) $('fTypeSel').value=p.type; }
function openEdit(x){
  editing = x || null; $('editErr').hidden = true;
  $('editTitle').textContent = x ? '編輯報讀網站' : '新增報讀網站';
  setForm(x || {}); $('edit').showModal();
}
$('bAdd').onclick = () => openEdit(null);
$('bEditCancel').onclick = () => $('edit').close();
async function fetchTitle(u){
  try{ const r = await fetch(fullUrl(u)+(/\?/.test(u)?'&':'?')+'t='+Date.now(), {cache:'no-store'}); if(!r.ok) return '';
    const h = await r.text(); const m = h.match(/<title>([^<]*)<\/title>/i); return m ? m[1].trim() : ''; }catch(e){ return ''; }
}
$('bAuto').onclick = async () => {
  const u = $('fUrl').value.trim(); if(!u){ toast('請先填網址'); return; }
  const t = await fetchTitle(u);
  if(!t){ toast('讀不到這個網址的標題，請自己填名稱'); return; }
  $('fTitle').value = t; applyParsed(parseTitle(t));
  if(!$('fTest').value && !/^https?:/i.test(u)){ const tu = u.replace(/\/?$/,'').replace(/(\.html)?$/,'')+'-test/'; if(await fetchTitle(tu)) $('fTest').value = tu; }
};
$('fTitle').addEventListener('change', () => { if(!editing) applyParsed(parseTitle($('fTitle').value)); });
function normUrl(u){ u=u.trim(); if(!u) return ''; if(/^https?:\/\//i.test(u)){ if(u.startsWith(ROOT.href)) u = u.slice(ROOT.href.length); else return u; } u=u.replace(/^\.?\//,''); if(u && !/\.[a-z0-9]+$/i.test(u.split('?')[0]) && !u.endsWith('/')) u+='/'; return u; }
$('bEditSave').onclick = async () => {
  const rec = {
    url: normUrl($('fUrl').value), title: $('fTitle').value.trim(), year: +$('fYear').value || nowYear(),
    grade: +$('fGradeSel').value, term: $('fTerm').value, subject: $('fSubjSel').value, type: $('fTypeSel').value,
    test: normUrl($('fTest').value), note: $('fNote').value.trim()
  };
  if(!rec.url || !rec.title){ $('editErr').textContent='網址和名稱都要填'; $('editErr').hidden=false; return; }
  const id = editing ? editing.id : (rec.url.replace(/^https?:\/\//,'').replace(/[^\w-]+/g,'-').replace(/^-|-$/g,'') || 'site')+'-'+Date.now().toString(36);
  try{
    await save(d => {
      const i = d.sites.findIndex(s=>s.id===id);
      if(i>=0) d.sites[i] = {...d.sites[i], ...rec};
      else d.sites.push({id, ...rec, added: Date.now()});
    }, (editing?'更新':'新增')+'報讀網站：'+rec.title);
    $('edit').close(); toast(editing?'已更新':'已新增');
    if(!editing){ F.type=rec.type; F.grade=rec.grade; F.subj='全部'; F.year=rec.year; render(); }
  }catch(e){ if(e.message!=='not connected'){ $('editErr').textContent='儲存失敗：'+e.message; $('editErr').hidden=false; $('saveHint').textContent=''; } }
};
async function removeSite(x){
  if(!confirm('要從總覽移除「'+x.title+'」嗎？\n（只是從清單拿掉，報讀網站本身不會被刪除）')) return;
  try{ await save(d => { d.sites = d.sites.filter(s=>s.id!==x.id); }, '移除報讀網站：'+x.title); toast('已移除'); }
  catch(e){ if(e.message!=='not connected') toast('移除失敗：'+e.message); }
}

/* 找存放庫裡還沒加入的網站 */
$('bScanClose').onclick = () => $('scan').close();
$('bScan').onclick = async () => {
  $('scanList').innerHTML=''; $('scanHint').textContent='搜尋中…'; $('scan').showModal();
  const repo = G.ready ? G.owner+'/'+G.repo : ($('cRepo').value || guessRepo());
  let dirs = [];
  try{
    const r = await fetch('https://api.github.com/repos/'+repo+'/contents/', {headers: G.token?{'Authorization':'Bearer '+G.token}:{}});
    const j = await r.json(); if(!r.ok) throw new Error(j.message||r.status);
    dirs = j.filter(n => n.type==='dir' && !/^[_.]/.test(n.name) && !/-test$/.test(n.name) && !['tests','exams','lib','a','img'].includes(n.name)).map(n=>n.name);
  }catch(e){ $('scanHint').textContent='讀不到存放庫：'+e.message; return; }
  const have = new Set(DATA.sites.map(s=>normUrl(s.url).replace(/\/$/,'')));
  (DATA.ignore||[]).forEach(x=>have.add(x));
  const todo = dirs.filter(d => !have.has(d));
  if(!todo.length){ $('scanHint').textContent='全部的報讀網站都已經在總覽裡了 👍'; return; }
  $('scanHint').textContent='找到 '+todo.length+' 個還沒加入的資料夾，按「加入」會先帶入資料讓你確認：';
  const testSet = new Set();
  for(const d of todo){
    const t = await fetchTitle(d+'/');
    const tt = await fetchTitle(d+'-test/'); if(tt) testSet.add(d);
    const it = document.createElement('div'); it.className='scanitem';
    it.innerHTML = '<div><b>'+esc(t||d)+'</b><small>'+esc(d)+'/'+(tt?'（有測試版）':'')+'</small></div>';
    const b = document.createElement('button'); b.className='btn primary sm'; b.textContent='加入';
    b.onclick = () => { $('scan').close(); const p = parseTitle(t||''); openEdit(null); setForm({url:d+'/', title:t||d, test: testSet.has(d)?d+'-test/':'', ...p}); };
    it.appendChild(b); $('scanList').appendChild(it);
  }
};

load();
</script>
