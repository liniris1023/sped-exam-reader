<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>國語複習卷 L1–L3 報讀版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one 大題 per view, one item at a time; sticky tab bar of 五大題; tested characters lifted out as big cards */
:root{
  --bg:#F2F6FA; --paper:#FFFFFF; --ink:#0F2236; --muted:#4A5D72; --line:#C9D5E2;
  --accent:#1F5FA8; --accent-ink:#FFFFFF; --hi:#FFE14D; --hi-ink:#0F2236;
  --wrong:#C3261F; --ok:#1E7A46; --rec:#D9342B;
  --f-kai:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1520; --paper:#16212F; --ink:#F3F6FA; --muted:#AFC0D2; --line:#33465C;
  --accent:#6FA8EC; --accent-ink:#0D1520; --hi:#FFE14D; --hi-ink:#0D1520;
  --wrong:#FF6B5E; --ok:#5CD38E; --rec:#FF5A4F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1520; --paper:#16212F; --ink:#F3F6FA; --muted:#AFC0D2; --line:#33465C;
  --accent:#6FA8EC; --accent-ink:#0D1520; --hi:#FFE14D; --hi-ink:#0D1520;
  --wrong:#FF6B5E; --ok:#5CD38E; --rec:#FF5A4F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:22px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:4px solid var(--hi);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:3px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.bar h1{margin:0;font-size:24px;font-weight:900;letter-spacing:.04em;flex:1 1 auto;min-width:0}
.sets{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:0 10px}
.set{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:20px;font-weight:700;color:var(--muted)}
.seg{display:flex;gap:6px}
.seg button{border:3px solid var(--line);background:var(--bg);border-radius:10px;min-width:56px;min-height:48px;padding:0 12px;font-size:20px;font-weight:900;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
#voiceSel{font-family:var(--f-ui);font-size:18px;min-height:48px;max-width:260px;border:3px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:0 8px}
.tbtn{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 14px;font-size:18px;font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:0 10px}
.tab{flex:0 0 auto;border:3px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 16px;font-size:22px;font-weight:700;min-height:52px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

main{padding-block:20px 150px}
.player{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:8px;box-shadow:0 6px 18px color-mix(in srgb,var(--ink) 25%,transparent)}
.pbtn{border:3px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;min-height:70px;min-width:120px;padding:0 16px;font-size:26px;font-weight:900}
.pbtn.act{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pbtn:disabled{opacity:.4;cursor:default}
.pbtn.pulse{animation:pulse 1.2s infinite;background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.pbtn.pulse{animation:none}}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.sec-head h2{margin:0;font-size:32px;font-weight:900;flex:0 1 auto;min-width:0}
.spk{flex:0 0 auto;display:inline-grid;place-items:center;width:76px;height:76px;border:none;border-radius:999px;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 35%,transparent)}
.spk svg{width:44px;height:44px;fill:currentColor}
.spk.sm{width:62px;height:62px}
.spk.sm svg{width:36px;height:36px}
.spk.playing{outline:5px solid var(--hi);outline-offset:2px}
.spk:active{transform:translateY(2px);box-shadow:none}
.task{background:var(--hi);color:var(--hi-ink);border-radius:12px;padding:10px 16px;font-weight:700;font-size:22px;margin:0 0 18px}
.say{display:inline-flex;align-items:center;gap:8px;border:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 22px;font-weight:700;font-size:22px;min-height:56px}
.say.playing{outline:4px solid var(--hi)}
.say svg{width:26px;height:26px;fill:currentColor}

.card{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:20px}
.passage{font-family:var(--f-kai);font-size:36px;line-height:2.4;letter-spacing:.06em}
.nm{text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:2px}
.bk{text-decoration:underline wavy;text-underline-offset:8px;text-decoration-thickness:2px}

/* blanks inside the passage */
.bl{display:inline-flex;align-items:center;gap:2px;vertical-align:middle;background:var(--hi);color:var(--hi-ink);border-radius:10px;padding:2px 8px 2px 6px;margin:0 3px;line-height:1.1;position:relative}
.bl .no{font-family:var(--f-ui);font-size:16px;font-weight:900;background:var(--ink);color:var(--paper);border-radius:999px;min-width:26px;height:26px;display:inline-grid;place-items:center;margin-right:4px}
.bl .ch{font-size:44px;font-weight:700}
.zy{display:inline-flex;align-items:center;gap:1px;font-family:var(--f-kai)}
.zs{display:flex;flex-direction:column;align-items:center;font-size:24px;line-height:1.05}
.zt{font-size:22px;align-self:center}
.bl .zs{font-size:22px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:20px}
.big{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:220px}
.big .lab{font-weight:900;font-size:20px;color:var(--muted)}
.big .show{flex:1;display:grid;place-items:center;font-family:var(--f-kai)}
.big .show .ch{font-size:96px;line-height:1}
.big .show .zs{font-size:46px;line-height:1.05}
.big .show .zt{font-size:42px}
.big .kind{font-size:18px;font-weight:700;border-radius:8px;padding:2px 10px;background:var(--bg)}
.big button{border:none;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;padding:6px 14px;min-height:44px}
.big .nosay{font-size:16px;color:var(--muted)}
.paperhint{margin-top:16px;color:var(--muted);font-size:20px}

/* one-at-a-time items */
.stepper{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.dot{border:3px solid var(--line);background:var(--paper);border-radius:12px;min-width:56px;min-height:56px;font-size:22px;font-weight:900}
.dot[aria-current="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.dot.done{border-color:var(--ok)}
.dot.done::after{content:" ✓";color:var(--ok)}
.dot[aria-current="true"].done::after{color:var(--accent-ink)}
.qtext{font-family:var(--f-kai);font-size:34px;line-height:1.9;margin:0 0 18px}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:center;border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 16px;cursor:pointer}
.opt .on{flex:0 0 auto;font-family:var(--f-ui);font-weight:900;width:84px;height:84px;border-radius:999px;border:4px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-size:52px;line-height:1}
.opt .ot{flex:1 1 auto;min-width:0;font-family:var(--f-kai);font-size:30px;line-height:1.6}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent) inset}
.opt.sel .on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* 第一大題：一次一個字 */
.bl.cur{outline:5px solid var(--accent);outline-offset:3px}
.bl.did{opacity:.55}
.one{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:20px 28px;margin-top:22px;background:var(--paper);border:4px solid var(--accent);border-radius:18px;padding:20px}
.one .lab{font-size:28px;font-weight:900;color:var(--muted);width:100%;text-align:center}
.one .show{font-family:var(--f-kai);display:grid;place-items:center;min-width:180px;min-height:220px;background:var(--hi);color:var(--hi-ink);border-radius:16px;padding:12px 24px}
.one .show .zs{font-size:72px;line-height:1.05}
.one .show .zt{font-size:64px}
.one .ctl{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.donebtn{border:none;border-radius:16px;background:var(--ok);color:#fff;font-weight:900;font-size:28px;padding:14px 26px;min-height:80px}
.prevch{border:3px solid var(--line);background:var(--paper);border-radius:14px;font-weight:700;font-size:22px;padding:8px 18px;min-height:56px}
.donebar{font-size:22px;font-weight:700;color:var(--muted);text-align:center;width:100%}
.nav{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:28px}
.nav button{border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 22px;font-weight:900;font-size:24px;min-height:60px}
.nav button.next{order:-1;width:min(100%,480px);min-height:100px;font-size:40px;border-radius:20px;background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 40%,transparent)}
.nav button.next:active{transform:translateY(3px);box-shadow:none}
.nav button:disabled{opacity:.35;cursor:default}

/* 改錯字 */
.fixline{font-family:var(--f-kai);font-size:40px;line-height:2.3;letter-spacing:.06em}
.wr{display:inline-block;font-size:76px;line-height:1;color:var(--wrong);font-weight:700;border:4px dashed var(--wrong);border-radius:14px;padding:2px 6px;margin:0 4px;vertical-align:middle;position:relative;background:color-mix(in srgb,var(--hi) 35%,transparent)}
.wr sup{position:absolute;top:-16px;right:-14px;font-family:var(--f-ui);font-size:18px;font-weight:900;background:var(--wrong);color:var(--paper);border-radius:999px;width:30px;height:30px;display:grid;place-items:center}
.boxes{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;align-items:center}
.wbox{display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--line);border-radius:14px;padding:10px 16px;background:var(--bg)}
.wbox .w{font-family:var(--f-kai);font-size:64px;color:var(--wrong);line-height:1}
.wbox small{font-size:18px;color:var(--muted);font-weight:700}

/* 跟著念變色 */
.rs{border-radius:8px;transition:background-color .15s,color .15s}
.rs.reading,.reading{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--accent)}
.rs.reading .kw{background:var(--hi);color:var(--hi-ink)}
.one .show.reading{box-shadow:0 0 0 6px var(--accent)}
main h2,.task,.qtext,.passage,.fixline,.pattern,.heard,.lab,.paperhint,.titem .a,.one .show{cursor:pointer}
@media (prefers-reduced-motion:reduce){.rs{transition:none}}
.wbox{font-family:inherit;color:inherit;cursor:zoom-in}
.wr{cursor:zoom-in}
.wrongarea{margin-top:18px;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.wrongarea.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 6px var(--hi);background:color-mix(in srgb,var(--hi) 30%,transparent)}100%{box-shadow:none;background:transparent}}
@media (prefers-reduced-motion:reduce){.wrongarea.flash{animation:none;box-shadow:0 0 0 6px var(--hi)}}
.wrongarea .boxes{margin-top:0}
.wrongarea .wbox .w{font-size:96px}
.zoomov{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 70%,transparent);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.zbox{background:var(--paper);border:6px solid var(--wrong);border-radius:24px;padding:20px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.zl{font-size:26px;font-weight:900;color:var(--muted)}
.zc{font-family:var(--f-kai);color:var(--wrong);font-size:min(42vw,42vh);line-height:1.05}

/* QR / PDF */
.qrimg{background:#fff;padding:14px;border-radius:12px;display:inline-block;line-height:0;max-width:100%}
.qrimg img,.qrimg canvas{display:block;max-width:100%;height:auto}
.donecard{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.qrz .url{font-size:16px;color:var(--muted);overflow-wrap:anywhere;max-width:340px}
.pdfbox{display:flex;flex-direction:column;align-items:center;gap:10px;margin:10px 0 18px}
.lnk{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
a.tact{color:var(--ink);text-decoration:none}
#report{position:fixed;left:-12000px;top:0;pointer-events:none}
.pg{width:794px;height:1123px;padding:44px 50px 60px;background:#fff;color:#111;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5;position:relative;overflow:hidden}
.pg h2{font-size:22px;margin:0 0 4px;font-weight:900}
.pg h3{font-size:16px;margin:16px 0 6px;font-weight:900}
.pg .sub{margin:2px 0;color:#444;font-size:13px}
.pg .who{margin:8px 0 0;font-size:16px;font-weight:700}
.pg table{width:100%;border-collapse:collapse}
.pg th,.pg td{border:1px solid #777;padding:4px 8px;text-align:left;vertical-align:middle}
.pg th{background:#EEF2F6;font-size:13px}
.pg .c{text-align:center}
.pg .k{font-family:var(--f-kai);font-size:19px}
.pg .wrong{color:#C3261F}
.pg .big{font-size:20px;font-weight:900}
.pg .no{color:#999;font-size:13px}
.pg u{text-decoration:underline;text-underline-offset:4px}
.pg .foot{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:12px;color:#666}

/* 錄音 */
.pattern{font-family:var(--f-kai);font-size:54px;font-weight:700;margin:6px 0 12px;letter-spacing:.06em}
.pattern .kw{background:var(--hi);color:var(--hi-ink);border-radius:10px;padding:0 10px}
.recrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:16px 0}
.recbtn{display:inline-flex;align-items:center;gap:12px;border:none;border-radius:999px;background:var(--rec);color:#fff;font-weight:900;font-size:26px;padding:14px 30px;min-height:76px}
.recbtn .led{width:22px;height:22px;border-radius:999px;background:#fff}
.recbtn.on .led{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.recbtn.on .led{animation:none}}
.recstate{font-size:20px;font-weight:700;color:var(--muted)}
.heard{font-size:18px;font-weight:700;color:var(--muted);margin:10px 0 6px}
textarea{width:100%;min-height:130px;font-family:var(--f-kai);font-size:32px;line-height:1.6;border:3px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper);color:var(--ink);resize:vertical}
.interim{color:var(--muted);font-family:var(--f-kai);font-size:28px;min-height:1.6em}
audio{width:100%;max-width:420px}
.warn{border:3px solid var(--wrong);border-radius:12px;padding:10px 14px;font-size:20px;margin-top:12px}

/* 老師批改 */
.tgroup{margin-top:24px}
.tgroup h3{font-size:26px;margin:0 0 10px}
.titem{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;display:grid;gap:8px}
.titem .q{font-weight:700;color:var(--muted);font-size:20px}
.titem .a{font-family:var(--f-kai);font-size:30px;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.titem .a.empty{color:var(--muted);font-size:22px}
.marks{display:flex;flex-wrap:wrap;gap:8px}
.mark{border:3px solid var(--line);background:var(--bg);border-radius:10px;min-width:64px;min-height:48px;font-size:22px;font-weight:900}
.mark[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.trow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.tact{border:3px solid var(--ink);background:var(--paper);border-radius:12px;padding:8px 18px;font-weight:700;font-size:20px}
.tact.danger{border-color:var(--wrong);color:var(--wrong)}
.confirm{border:3px solid var(--wrong);border-radius:12px;padding:12px;margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sbox{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-variant-numeric:tabular-nums}
.sbox b{display:block;font-size:30px}

@media (max-width:560px){
  body{font-size:20px}
  .passage{font-size:28px}
  .qtext{font-size:28px}
  .opt{font-size:24px}
  .fixline{font-size:30px}
  .wr{font-size:56px}
  .pattern{font-size:40px}
  .bar h1{font-size:20px}
}
</style>

<header>
  <div class="wrap">
    <div class="bar">
      <h1>國語複習卷【第一課到第三課】</h1>
      <button class="tbtn" id="setBtn" type="button" aria-expanded="false" aria-controls="sets">⚙ 字體・語音 ▼</button>
      <button class="tbtn" id="qrBtn" type="button">QR code</button>
      <button class="tbtn" id="teacherBtn" type="button">老師批改</button>

    <div class="sets" id="sets" hidden>
      <div class="set">字體 <div class="seg" id="fontSeg"></div></div>

</header>

</div>

<script>
(function(){
/* ---------- 資料 ---------- */

function pickVoice(){

  const all=synth.getVoices();
  voices=all.filter(v=>/^zh/i.test(v.lang)||/Chinese|中文|國語|普通話|粵語/.test(v.name));
  voices.sort((x,y)=>(/TW/i.test(y.lang)?1:0)-(/TW/i.test(x.lang)?1:0));
  if(!voices.length){vSel.innerHTML='<option>這台裝置沒有中文語音</option>';voice=null;return;}
  voice=voices.find(v=>v.name===savedVoice)||null;
  if(!voice){const tw=voices.filter(v=>/TW/i.test(v.lang));
    const pref=[/HsiaoChen|曉臻/i,/HsiaoYu|曉雨/i,/Mei-?Jia|美佳/i,/Yating|雅婷/i,/Google/i];
    for(const p of pref){const v=tw.find(v=>p.test(v.name)); if(v){voice=v;break;}}
    if(!voice) voice=tw[0]||voices[0];}
  vSel.innerHTML=voices.map((v,i)=>'<option value="'+i+'"'+(v===voice?' selected':'')+'>'+(v.name.replace(/Microsoft |Online \(Natural\) - /g,'').replace(/[<>&]/g,''))+'（'+v.lang+'）</option>').join('');
}

let playingBtn=null, readTok=0, curEl=null, job=null, jobIdx=0, paused=null, autoOn=true;
function clearReading(){ if(curEl){curEl.classList.remove('reading');curEl=null;} if(playingBtn){playingBtn.classList.remove('playing');playingBtn=null;} }
function stopReading(){ readTok++; job=null; if(synth) synth.cancel(); clearReading(); updPlayer(); }
/* parts: [{el, text}] 依序念，念到哪裡就把那一段變色 */
function readParts(parts,btn,onDone){
  if(!synth) return;
  const again=btn&&playingBtn===btn;
  stopReading(); if(again) return;
  const my=readTok; let i=0; job={parts,btn,onDone,my}; jobIdx=0; paused=null;
  if(btn){btn.classList.add('playing');playingBtn=btn;}
  updPlayer();
  const next=()=>{
    if(my!==readTok) return;
    if(curEl){curEl.classList.remove('reading');curEl=null;}
    if(i>=parts.length){ if(playingBtn===btn&&btn){btn.classList.remove('playing');playingBtn=null;} job=null; updPlayer(); if(onDone) onDone(); return; }
    jobIdx=i; const pt=parts[i++]; const t=String(pt.text||'').replace(/……/g,'，').replace(/[《》]/g,'').trim();
    if(!t){next();return;}
    const u=new SpeechSynthesisUtterance(t); u.lang="zh-TW"; if(voice) u.voice=voice; u.rate=rate;
    u.onstart=()=>{ if(my!==readTok) return; if(pt.el){pt.el.classList.add('reading');curEl=pt.el;
      const r=pt.el.getBoundingClientRect(); if(r.top<140||r.bottom>innerHeight) pt.el.scrollIntoView({block:'center',behavior:'smooth'});} };
    let fired=false; const go=()=>{ if(fired) return; fired=true; next(); };
    u.onend=go;
    u.onerror=e=>{ if(my!==readTok) return; if(e&&e.error==='not-allowed'){ const rest={parts:parts.slice(i-1),btn,onDone}; stopReading(); paused=rest; autoOn=false; updPlayer(true); return; } go(); };
    synth.speak(u);
  };
  next();
}
function updPlayer(needTap){
  const a=document.getElementById('pPause'), b=document.getElementById('pStart'); if(!a||!b) return;
  const on=!!job; a.disabled=!on; a.classList.toggle('act',on); b.classList.toggle('act',!on);
  b.classList.toggle('pulse',!!needTap);
  b.innerHTML=paused?'▶ 繼續':'▶ 開始';
}
function pauseRead(){ if(job) paused={parts:job.parts.slice(jobIdx),btn:job.btn,onDone:job.onDone}; const keep=paused; stopReading(); paused=keep; autoOn=false; updPlayer(); }
function startRead(){ autoOn=true; if(paused){const p=paused; paused=null; readParts(p.parts,p.btn,p.onDone);} else autoRead(true); }
let pageAuto=null, pageHead=null, lastSec=null;
function autoRead(force){
  if(!pageAuto) return;
  const parts=[];
  if(view.prefix){parts.push({text:view.prefix}); view.prefix=null;}
  if((view.sec!==lastSec||force)&&pageHead){ parts.push(...pageHead().flatMap(partsOf)); lastSec=view.sec; }
  parts.push(...pageAuto.parts());
  readParts(parts,pageAuto.btn,pageAuto.onDone);
}
function partsOf(root){
  if(!root) return [];
  const rs=[...root.querySelectorAll('.rs')];
  if(rs.length) return rs.map(e=>({el:e,text:e.dataset.say!=null?e.dataset.say:e.textContent}));
  return [{el:root,text:root.dataset.say!=null?root.dataset.say:root.textContent}];
}
function readEls(els,btn,prefix,onDone){
  const parts=prefix?[{text:prefix}]:[];
  (Array.isArray(els)?els:[els]).forEach(e=>parts.push(...partsOf(e)));
  readParts(parts,btn,onDone);
}
function speak(text,btn,onDone){ readParts([{text}],btn,onDone); }

const el=(t,c,h)=>{const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e;};
const esc=s=>s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function deco(s){ // 專名號、書名號
  let h=esc(s);
  h=h.replace(/《([^》]+)》/g,'<span class="bk">$1</span>');
  NAMES.forEach(n=>{h=h.split(n).join('<span class="nm">'+n+'</span>');});
  return h;
}
const escA=s=>esc(String(s)).replace(/"/g,'&quot;');
const END=/[，。？！；：、」』]$/;
function pieces(str){ return (str.match(/[^，。？！；：、]+[，。？！；：、」』]*|[，。？！；：、」』]+/g)||[]); }
/* tokens: [{h,s,end}] → 依標點切成一段一段 <span class="rs"> */
function tok(str){ return pieces(str).map(p=>({h:deco(p),s:p,end:END.test(p)})); }
function chunkHTML(tokens){
  let out="",h="",sy="";
  const flush=()=>{ if(h){ out+='<span class="rs" data-say="'+escA(sy)+'">'+h+'</span>'; h="";sy=""; } };
  tokens.forEach(t=>{ h+=t.h; sy+=t.s; if(t.end) flush(); }); flush(); return out;
}
const rsText=str=>chunkHTML(tok(str));
function zyHTML(z){const m=z.match(/[ˊˇˋ˙]$/); const t=m?m[0]:""; const s=t?z.slice(0,-1):z;
  return '<span class="zy"><span class="zs">'+[...s].map(x=>'<span>'+x+'</span>').join('')+'</span>'+(t?'<span class="zt">'+t+'</span>':'')+'</span>';}
const zyRead=z=>[...z].join(' ');

const SITE_URL=/github\.io$/.test(location.hostname)?location.origin+location.pathname:'https://liniris1023.github.io/sped-exam-reader/guoyu-l1l3/';
function b64u(str){const b=new TextEncoder().encode(str);let x='';b.forEach(c=>x+=String.fromCharCode(c));return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function ub64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const x=atob(t);const b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return new TextDecoder().decode(b);}
function encodeRes(){
  return 'r='+b64u(JSON.stringify({v:1,a:Q2.map((_,k)=>S.q2[k]!=null?S.q2[k]+1:0).join(''),
    s4:Q4.map((_,k)=>(S.q4[k]||'').trim()),s5:Q5.map((_,k)=>(S.q5[k]||'').trim()),
    d:Q3.map((_,k)=>S.q3done&&S.q3done[k]?1:0).join(''),t:S.t1||Date.now()}));
}
function decodeRes(h){
  try{ if(!/^r=/.test(h)) return null; const o=JSON.parse(ub64u(h.slice(2))); if(!o||o.v!==1) return null;
    const A={q2:{},q4:{},q5:{},marks:{},note:'',t1:o.t,q3done:{}};
    [...String(o.a||'')].forEach((c,k)=>{ if(+c>0) A.q2[k]=+c-1; });

      if(i) doc.addPage(); doc.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',0,0,595.28,841.89); }
    return doc.output('blob');
  } finally { document.body.style.zoom=z; document.getElementById('report').innerHTML=""; }
}
const PDF_NAME='國語複習卷L1-L3_作答紀錄.pdf';
function pdfBlock(A){
  const wrap=el('div','pdfbox');
  const b=el('button','donebtn','製作作答 PDF'); b.type='button';
  const st=el('div','recstate',''); const links=el('div','trow'); links.hidden=true;
  b.onclick=async()=>{ b.disabled=true; b.textContent='正在製作 PDF…'; st.textContent='';
    try{ const blob=await buildPDF(A); const url=URL.createObjectURL(blob);
      links.innerHTML=''; const a1=el('a','donebtn lnk','下載 PDF'); a1.href=url; a1.download=PDF_NAME;
      const a2=el('a','tact lnk','打開 PDF 看看'); a2.href=url; a2.target='_blank'; a2.rel='noopener';
      links.append(a1,a2);
      try{ const f=new File([blob],PDF_NAME,{type:'application/pdf'});
        if(navigator.canShare&&navigator.canShare({files:[f]})&&('ontouchend' in document)){ const a3=el('button','tact','分享／存到檔案'); a3.type='button'; a3.onclick=()=>navigator.share({files:[f],title:PDF_NAME}).catch(()=>{}); links.appendChild(a3); } }catch(e){}
      links.hidden=false; b.textContent='重新製作 PDF'; b.disabled=false; st.textContent='PDF 做好了，可以下載或打開。';
    }catch(e){ b.disabled=false; b.textContent='製作作答 PDF'; st.textContent='PDF 沒有做出來，請重新整理後再試一次。'; }
  };
  wrap.append(b,st,links); return wrap;
}

/* ---------- 老師批改 ---------- */
function markRow(A,id){
  const m=el('div','marks');
  [['○','對'],['△','部分'],['✗','錯']].forEach(([s,t])=>{const b=el('button','mark',s);b.type='button';b.title=t;b.setAttribute('aria-label',t);
    b.setAttribute('aria-pressed',A.marks[id]===s); b.onclick=()=>{A.marks[id]=A.marks[id]===s?undefined:s; if(A===S) save(); render();}; m.appendChild(b);});
  return m;
}
function renderTeacher(){
  const A=view.remote||S;
  head(view.remote?'老師批改（掃描 QR code 的作答）':'老師批改');
  if(view.remote) main.appendChild(el('p','task','這是學生繳交時的作答紀錄（繳交時間：'+fmtT(A.t1)+'）。錄音留在學生的平板上。'));
  main.appendChild(pdfBlock(A));
  const answered=Object.keys(A.q2).length, spk=[...Object.values(A.q4),...Object.values(A.q5)].filter(x=>x&&x.trim()).length;
  const sm=el('div','summary');
  sm.append(el('div','sbox','選擇題已作答<b>'+answered+' / 8</b>'), el('div','sbox','口說題有文字<b>'+spk+' / 6</b>'));
  main.appendChild(sm);
  main.appendChild(el('p','paperhint','第一、三大題請看學生寫在紙上的答案（紙上編號 1-①、三-1-① 對應畫面上的編號；PDF 內附正確答案）。'));
  const g2=el('div','tgroup'); g2.appendChild(el('h3',null,'二、選擇題（學生選的答案）'));
  const l2=el('div','summary');
  Q2.forEach((q,k)=>{l2.appendChild(el('div','sbox','第 '+(k+1)+' 題<b>'+(A.q2[k]!=null?CIR[A.q2[k]]:'—')+'</b>'));});
  g2.appendChild(l2); main.appendChild(g2);
  [['四、造句',Q4,A.q4,'s4',q=>q.p.map(x=>x[0]).join('')],['五、接寫句子',Q5,A.q5,'s5',q=>q.pre+'＿＿'+q.post]].forEach(([t,list,store,sec,lab])=>{
    const g=el('div','tgroup'); g.appendChild(el('h3',null,t));
    list.forEach((q,k)=>{const id=sec+'-'+k; const it=el('div','titem');
      it.appendChild(el('div','q',(k+1)+'. '+esc(lab(q))));
      const v=(store[k]||"").trim();
      it.appendChild(el('div','a'+(v?'':' empty'),v?esc(v):'（沒有文字）'));
      if(!view.remote&&audioURL[id]){const a=el('audio');a.controls=true;a.src=audioURL[id];it.appendChild(a);}
      it.appendChild(markRow(A,id)); g.appendChild(it);});
    main.appendChild(g);
  });
  const n=el('div','tgroup'); n.appendChild(el('h3',null,'老師備註（會放進 PDF）'));
  const ta=el('textarea'); ta.id='teacher-note'; ta.style.minHeight='100px'; ta.style.fontSize='24px'; ta.value=A.note||""; ta.oninput=()=>{A.note=ta.value; if(A===S) save();};
  n.appendChild(ta); main.appendChild(n);
  const row=el('div','trow');
  const cp=el('button','tact','複製全部作答文字'); cp.type='button';
  cp.onclick=async()=>{const txt=buildText(A); try{await navigator.clipboard.writeText(txt);cp.textContent='已複製';}catch(e){ta.value=(A.note?A.note+"\n\n":"")+txt;ta.select();cp.textContent='已放進備註框，請自行複製';}};
  row.append(cp);
  if(!view.remote){
    const rs=el('button','tact danger','清除作答（換下一位學生）'); rs.type='button';
    const cf=el('div','confirm','<span>確定要清除這台平板上的作答和錄音嗎？</span>'); cf.hidden=true;
    const yes=el('button','tact danger','確定清除'); yes.type='button'; const no=el('button','tact','取消'); no.type='button';
    yes.onclick=()=>{S={q2:{},q4:{},q5:{},marks:{},note:""};save();Object.keys(audioURL).forEach(k=>{URL.revokeObjectURL(audioURL[k]);delete audioURL[k];});view={sec:'s1',idx:{s1:0,s2:0,s3:0,s4:0,s5:0},ch:0,teacher:false};render();};
    no.onclick=()=>{cf.hidden=true;}; rs.onclick=()=>{cf.hidden=false;};
    cf.append(yes,no); row.append(rs); main.append(row,cf);
    main.appendChild(el('p','paperhint','錄音只保留在這次開啟的頁面；重新整理後文字還在，錄音會不見。'));
  } else main.append(row);
}
function buildText(A){
  let t="國語複習卷【第一課到第三課】作答紀錄\n\n二、選擇題\n"+Q2.map((q,k)=>(k+1)+". "+(A.q2[k]!=null?(A.q2[k]+1):"—")).join("　")+"\n\n四、造句\n";
  Q4.forEach((q,k)=>{t+=(k+1)+". "+q.p.map(x=>x[0]).join('')+"："+(A.q4[k]||"（無）")+(A.marks['s4-'+k]?"　"+A.marks['s4-'+k]:"")+"\n";});
  t+="\n五、接寫句子\n"; Q5.forEach((q,k)=>{t+=(k+1)+". "+q.pre+"【"+(A.q5[k]||"（無）")+"】"+q.post+(A.marks['s5-'+k]?"　"+A.marks['s5-'+k]:"")+"\n";});
  if(A.note) t+="\n備註："+A.note+"\n"; return t;
}

main.addEventListener('click',e=>{
  if(e.target.closest('button,textarea,select,audio,input,.opt,.wr,a,.qrimg')) return;

  if(c&&r.contains(c)){ const all=partsOf(r); const idx=all.findIndex(p=>p.el===c); readParts(idx>=0?all.slice(idx):all,null); }
  else readEls([r],null);
});
