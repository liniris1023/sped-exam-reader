<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弱視生上課網站｜造句・相似字</title>
<style>
:root{--fs:32px;--bg:#fffaf0;--card:#ffffff;--ink:#111;--sub:#333;--line:#222;--acc:#0a4fb4;--accSoft:#e3edff;--ok:#0b7a2c;--okSoft:#d9f5df;--bad:#c0201b;--badSoft:#ffe1df;--red:#c62a1e;--hl:#ffe45c;--blank:#fff4c2}
body.hc{--bg:#000;--card:#111;--ink:#fff35c;--sub:#fff;--line:#fff35c;--acc:#7fd0ff;--accSoft:#002a40;--ok:#6dff8a;--okSoft:#003b10;--bad:#ff7a70;--badSoft:#420000;--red:#ff8a80;--hl:#7a5c00;--blank:#2a2a00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;font-size:var(--fs);line-height:1.6;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer}
.bar{position:sticky;top:0;z-index:10;display:flex;gap:.3em;align-items:center;flex-wrap:wrap;padding:.3em .5em;background:var(--card);border-bottom:4px solid var(--line)}
.bar .ttl{flex:1;font-weight:900;font-size:.8em;min-width:6em}
.tb{border:3px solid var(--line);background:var(--card);border-radius:.4em;padding:.1em .45em;font-size:.75em;font-weight:800;min-height:2.2em}
.tb.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:.6em .7em 7em}
h1{font-size:1.35em;margin:.3em 0;line-height:1.35;display:flex;align-items:center;gap:.3em;flex-wrap:wrap}
h2{font-size:1.1em;margin:.4em 0}
.card{background:var(--card);border:4px solid var(--line);border-radius:.5em;padding:.5em .7em;margin:.5em 0}
.row{display:flex;align-items:flex-start;gap:.4em}
.row>.grow{flex:1}
.spk{flex:none;border:3px solid var(--acc);background:var(--accSoft);color:var(--acc);border-radius:50%;width:2.1em;height:2.1em;font-size:.95em;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;padding:0}
.spk.playing{background:var(--acc);color:var(--bg);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.label{display:inline-block;font-weight:900;color:var(--acc);margin-right:.3em}
.big{font-size:1.15em;font-weight:700}
.pic{display:block;max-width:100%;max-height:52vh;margin:.3em auto;border:4px solid var(--line);border-radius:.4em;cursor:zoom-in;background:#fff}
.opts{display:flex;flex-wrap:wrap;gap:.5em;margin:.4em 0}
.opt{border:4px solid var(--line);background:var(--card);border-radius:.5em;padding:.25em .7em;font-weight:800;min-height:2.4em}
.opt.ok{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badSoft);border-color:var(--bad);color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.blank{display:inline-block;min-width:4.5em;min-height:1.6em;border:none;border-bottom:5px solid var(--line);background:var(--blank);border-radius:.2em .2em 0 0;padding:0 .3em;margin:0 .15em;font-weight:900;vertical-align:baseline;text-align:center}
.blank.sel{outline:5px solid var(--acc);outline-offset:2px}
.blank.ok{color:var(--ok);border-bottom-color:var(--ok);background:var(--okSoft)}
.blank.bad{color:var(--bad);border-bottom-color:var(--bad);background:var(--badSoft)}
.chips{display:flex;flex-wrap:wrap;gap:.4em;padding:.4em;border:4px dashed var(--acc);border-radius:.5em;margin:.4em 0}
.chips .cap{width:100%;font-weight:900;color:var(--acc);font-size:.85em}
.chip{border:4px solid var(--acc);background:var(--accSoft);color:var(--ink);border-radius:.4em;padding:.15em .55em;font-weight:800}
.sent{font-size:1.1em;line-height:2.1}
textarea{width:100%;min-height:5.5em;font:inherit;font-size:1.1em;padding:.4em;border:4px solid var(--line);border-radius:.4em;background:var(--card);color:var(--ink);line-height:1.6}
.actions{display:flex;flex-wrap:wrap;gap:.5em;margin:.4em 0}
.btn{border:4px solid var(--line);background:var(--card);border-radius:.5em;padding:.2em .7em;font-weight:900;min-height:2.3em}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.msg{font-weight:900;margin:.3em 0;min-height:1.6em}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.chk{display:flex;align-items:center;gap:.5em;width:100%;text-align:left;border:4px solid var(--line);background:var(--card);border-radius:.5em;padding:.3em .5em;margin:.35em 0;font-weight:700}
.chk .box{flex:none;width:1.5em;height:1.5em;border:4px solid var(--line);border-radius:.2em;display:flex;align-items:center;justify-content:center;font-weight:900}
.chk.on{border-color:var(--ok);background:var(--okSoft)}.chk.on .box{border-color:var(--ok);color:var(--ok)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:.5em;align-items:center;justify-content:space-between;padding:.4em .6em;background:var(--card);border-top:4px solid var(--line);z-index:10}
.nav .btn{min-width:5.5em}
.nav .pg{font-weight:900}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13em),1fr));gap:.6em}
.homeBtn{display:block;width:100%;text-align:left;border:5px solid var(--line);background:var(--card);border-radius:.6em;padding:.5em .7em;font-weight:900;font-size:1.05em}
.homeBtn small{display:block;font-weight:600;font-size:.7em;color:var(--sub)}
.charRow{display:flex;flex-wrap:wrap;gap:.6em;align-items:center;justify-content:center}
.charRow img{width:min(42vw,360px);border:4px solid var(--line);border-radius:.4em;background:#fff;cursor:zoom-in}
.bu{color:var(--red);font-weight:900;font-size:1.2em}
.word{font-weight:900;font-size:1.6em}
.ss{font-size:1.35em;line-height:2;word-break:break-all}
.ss .c{display:inline-block;padding:0 .02em;border-radius:.15em}
.ss .clue{font-weight:900;text-decoration:underline;text-decoration-thickness:.12em;text-underline-offset:.18em}
.ss.self .c{cursor:pointer}
.ss .c.mark{background:var(--hl);text-decoration:underline;text-decoration-thickness:.12em;text-underline-offset:.18em;font-weight:900}
.ss .box{display:inline-block;width:1.4em;height:1.4em;line-height:1.3em;text-align:center;border:5px solid var(--line);border-radius:.15em;vertical-align:middle;background:var(--blank);font-weight:900}
.ss .box.ok{border-color:var(--ok);color:var(--ok);background:var(--okSoft)}
.charOpts{display:flex;gap:.7em;flex-wrap:wrap;justify-content:center;margin:.5em 0}
.charOpt{display:flex;flex-direction:column;align-items:center;gap:.25em}
.charOpt .opt{font-size:2.3em;line-height:1.2;min-width:1.8em;padding:.1em .3em}
.ans{border:4px dashed var(--bad);background:var(--badSoft);border-radius:.5em;padding:.4em .6em;margin:.5em 0;font-size:.85em}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.zoom img{max-width:98vw;max-height:96vh;background:#fff}
.qrbox{background:#fff;border-radius:.5em;padding:.5em;display:inline-block}.qrbox svg{display:block;width:min(70vw,60vh);height:auto}
.qrMini svg{width:min(40vw,260px)}
.qrModal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;color:#fff;text-align:center}
.cheer{font-size:2.5em;text-align:center}
</style>
</head>
<body>
<div class="bar">
  <button class="tb" id="bHome" aria-label="回首頁">🏠 首頁</button>
  <div class="ttl" id="ttl">弱視生上課網站</div>
  <button class="tb" id="bSm" aria-label="字變小">A－</button>
  <button class="tb" id="bLg" aria-label="字變大">A＋</button>
  <button class="tb" id="bHc" aria-label="高對比">🌓 高對比</button>
  <button class="tb" id="bRate" aria-label="報讀速度">🐢 慢</button>
  <button class="tb" id="bAuto" aria-label="自動報讀">🔊 自動</button>
  <button class="tb" id="bQr" aria-label="QR code">📱 QR</button>
  <button class="tb" id="bAns" aria-label="老師答案">👩‍🏫 答案</button>
</div>
<main id="app"></main>

let cur=null,curBtn=null;
function stopSpeak(){if(cur){cur.pause();cur=null}try{speechSynthesis.cancel()}catch(e){}if(curBtn){curBtn.classList.remove('playing');curBtn=null}}
function tts(t,done){try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=RATES[rateIdx].r*.9;const v=speechSynthesis.getVoices().find(v=>/zh[-_]TW/i.test(v.lang));if(v)u.voice=v;u.onend=done;speechSynthesis.speak(u)}catch(e){done&&done()}}
function speak(t,btn,then){stopSpeak();if(!t)return;if(btn){curBtn=btn;btn.classList.add('playing')}
  const fin=()=>{if(btn&&curBtn===btn){btn.classList.remove('playing');curBtn=null}then&&then()};
  const id=D.AUDIO[t];
  if(id){const a=new Audio('audio/'+id+'.mp3');a.playbackRate=RATES[rateIdx].r;cur=a;a.onended=fin;a.onerror=()=>{cur=null;tts(t,fin)};a.play().catch(()=>{cur=null;tts(t,fin)})}
  else tts(t,fin);}
function speakSeq(list){let i=0;const nx=()=>{if(i<list.length)speak(list[i++],null,nx)};nx()}
const spk=t=>`<button class="spk" data-say="${esc(t)}" aria-label="報讀">🔊</button>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();speak(b.dataset.say,b)}
  const im=e.target.closest('img[data-zoom]');if(im){const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${im.src}" alt="">`;z.onclick=()=>z.remove();document.body.appendChild(z)}});

function go(v,p){stopSpeak();view=v;page=p;render();window.scrollTo(0,0);if(auto)setTimeout(autoRead,250)}
$('#prev').onclick=()=>{if(page>0)go(view,page-1)};
$('#next').onclick=()=>{if(page<pages()-1)go(view,page+1);else go('home',0)};
function autoRead(){if(view==='home')return speak(D.UI.home);
  if(view==='s7'){const p=D.S7[page];return speak(p.sayTitle)}
  const g=D.SIM.find(g=>g.key===view);
  if(page<3)speak(g.chars[page].say);else{const q=g.qs[page-3];speak(q.say,null,q.self?()=>speak(D.UI.tapClue):null)}}

function render(){const app=$('#app');const nav=$('#nav');

  <div class="home">${D.SIM.map(g=>`<button class="homeBtn" data-go="${g.key}:0">${esc(g.title.replace('，部首在哪裡？',''))}<small>${g.chars.map(c=>c.char).join('・')}</small></button>`).join('')}</div></div>
 <div class="card row" style="align-items:center"><div class="grow"><h2>📱 掃描 QR code 打開網站</h2><div style="font-size:.75em">老師把 QR code 給學生用平板掃描；點 QR code 可以放大。</div></div><button class="qrbox qrMini" id="qrHome" style="border:0;cursor:zoom-in" aria-label="放大 QR code">${$('#qrSvg').innerHTML}</button></div>
 <p style="font-size:.7em;color:var(--sub)">小提示：按 🔊 聽報讀；點圖片可以放大；上方可以調整字的大小、高對比和報讀速度。</p>`}
function bindHome(){const q=$('#qrHome');if(q)q.onclick=showQR;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const[v,p]=b.dataset.go.split(':');go(v,+p)})}

/* ---------- 造句學習單 ---------- */
function titleH(t,say){return `<h1>${esc(t)} ${spk(say)}</h1>`}
function imgH(src){return src?`<img class="pic" src="img/${src}" data-zoom alt="情境圖">`:''}
function renderS7(app){const p=D.S7[page];let h=titleH(p.title,p.sayTitle);const K='s7_'+page;
  if(p.type==='info'){h+=p.lines.map(l=>`<div class="card row"><div class="grow"><span class="label">${esc(l.label)}</span><span class="big">${esc(l.text)}</span></div>${spk(l.say)}</div>`).join('')}
  if(p.type==='choice'){h+=imgH(p.img)+`<div class="row"><div class="grow big">${esc(p.prompt)}</div></div>`;
    p.items.forEach((it,i)=>{const sel=S(K+'_'+i,null);h+=`<div class="card"><div class="row"><div class="grow sent">${esc(it.pre)}<b>＿＿</b>${esc(it.post)}</div>${spk(it.say)}</div>
     <div class="opts">${it.opts.map((o,j)=>`<span class="row" style="align-items:center"><button class="opt ${sel===j?(j===it.ans?'ok':'bad'):''}" data-ci="${i}" data-cj="${j}">${sel===j&&j===it.ans?'⭕ ':''}${esc(o.t)}</button>${spk(o.say)}</span>`).join('')}</div></div>`})}
  if(p.type==='blanks'){const fills=S(K,p.answers.map(()=>''));const selB=S(K+'_sel',0);
    h+=imgH(p.img)+`<div class="big">${esc(p.prompt)}</div>`;
    h+=`<div class="chips"><span class="cap">📦 詞語小幫手：先點空格，再點詞語 ${spk(D.UI.pickBlank)}</span>${p.chips.map(c=>`<span class="row" style="align-items:center"><button class="chip" data-chip="${esc(c)}">${esc(c)}</button>${spk(c)}</span>`).join('')}</div>`;
    p.sents.forEach(s=>{const allOk=s.parts.filter(x=>typeof x==='number').every(b=>okB(p,b,fills[b]));
      h+=`<div class="card">${s.q?`<div class="big">${esc(s.q)}</div>`:''}<div class="row"><div class="grow sent">${s.parts.map(x=>typeof x==='number'?blankH(p,x,fills[x],selB):esc(x)).join('')}</div>${spk(s.say)}${s.sayDone&&allOk&&s.parts.some(x=>typeof x==='number')?`<button class="spk" data-say="${esc(s.sayDone)}" title="聽完整句子" style="border-color:var(--ok);color:var(--ok)">✔</button>`:''}</div></div>`});
    h+=`<div class="actions"><button class="btn" id="clr">🧽 全部清除</button></div>`}
  if(p.type==='write'){const v=S(K,'');h+=`<div class="card row"><div class="grow big">${esc(p.prompt)}</div>${spk(p.sayTitle)}</div>
     <div class="card row"><div class="grow">💡 ${esc(p.hint)}</div>${spk(p.sayHint)}</div>
     <textarea id="ta" placeholder="在這裡寫句子……">${esc(v)}</textarea>
     <div class="actions"><button class="btn" id="readMine">🔊 唸我寫的句子</button><button class="btn pri" id="chkMine">✅ 檢查</button></div><div class="msg" id="msg"></div>`}
  if(p.type==='pair'){h+=`<div class="big">${esc(p.prompt)}</div>`;
    p.items.forEach((it,i)=>{const sel=S(K+'_'+i,null);const ok=sel===it.ans;
     h+=`<div class="card"><div class="row"><div class="grow sent">${it.parts.map(x=>typeof x==='number'?`<span class="blank ${sel===null?'':(ok?'ok':'bad')}">${sel===null?'':esc(p.opts[sel].t[x])}</span>`:esc(x)).join('')}</div>${spk(it.say)}</div>
      <div class="opts">${p.opts.map((o,j)=>`<span class="row" style="align-items:center"><button class="opt ${sel===j?(ok?'ok':'bad'):''}" data-pi="${i}" data-pj="${j}">${esc(o.t.join('……'))}……</button>${spk(o.say)}</span>`).join('')}</div></div>`})}
  if(p.type==='check'){const ck=S(K,p.lines.map(()=>false));
    h+=p.lines.map((l,i)=>`<div class="row" style="align-items:center"><button class="chk ${ck[i]?'on':''}" data-ck="${i}"><span class="box">${ck[i]?'✔':''}</span><span>${esc(l.text)}</span></button>${spk(l.say)}</div>`).join('');
    if(ck.every(x=>x))h+=`<div class="cheer">🎉👏🌟</div>`}
  if(showAns)h+=`<div class="ans"><b>👩‍🏫 教師用：參考答案</b>${D.S7_ANS.map(a=>`<div class="row"><div class="grow">${esc(a)}</div>${spk(a)}</div>`).join('')}</div>`;
  app.innerHTML=h;bindS7(p,K)}
function okB(p,b,v){return !!v&&p.answers[b].every(k=>v.includes(k))}
function blankH(p,b,v,sel){return `<button class="blank ${sel===b?'sel':''} ${v?(okB(p,b,v)?'ok':'bad'):''}" data-blank="${b}">${v?esc(v):'　'}</button>`}
function bindS7(p,K){
  document.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ci,j=+b.dataset.cj,it=p.items[i];st[K+'_'+i]=j;render();
    if(j===it.ans)speak(D.UI.correct,null,()=>speak(it.sayDone));else speak(D.UI.wrong)});
  document.querySelectorAll('[data-blank]').forEach(b=>b.onclick=()=>{st[K+'_sel']=+b.dataset.blank;render()});
  document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{const fills=st[K];const sb=st[K+'_sel'];fills[sb]=b.dataset.chip;
    const good=okB(p,sb,fills[sb]);
    const s=p.sents.find(s=>s.parts.includes(sb));const sentOk=s.parts.filter(x=>typeof x==='number').every(x=>okB(p,x,fills[x]));
    const nxt=fills.findIndex((f,i)=>!okB(p,i,f));if(good&&nxt>=0)st[K+'_sel']=nxt;render();
    if(!good)speak(D.UI.wrong);else if(sentOk&&s.sayDone)speak(D.UI.correct,null,()=>speak(s.sayDone));else speak(D.UI.correct)});
  const clr=$('#clr');if(clr)clr.onclick=()=>{st[K]=p.answers.map(()=>'');st[K+'_sel']=0;render()};
  const ta=$('#ta');if(ta){ta.oninput=()=>st[K]=ta.value;
    $('#readMine').onclick=e=>{const t=ta.value.trim();if(t){stopSpeak();tts(t)}else speak(p.sayTitle)};
    $('#chkMine').onclick=()=>{const t=ta.value.trim(),m=$('#msg');const miss=p.keys.filter(k=>!t.includes(k));let out=[];
      if(!t)out.push('還沒寫句子喔。');else{if(miss.length)out.push('少了關鍵詞：'+miss.join('、')+'。');if(!t.includes('，'))out.push('記得加逗號「，」。');if(!/[。！]$/.test(t))out.push('句子最後要加句號「。」。')}
      if(!out.length){m.className='msg ok';m.textContent='👍 關鍵詞用對了，標點也有！請老師看看意思通不通順。';speak(D.UI.correct)}else{m.className='msg bad';m.textContent=out.join('');stopSpeak();tts(out.join(''))}}}
  document.querySelectorAll('[data-pi]').forEach(b=>b.onclick=()=>{const i=+b.dataset.pi,j=+b.dataset.pj,it=p.items[i];st[K+'_'+i]=j;render();
    if(j===it.ans)speak(D.UI.correct,null,()=>speak(it.sayDone));else speak(D.UI.wrong)});
  document.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{const ck=st[K];const i=+b.dataset.ck;ck[i]=!ck[i];render();if(ck.every(x=>x))speak(D.UI.done);else if(ck[i])speak(p.lines[i].say)});
}

/* ---------- 相似字 ---------- */
function renderSim(app){const g=D.SIM.find(g=>g.key===view);$('#ttl').textContent='相似字區辨　'+g.title.match(/「.」/)[0];
  let h=`<h1>${esc(g.title)} ${spk(g.say)}</h1>`;
  if(page<3){const c=g.chars[page];
    h+=`<div class="big">① 看圖讀詞，用手指出字的<span class="bu">紅色部首</span>。</div>
    <div class="charRow"><img src="img/${c.img}" data-zoom alt="${esc(c.char)}"><img src="img/${c.pic}" data-zoom alt="${esc(c.word)}"></div>
    <div class="card row"><div class="grow"><span class="bu">${esc(c.bu)}</span>　<span class="word">${esc(c.word)}</span><div class="big">${esc(c.exp)}</div></div>${spk(c.say)}</div>
    <div class="opts" style="justify-content:center">${g.chars.map((x,i)=>`<button class="opt ${i===page?'ok':''}" data-jump="${i}" style="font-size:1.4em">${esc(x.char)}</button>`).join('')}</div>`}
  else{const qi=page-3,q=g.qs[qi],K=view+'_q'+qi;const sel=S(K,null),marks=S(K+'_m',[]);const ok=sel===q.ans;
    h+=`<div class="big">② 讀句子，圈出方格裡要放的字。 ${spk(D.UI.clueHint)}</div>`;
    const clueIdx=new Set();q.clue.forEach(cw=>{const k=q.sent.indexOf(cw);if(k>=0)for(let i=0;i<cw.length;i++)clueIdx.add(k+i)});
    const chars=[...q.sent];
    h+=`<div class="card"><div class="row"><div class="grow ss ${q.self?'self':''}"><b>${q.n}</b>　${chars.map((c,i)=>c==='□'?`<span class="box ${ok?'ok':''}">${ok?esc(q.opts[q.ans]):''}</span>`:`<span class="c ${clueIdx.has(i)?'clue':''} ${marks.includes(i)?'mark':''}" data-ci="${i}">${esc(c)}</span>`).join('')}</div>${spk(q.say)}</div>
      ${q.self?`<div class="row" style="align-items:center;font-size:.8em"><div class="grow">✍️ 點一點句子裡的字，畫出你找到的線索。</div>${spk(D.UI.tapClue)}</div>`:`<div style="font-size:.8em">🔎 線索：<b style="text-decoration:underline">${esc(q.clue.join('、'))}</b></div>`}</div>
      <div class="charOpts">${q.opts.map((o,j)=>`<div class="charOpt"><button class="opt ${sel===j?(ok?'ok':'bad'):''}" data-oj="${j}">${esc(o)}</button>${spk(D.OPT_SAY[o])}</div>`).join('')}</div>
      ${ok?`<div class="card row" style="border-color:var(--ok)"><div class="grow big" style="color:var(--ok)">⭕ ${esc(q.sayDone)}</div>${spk(q.sayDone)}</div>`:''}`;
    if(showAns)h+=`<div class="ans"><b>👩‍🏫 參考答案：</b>${g.qs.map(x=>`${x.n}. ${esc(x.opts[x.ans])}`).join('　')}</div>`;
    app.innerHTML=h;
    document.querySelectorAll('[data-oj]').forEach(b=>b.onclick=()=>{const j=+b.dataset.oj;st[K]=j;render();if(j===q.ans)speak(D.UI.correct,null,()=>speak(q.sayDone));else speak(D.UI.wrong)});
    if(q.self)document.querySelectorAll('.ss [data-ci]').forEach(s=>s.onclick=()=>{const i=+s.dataset.ci;const m=st[K+'_m'];const k=m.indexOf(i);if(k>=0)m.splice(k,1);else m.push(i);render()});
    return}
  if(showAns)h+=`<div class="ans"><b>👩‍🏫 參考答案：</b>${g.qs.map(x=>`${x.n}. ${esc(x.opts[x.ans])}`).join('　')}</div>`;
  app.innerHTML=h;document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>go(view,+b.dataset.jump))}

applySet();render();
try{speechSynthesis.getVoices()}catch(e){}
</script>
</body>
