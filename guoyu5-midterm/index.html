/* ---------- speech ---------- */
const audio=new Audio(); let token=0;
function voice(){const v=speechSynthesis.getVoices();return v.find(x=>/zh[-_]TW/i.test(x.lang)&&/female|Hsiao|Mei|Yating|曉/i.test(x.name))||v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang));}
function play1(text,tk){return new Promise(res=>{
  if(tk!==token)return res();
  const src=D.aud[text];
  const fallback=()=>{ if(!("speechSynthesis" in window))return res();
    const u=new SpeechSynthesisUtterance(text);u.lang="zh-TW";u.rate=0.85*st.rate;const v=voice();if(v)u.voice=v;
    u.onend=u.onerror=()=>res(); speechSynthesis.speak(u); };
  if(!src)return fallback();
  audio.onended=()=>res(); audio.onerror=()=>fallback();
  audio.src=src; audio.playbackRate=st.rate;
  audio.play().catch(()=>fallback());
});}
function stopSpeak(){token++;audio.pause();try{speechSynthesis.cancel()}catch(e){}document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));}
async function readSeq(list){ stopSpeak(); const tk=token;
  for(const [el,t] of list){ if(tk!==token)return;
    if(el){el.classList.add("reading");el.scrollIntoView({block:"nearest",behavior:"smooth"});}
    await play1(t,tk); if(el)el.classList.remove("reading");
    await new Promise(r=>setTimeout(r,250)); }
}
const say=(t,el)=>readSeq([[el||null,t]]);
/* ---------- views ---------- */
let view="home";
const N=D.items.length;
const label=it=>`${it.sec}-${it.no}`;
function show(v){view=v;stopSpeak();
  const m=$("main"); $("bar").hidden=(v==="home");
  if(v==="home")return home();
  if(v==="toc")return toc();
  qview();
}
function home(){
  $("prog").textContent="";
  $("main").innerHTML=`<section class="screen">
    <p class="eyebrow">潛能班 ・ 只報讀題目，不用在網站上作答</p>
    <h1>五上國語期中評量<br>報讀（第二頁）</h1>
    <div><span class="fact">七、選擇題 6 題</span> <span class="fact">八、照樣寫短語 2 題</span> <span class="fact">九、接寫句子 1 題</span></div>
    <ul class="help"><li>每換一題，會自動把題目唸一次。</li><li>按 <b>🔊 喇叭</b> 可以再聽一次；詞語箱的每個語詞都可以按來聽。</li><li>答案請寫在考卷上。</li></ul>
    <div class="row" style="flex-wrap:wrap;gap:1rem;align-items:flex-start">
      <button class="big" id="startBtn" type="button">${st.i>0?"繼續報讀":"開始報讀"}</button>
      <div class="qrbox"><div id="qr"></div><small>${D.url}</small></div>
    </div></section>`;
  try{new QRCode($("qr"),{text:D.url,width:150,height:150,correctLevel:QRCode.CorrectLevel.M})}catch(e){}
  $("startBtn").onclick=()=>show("q");
}
function toc(){
  $("prog").textContent="題目目錄";
  let h='<section class="screen"><h1 style="font-size:1.5rem">題目目錄</h1>'; let last="";
  D.items.forEach((it,i)=>{ if(it.sec!==last){ if(last)h+='</div>'; h+=`<p class="toch">${esc(D.secs[it.sec].title)}</p><div class="toc">`; last=it.sec;}
    h+=`<button type="button" data-i="${i}" class="${i===st.i?"cur":""}">${it.sec==="九"?"九、接寫句子":"第 "+it.no+" 題"}</button>`;});
  h+='</div></section>'; $("main").innerHTML=h;
  $("main").querySelectorAll(".toc button").forEach(b=>b.onclick=()=>{st.i=+b.dataset.i;save();show("q");});
  say(D.ui.toc);
}
const lessonize=s=>esc(s).replace(/〔(.+?)〕/g,'<span class="lesson">$1</span>');
const phr=parts=>parts.map(([k,w])=>k==="_"?'<span class="blank"></span>':k==="b"?`「${esc(w)}」`:esc(w)).join("").replace(/<span class="blank"><\/span>。/g,'<span style="white-space:nowrap"><span class="blank"></span>。</span>');
function qview(){
  const it=D.items[st.i], sec=D.secs[it.sec];
  const first=st.i===0||D.items[st.i-1].sec!==it.sec;
  $("prog").textContent=`${st.i+1} / ${N}`;
  let h=`<section class="screen"><div class="sech"><b id="secT">${esc(sec.title)}</b><button class="speaker sm" id="secSpk" type="button" aria-label="聽大題說明">${SPK}</button></div><div class="card">`;
  const seq=[];
  if(first) seq.push(["secT",sec.say]);
  if(it.t==="choice"){
    h+=`<div class="row"><div class="stem" id="stem">${it.no}. ${lessonize(it.stem)}</div><button class="speaker" id="stemSpk" type="button" aria-label="聽題目">${SPK}</button></div>`;
    seq.push(["stem",it.say]);
    it.opts.forEach((o,j)=>{h+=`<div class="opt" id="o${j}"><span class="num">${j+1}</span><span class="otext">${esc(o.d)}</span><button class="speaker sm" data-o="${j}" type="button" aria-label="聽選項${j+1}">${SPK}</button></div>`;seq.push(["o"+j,o.s]);});
  }else if(it.t==="phrase"){
    h+=`<div class="label">第 ${it.no} 題　例句</div><div class="row"><div class="phr" id="ex">${phr(it.ex)}</div><button class="speaker" id="exSpk" type="button" aria-label="聽例句">${SPK}</button></div>`;
    h+=`<div class="wbox" id="box"><div class="head"><b>詞語箱</b><button class="speaker sm" id="boxSpk" type="button" aria-label="聽詞語箱">${SPK}</button></div>`;
    it.box.forEach((g,gi)=>{h+=`<div class="grp" id="g${gi}"><span class="gnum">${gi+1}</span>${g.map(w=>`<button class="word" type="button" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>`;});
    h+=`</div><div class="label">請照樣寫在考卷上</div><div class="row"><div class="phr" id="qq">${phr(it.q)}</div><button class="speaker" id="qSpk" type="button" aria-label="聽題目">${SPK}</button></div>`;
    seq.push(["ex",it.exSay],["box",it.boxSay],["qq",it.qSay]);
  }else{
    h+=`<div class="pics"><img src="${it.imgs[0]}" alt="圖片一"><span class="arrow">➜</span><img src="${it.imgs[1]}" alt="圖片二"></div>`;
    h+=`<div class="row"><div class="phr" id="qq">${phr(it.q)}</div><button class="speaker" id="qSpk" type="button" aria-label="聽題目">${SPK}</button></div>`;
    seq.push(["qq",it.qSay]);
  }
  h+=`<button class="again" id="again" type="button">${SPK}整題再唸一次</button></div></section>`;
  $("main").innerHTML=h;
  const S=s=>s.map(([id,t])=>[$(id),t]);
  $("secSpk").onclick=()=>say(sec.say,$("secT"));
  $("again").onclick=()=>readSeq(S(seq));
  if($("stemSpk"))$("stemSpk").onclick=()=>say(it.say,$("stem"));
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const j=+b.dataset.o;say(it.opts[j].s,$("o"+j));});
  if($("exSpk"))$("exSpk").onclick=()=>say(it.exSay,$("ex"));
  if($("boxSpk"))$("boxSpk").onclick=()=>say(it.boxSay,$("box"));
  if($("qSpk"))$("qSpk").onclick=()=>say(it.qSay,$("qq"));
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>say(b.dataset.w,b));
  $("prevBtn").disabled=st.i===0;
  $("nextBtn").textContent=st.i===N-1?"最後一題":"下一題 →";
  window.scrollTo(0,0);
  setTimeout(()=>readSeq(S(seq)),300);
}
$("prevBtn").onclick=()=>{ if(st.i>0){st.i--;save();show("q");} };
$("nextBtn").onclick=()=>{ if(st.i<N-1){st.i++;save();show("q");} else say(D.ui.end); };
$("tocBtn").onclick=()=>show(view==="toc"?"q":"toc");
$("homeBtn").onclick=()=>show("home");
$("fMinus").onclick=()=>{st.fs=Math.max(18,st.fs-2);save();applySettings();};
$("fPlus").onclick=()=>{st.fs=Math.min(36,st.fs+2);save();applySettings();};
$("hc").onclick=()=>{st.hc=!st.hc;save();applySettings();};
$("rate").onclick=()=>{st.rate=RATES[(RATES.indexOf(st.rate)+1)%RATES.length];save();applySettings();};
try{speechSynthesis.getVoices()}catch(e){}
applySettings(); show("home");
</script>
</body></html>
