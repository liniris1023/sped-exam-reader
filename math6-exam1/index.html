<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>六上數學第一次評量報讀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one question per screen; sticky tool bar on top; big prev/next bar fixed at bottom (same frame as 自然/社會作業簿報讀, scaled up) */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --fg:#101317; --muted:#424A57; --line:#B8C0CC;
  --accent:#0A4DA3; --accent-fg:#FFFFFF; --sel:#DCE8FA; --listen:#6A1B9A; --listen-bg:#F1E6F8;
  --ok:#1C7A33; --bad:#B3261E; --focus:#FF9F00; --reading:#FFF1B8; --stu:#C2410C; --stu-fg:#FFFFFF;
  --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --en:"Andika","Noto Sans TC","Arial Rounded MT Bold",Arial,sans-serif;
  font-size:24px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1013; --surface:#1A1D22; --fg:#F5F7FA; --muted:#BCC3CD; --line:#4A525E;
  --accent:#FFD54A; --accent-fg:#111111; --sel:#3B3414; --listen:#D7A6F2; --listen-bg:#2B1D33;
  --ok:#7EDB91; --bad:#FF8F86; --focus:#FFD54A; --reading:#4A3F12; --stu:#FFA94D; --stu-fg:#111111; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#1A1D22; --fg:#F5F7FA; --muted:#BCC3CD; --line:#4A525E;
  --accent:#FFD54A; --accent-fg:#111111; --sel:#3B3414; --listen:#D7A6F2; --listen-bg:#2B1D33;
  --ok:#7EDB91; --bad:#FF8F86; --focus:#FFD54A; --reading:#4A3F12; --stu:#FFA94D; --stu-fg:#111111; color-scheme:dark }
:root[data-contrast="hc"]{
  --bg:#000000; --surface:#000000; --fg:#FFEB3B; --muted:#FFEB3B; --line:#FFEB3B;
  --accent:#FFEB3B; --accent-fg:#000000; --sel:#3D3800; --listen:#FFFFFF; --listen-bg:#1A1A1A;
  --ok:#5CFF8A; --bad:#FF7070; --focus:#FFFFFF; --reading:#3D3800; --stu:#FFEB3B; --stu-fg:#000000; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--zh);font-size:1rem;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(7.5rem + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.wrap{max-width:52rem;margin:0 auto}
.en{font-family:var(--en)}
svg{flex:none}

/* tool bar */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line);padding-block:.45rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.tool{border:2px solid var(--line);background:var(--surface);border-radius:.5rem;padding:.2rem .6rem;font-size:.75rem;font-weight:700;min-height:2.3rem}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tools .grow{flex:1}
.home{display:inline-flex;align-items:center;gap:.3rem;background:var(--fg);color:var(--bg);border:0;border-radius:.6rem;padding:.25rem .8rem .25rem .5rem;font-size:.95rem;font-weight:900;min-height:2.8rem}
.home svg{width:1.6rem;height:1.6rem}
.progress{font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums}

/* screens */
.screen{padding-block:1.2rem;display:flex;flex-direction:column;gap:1rem}
.eyebrow{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:0}
h1{font-size:2rem;line-height:1.3;margin:0;font-weight:900;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:.5rem}
.fact{border:2px solid var(--line);border-radius:.5rem;padding:.2rem .7rem;font-weight:700;background:var(--surface);font-size:.85rem}
.help{margin:0;padding-left:1.3rem;color:var(--muted);font-size:.85rem;display:flex;flex-direction:column;gap:.2rem}
.big{background:var(--accent);color:var(--accent-fg);border:0;border-radius:.8rem;font-size:1.3rem;font-weight:900;padding:.7rem 1.4rem;min-height:4rem}
.big:disabled{opacity:.45;cursor:default}
.ghost{background:var(--surface);border:3px solid var(--fg);border-radius:.8rem;font-size:1rem;font-weight:700;padding:.5rem 1.1rem;min-height:3.2rem}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.8rem}
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.field label{font-weight:900;font-size:1rem}
.input{font:inherit;font-size:1.4rem;font-weight:700;padding:.4rem .7rem;border:3px solid var(--fg);border-radius:.7rem;background:var(--surface);color:var(--fg);min-height:3.6rem;width:100%}
.warnbox{border:3px solid var(--bad);border-radius:1rem;padding:1rem;background:var(--surface);display:flex;flex-direction:column;gap:.7rem}
.warnbox p{margin:0;font-weight:900;color:var(--bad)}

/* section head */
.sec{padding-top:.9rem;display:flex;flex-direction:column;gap:.4rem}
.sech{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .8rem}
.sech b{font-size:1.25rem;font-weight:900;line-height:1.35}
.sech .en{font-weight:700}
.sech small{color:var(--muted);font-weight:700;font-size:.85rem}
.tag{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.15rem .8rem .15rem .55rem;font-weight:900;font-size:.85rem;border:2px solid currentColor}
.tag svg{width:1.3rem;height:1.3rem}
.tag.listen{color:var(--listen);background:var(--listen-bg)}
.tag.over{color:var(--ok)}

/* speakers */
.speaker{flex:none;width:4.6rem;height:4.6rem;border-radius:50%;border:4px solid var(--accent);background:var(--surface);color:var(--accent);display:grid;place-items:center}
.speaker svg{width:2.6rem;height:2.6rem}
.pill{width:auto;height:auto;min-height:3.6rem;border-radius:999px;display:inline-flex;align-items:center;gap:.4rem;padding:.3rem 1.2rem .3rem .8rem;font-size:1.05rem;font-weight:900}
.pill svg{width:2rem;height:2rem}
.reading{background:var(--reading)!important;outline:4px solid var(--accent);outline-offset:3px;border-radius:.6rem}

/* passage / dialogue */
.passage{border:3px solid var(--line);background:var(--surface);border-radius:1rem;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.5rem}
.ptop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem}
.ptop b{font-size:1.05rem;font-weight:900}
.fig{margin:0;align-self:center;width:100%;max-width:30rem;background:#FFFFFF;border:3px solid var(--line);border-radius:.8rem;padding:.5rem}
.fig img{display:block;width:100%;height:auto}
.zoomable{cursor:zoom-in}
.lnrow{display:flex;align-items:center;gap:.5rem}
.lnspk{width:3.8rem;height:3.8rem;border-width:3px}
.lnspk svg{width:2.2rem;height:2.2rem}
.ln{display:block;flex:1;min-width:0;width:100%;text-align:left;background:transparent;border:0;border-radius:.5rem;padding:.25rem .35rem;font-family:var(--en);font-size:1.45rem;font-weight:700;line-height:2.1}
.ln.cur{background:var(--sel)}
.blank{cursor:pointer;display:inline-flex;align-items:baseline;gap:.25rem;min-width:4.2em;border-bottom:4px solid var(--fg);padding:0 .3rem;margin:0 .15rem;line-height:1.5;justify-content:center}
.blank i{font-style:normal;font-family:var(--zh);font-size:.75em;font-weight:900;color:var(--muted)}
.blank.filled{color:var(--accent)}
.blank.cur{background:var(--reading);border-bottom-color:var(--accent);border-bottom-width:6px;outline:3px dashed var(--accent);outline-offset:2px;border-radius:.3rem .3rem 0 0}
.vocab{display:flex;flex-wrap:wrap;gap:.4rem;border-top:2px dashed var(--line);padding-top:.6rem}
.vocab button{border:2px solid var(--line);background:var(--bg);border-radius:.5rem;padding:.2rem .6rem;font-size:.95rem;font-weight:700;min-height:2.8rem}
.vocab button .en{font-size:1.05rem}
.vocab button{display:inline-flex;align-items:center;gap:.2rem}
.vspk{display:inline-grid;place-items:center;width:2.2rem;height:2.2rem;margin-left:.3rem;border-radius:50%;border:3px solid var(--accent);color:var(--accent);background:var(--surface)}
.vspk svg{width:1.3rem;height:1.3rem}
.note{color:var(--muted);font-weight:700;font-size:.95rem;margin:0}

/* question card */
.card{background:var(--surface);border:3px solid var(--line);border-radius:1rem;padding:1rem;display:flex;flex-direction:column;gap:1rem}
.qhead{display:flex;gap:.8rem;align-items:flex-start}
.qnum{flex:none;font-weight:900;font-size:1.7rem;line-height:1.5;background:var(--fg);color:var(--bg);border-radius:.6rem;padding:.1rem .7rem;font-variant-numeric:tabular-nums;min-width:3rem;text-align:center}
.stem{font-size:1.4rem;font-weight:700;line-height:1.7;margin:0;min-width:0;flex:1;border-radius:.4rem;padding:0 .2rem}
.stem.en{font-size:1.6rem}
.stem .ln{padding:0;font-size:1.6rem}
.qhead{align-items:center;flex-wrap:wrap}
.stemrow{display:flex}
.opts.bigw .optbtn{font-size:3.4rem;min-height:7.5rem;letter-spacing:.03em}
.wpop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wcard{background:var(--surface);color:var(--fg);border:6px solid var(--accent);border-radius:1.4rem;padding:1.5rem 2rem;display:flex;flex-direction:column;align-items:center;gap:1rem;max-width:100%;min-width:min(30rem,100%)}
.wno{width:6rem;height:6rem;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--en);font-size:4rem;font-weight:700;line-height:1}
.wword{font-family:var(--en);font-weight:700;font-size:clamp(4.5rem,20vw,10rem);line-height:1.1;letter-spacing:.04em;overflow-wrap:anywhere;text-align:center}
.wsel{font-weight:900;font-size:1.3rem;color:var(--accent)}
.pcard{width:min(44rem,100%);max-height:100%;overflow:auto;padding:1rem 1.2rem;gap:.7rem}
.pcard .wno{width:4.6rem;height:4.6rem;font-size:3rem;flex:none}
.pcard img{display:block;width:100%;max-height:52vh;object-fit:contain;background:#FFFFFF;border-radius:.6rem;border:3px solid var(--line)}
.pcap{margin:0;font-weight:900;font-size:1.9rem;line-height:1.35;text-align:center;border-radius:.5rem;padding:0 .4rem}
.pcap .en{font-size:2.3rem}
.listenbox{display:flex;align-items:center;gap:.7rem;border:3px dashed var(--listen);color:var(--listen);background:var(--listen-bg);border-radius:.8rem;padding:.6rem .9rem;font-weight:900;font-size:1.1rem}
.listenbox svg{width:2.6rem;height:2.6rem}

.opts{display:flex;flex-direction:column;gap:.8rem}
.opt{display:flex;gap:.6rem;align-items:stretch}
.optbtn{flex:1;min-width:0;display:flex;gap:1rem;align-items:center;text-align:left;border:4px solid var(--line);background:var(--surface);border-radius:1rem;padding:.7rem 1rem;font-family:var(--en);font-size:1.7rem;font-weight:700;min-height:6rem;line-height:1.35}
.optbtn .no{flex:none;width:5.2rem;height:5.2rem;border-radius:50%;border:6px solid currentColor;display:grid;place-items:center;font-family:var(--en);font-size:3.2rem;font-weight:700;line-height:1}
.optbtn .box{flex:none;width:4.6rem;height:4.6rem;border-radius:.5rem;display:grid;place-items:center}
.optbtn .box svg{width:3.4rem;height:3.4rem;visibility:hidden}
.optbtn[aria-checked="true"]{border-color:var(--accent);background:var(--sel);outline:4px solid var(--accent)}
.optbtn[aria-checked="true"] .no{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.optbtn[aria-checked="true"] .box{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.optbtn[aria-checked="true"] .box svg{visibility:visible}
.opt .speaker{width:6rem;height:auto;min-height:6rem;border-radius:1rem}
.opt .speaker svg{width:3.4rem;height:3.4rem}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.8rem}
.words .opt{min-width:0}
.words .optbtn{justify-content:center;text-align:center;font-size:2.2rem;min-height:6.4rem;padding:.5rem}
.words .speaker{width:4.6rem;min-height:auto}
.words .speaker svg{width:2.6rem;height:2.6rem}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem}
.picbtn{position:relative;border:5px solid var(--line);background:#FFFFFF;color:#101317;border-radius:1rem;padding:.6rem .6rem .6rem 6.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;min-height:13rem}
.picbtn .cap{font-weight:900;font-size:1.15rem;line-height:1.3;text-align:center}
.picbtn .cap .en{font-size:1.3rem}
.picbtn img{display:block;width:100%;max-height:15rem;object-fit:contain}
.picbtn .no{position:absolute;left:.6rem;top:.6rem;width:5.2rem;height:5.2rem;border-radius:50%;border:6px solid #101317;color:#101317;background:#FFFFFF;display:grid;place-items:center;font-family:var(--en);font-size:3.2rem;font-weight:700;line-height:1}
.picbtn[aria-checked="true"]{border-color:var(--accent);outline:5px solid var(--accent);background:#EAF1FC}
.picbtn[aria-checked="true"] .no{background:#0A4DA3;color:#FFFFFF;border-color:#0A4DA3}
.bank{border:3px solid var(--fg);border-radius:.7rem;padding:.5rem .8rem;display:flex;flex-direction:column;gap:.3rem}
.bank b{font-size:1.1rem}
.bank div{display:flex;flex-wrap:wrap;gap:.4rem 1.6rem;font-size:1.6rem;font-weight:700}
.psgfold{margin-top:0}
.psgfold .passage{margin-bottom:.6rem}
.paperdone{width:100%;min-height:5.2rem;font-size:1.5rem;background:var(--ok);color:#FFFFFF}
:root[data-contrast="hc"] .paperdone{color:#000000}
.paperbox{display:flex;align-items:center;gap:.9rem;border:4px dashed var(--accent);border-radius:1rem;padding:1rem 1.1rem;font-size:1.4rem;font-weight:900;line-height:1.5}
.paperbox svg{width:3.4rem;height:3.4rem;color:var(--accent)}
.chosen{font-weight:900;font-size:1.05rem;color:var(--accent);margin:0}

/* navigator */
details.nav{margin-top:1rem;border:2px solid var(--line);border-radius:.8rem;background:var(--surface);padding:.3rem .8rem}
details.nav summary{font-weight:900;font-size:.95rem;cursor:pointer;padding:.4rem 0;min-height:2.6rem}
.navsec{display:flex;flex-direction:column;gap:.3rem;padding-block:.4rem;border-top:1px solid var(--line)}
.navsec b{font-size:.8rem}
.grid{display:flex;flex-wrap:wrap;gap:.35rem}
.grid button{border:2px solid var(--line);background:var(--bg);border-radius:.5rem;min-height:2.8rem;min-width:3.2rem;padding:0 .4rem;font-weight:900;font-size:.85rem;font-variant-numeric:tabular-nums}
.grid button.done{background:var(--sel);border-color:var(--accent)}
.grid button[aria-current="true"]{outline:4px solid var(--fg)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:3px solid var(--line);z-index:6;
  padding:.6rem max(16px,env(safe-area-inset-right,0px)) calc(.6rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.bar button{min-height:4.4rem;border-radius:.9rem;font-size:1.3rem;font-weight:900}
.prev{background:var(--surface);border:3px solid var(--fg)}
.next{background:var(--accent);color:var(--accent-fg);border:0}
.next.finish{background:var(--stu);color:var(--stu-fg)}
.bar button:disabled{opacity:.35;cursor:default}
.next.locked{opacity:.4}
@media (prefers-reduced-motion:no-preference){ .shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}} }

/* check & done */
.miss{display:flex;flex-wrap:wrap;gap:.5rem}
.miss button{border:3px solid var(--bad);color:var(--bad);background:var(--surface);border-radius:.6rem;min-height:3rem;padding:0 .8rem;font-weight:900}
.done-mark{font-size:4.5rem;line-height:1;color:var(--ok);font-weight:900}
.status{font-weight:900;min-height:1.6em;margin:0}
.status.bad{color:var(--bad)} .status.ok{color:var(--ok)}
.qrbox{align-self:flex-start;background:#FFFFFF;color:#111111;border:4px solid var(--fg);border-radius:1rem;padding:1rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;max-width:100%}
.qrbox img,.qrbox canvas{display:block;max-width:100%;height:auto}
.qrbox p{margin:0;font-weight:900;font-size:1rem;color:#111111;text-align:center}
.sheetprev{display:flex;flex-direction:column;gap:.8rem;overflow-x:auto}
.sheetprev img{width:100%;max-width:40rem;border:2px solid var(--line);background:#FFFFFF}

/* zoom overlay */
.zoom{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.zoom img{max-width:100%;max-height:100%;background:#FFFFFF;border-radius:.6rem}
.zoom button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));background:#FFFFFF;color:#101317;border:0;border-radius:999px;font-weight:900;font-size:1.1rem;min-height:3.4rem;padding:0 1.2rem}

/* answer sheet for PDF (always printed light) */
#report{position:absolute;left:-20000px;top:0}
.pg{width:794px;height:1123px;padding:44px 48px;background:#FFFFFF;color:#111111;font-family:"Noto Sans TC",sans-serif;font-size:14px;line-height:1.45;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.pg h2{margin:0;font-size:19px;font-weight:900;text-align:center}
.pg .sub{text-align:center;font-weight:700;font-size:14px;margin:0}
.pg .who{display:flex;gap:22px;justify-content:center;font-size:15px;font-weight:700;flex-wrap:wrap}
.pg .who span b{border-bottom:1.5px solid #111;padding:0 8px;font-weight:900}
.pg table{border-collapse:collapse;width:100%}
.pg th,.pg td{border:1.2px solid #444;padding:4px 7px;text-align:left;vertical-align:middle}
.pg th{background:#ECEFF3;font-size:12.5px}
.pg td.c{text-align:center}
.pg .enr{font-family:"Andika","Noto Sans TC",sans-serif;font-size:15px}
.pg .ok{color:#1C7A33;font-weight:900}
.pg .no{color:#B3261E;font-weight:900}
.pg .blankcell{color:#999}
.pg h3{margin:0 0 5px;font-size:15px;font-weight:900}
.pg .thumb{height:38px;vertical-align:middle;margin-left:8px;border:1px solid #999}
.pg .foot{margin-top:auto;font-size:11px;color:#666;text-align:right}
.pg .tot td{font-weight:900;font-size:15px}
@media (max-width:520px){ :root{font-size:20px} .optbtn{font-size:1.45rem} .words .optbtn{font-size:1.8rem} .ln{font-size:1.25rem} .stem.en,.stem .ln{font-size:1.4rem} .pics{grid-template-columns:1fr} }
@media (prefers-reduced-motion:no-preference){ .optbtn,.picbtn{transition:background .15s} }
</style>

<style>
/* math additions: fractions, answer boxes, number pad, compare buttons */
.mx{display:inline-flex;align-items:center;gap:.08em;vertical-align:middle;margin:0 .1em}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;font-size:.8em;vertical-align:middle}
.fr>span{display:block;padding:0 .18em;text-align:center}
.fr>span:first-child{border-bottom:.1em solid currentColor}
.mline{font-size:2rem;font-weight:700;line-height:2.4;margin:0;border-radius:.5rem;padding:.2rem .3rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mline.mbig{font-size:2.6rem;text-align:center}

function showVal(it,v){ if(v==null||v==="")return ""; if(it.kind==="pick")return it.picks[v]; if(it.kind==="multi")return multiTxt(v); return String(v); }

  } else {

    h+=`<button class="big paperdone" id="paperDone" type="button">${a!=null?"✓ ":""}我在答案紙寫好了，下一題 →</button>`;
  }

  h+=`</section>`;

function setAns(v){ const it=ITEMS[st.i]; if(v===""||v==null) delete st.ans[it.id]; else st.ans[it.id]=v; if(st.t1)st.t1=null; save(); renderQ(true); }
function pick(k,msg){ const it=ITEMS[st.i]; st.ans[it.id]=k; if(st.t1)st.t1=null; save(); renderQ(true); say1(msg); }
function jumpBlank(s,k){ const it=s.items.find(x=>x.k===k); if(!it)return; const n=ITEMS.indexOf(it);

function go(n){ stopSpeak(); st.i=Math.max(0,Math.min(ITEMS.length-1,n)); save(); show("q"); }
$("prevBtn").onclick=()=>go(st.i-1);
$("nextBtn").onclick=()=>{ const it=ITEMS[st.i];
  if(!isDone(it)){ say1(it.t==="fill"&&it.kind!=="pick"?"請先寫好答案，才能到下一題。":"請先選一個答案，才能到下一題。"); const b=$("nextBtn"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); return; }
  if(st.i===ITEMS.length-1){stopSpeak(); show("check");} else go(st.i+1); };
document.addEventListener("keydown",e=>{ if(view!=="q"||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==="ArrowRight")$("nextBtn").click(); if(e.key==="ArrowLeft"&&st.i>0)go(st.i-1); });

    const body=s.items.map(it=>{ const t=stuText(it);
      const ansCell = t==null ? `<span class="no">（未作答）</span>` : `<b>${M(t)}</b>`;
      const ctx = it.t==="choice"?M(it.stem) : it.t==="cmp"?M(it.line,()=>"□") : M(s.groups[it.g].line,k=>{const x=s.items.find(y=>y.k===k); return `（${x.bl||"　"}）`;});
      return `<tr><td class="c"><b>${esc(it.lab)}</b></td><td><div class="ctx">${ctx}</div>${ansCell}</td><td>${M(keyText(it))}</td><td class="c">${right(it)?'<span class="ok">○</span>':'<span class="no">✕</span>'}</td></tr>`; }).join("");
    B.push(`<div><h3>${s.no}、${M(s.zh)}（${s.perNote||"每題 "+s.per+" 分"}）</h3><table>${head}${body}</table></div>`);
  });
  return B;
}
function layoutPages(){
  const host=$("report"); host.innerHTML=""; const blocks=sheetBlocks(); const out=[];
  let pg=null; const newPage=()=>{ pg=document.createElement("div"); pg.className="pg"; host.appendChild(pg); out.push(pg); };
  newPage();
  blocks.forEach(html=>{ const d=document.createElement("div"); d.innerHTML=html; const blk=d.firstElementChild;
    pg.appendChild(blk);
    if(pg.scrollHeight>1123 && pg.children.length>1){ pg.removeChild(blk);
      const tb=blk.querySelector("table");
      if(tb&&tb.rows.length>3){ /* 表格太長：一列一列放，放不下就換頁並重複表頭 */
        const h3=blk.querySelector("h3"), rows=[...tb.rows], hd=rows.shift();
        let cur=null; const start=(first)=>{ const b=document.createElement("div"); if(first&&h3)b.appendChild(h3.cloneNode(true)); const t=document.createElement("table"); t.appendChild(hd.cloneNode(true)); b.appendChild(t); pg.appendChild(b); cur=t; };
        start(true);
        rows.forEach(r=>{ cur.appendChild(r); if(pg.scrollHeight>1123&&cur.rows.length>2){ cur.removeChild(r); newPage(); start(false); cur.appendChild(r);} });
      } else { newPage(); pg.appendChild(blk); } } });
  out.forEach((p,i)=>{ const f=document.createElement("div"); f.className="foot"; f.textContent=`第 ${i+1} / ${out.length} 頁`; p.appendChild(f); });
  return out;
}
async function buildPDF(){
  try{
    if(!window.html2canvas||!window.jspdf) return false;
    try{ await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,3000))]); }catch(e){}
    pages=layoutPages();
    const doc=new window.jspdf.jsPDF({unit:"pt",format:"a4",compress:true}); const prev=$("sheetPrev");
    for(let i=0;i<pages.length;i++){
      const c=await html2canvas(pages[i],{scale:2,backgroundColor:"#FFFFFF",useCORS:true,logging:false});
      const url=c.toDataURL("image/jpeg",0.9);
      if(i)doc.addPage(); doc.addImage(url,"JPEG",0,0,595.28,841.89);
      if(prev){ const im=new Image(); im.src=url; im.alt=`作答紀錄第 ${i+1} 頁`; prev.appendChild(im); }
    }
    pdfBlob=doc.output("blob"); return true;
  }catch(e){ console.error(e); return false; }
}
function renderSheetFallback(){ const prev=$("sheetPrev"); if(!prev)return; prev.innerHTML=""; layoutPages().forEach(p=>{ const c=p.cloneNode(true); c.style.height="auto"; const w=document.createElement("div"); w.style.overflowX="auto"; w.appendChild(c); prev.appendChild(w); }); }
async function downloadPDF(){
  const s=$("pdfStatus"); s.className="status"; s.textContent="";
  const fname="六上數學第一次評量_六丙.pdf";
  try{
    const file=new File([pdfBlob],fname,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPad|iPhone|Android/i.test(navigator.userAgent)){
      try{ await navigator.share({files:[file],title:fname}); s.className="status ok"; s.textContent="已送出："+fname; return; }catch(e){ if(e&&e.name==="AbortError"){ s.textContent="沒有下載。想下載時再按一次按鈕。"; return; } }
    }
    const url=URL.createObjectURL(pdfBlob), a=document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000); s.className="status ok"; s.textContent="已下載："+fname+"，請交給老師。"; return;
  }catch(e){ s.className="status bad"; s.textContent="這個畫面不能下載檔案。請老師打開下方「看作答紀錄」直接批改。"; }
}

let saved=null;
function checkHash(){ const h=(location.hash||"").slice(1); const r=decodeRes(h);
  if(r){ if(!TEACHER){ saved=st; } TEACHER=true; st=Object.assign({},saved||st,{ans:r.ans,t0:r.t0,t1:r.t1,i:0}); stopSpeak(); show("done"); return true; }
  return false; }
function leaveTeacher(){ if(!TEACHER)return; TEACHER=false; if(saved)st=saved; saved=null; show(st.t1?"done":"home"); }
window.addEventListener("hashchange",()=>{ if(!checkHash()) leaveTeacher(); });
applySettings();
if(!checkHash()) show(st.t1?"done":"home");
